  <rect x="404" y="186" width="52" height="40" rx="6" fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="460" y="186" width="52" height="40" rx="6" fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="516" y="186" width="52" height="40" rx="6" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <rect x="572" y="186" width="52" height="40" rx="6" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <rect x="628" y="186" width="52" height="40" rx="6" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>

  <text x="202" y="212" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600" fill="var(--blue, #2d5d7c)">six joint speeds</text>
  <text x="430" y="212" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600" fill="var(--green, #15614e)">linear</text>
  <text x="598" y="212" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600" fill="var(--gold, #b07d22)">angular</text>

  <line x1="492" y1="112" x2="516" y2="180" stroke="var(--ox, #9c3b2e)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="680" y1="112" x2="680" y2="180" stroke="var(--ox, #9c3b2e)" stroke-width="1.2" stroke-dasharray="4 4"/>

  <text x="60" y="258" class="svg-mono" font-size="9.5" fill="var(--ox, #9c3b2e)">four position numbers over three velocity numbers: a quaternion carries one redundant number.</text>
  <text x="60" y="274" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">Slot k of qpos does not correspond to slot k of qvel. Use model.jnt_qposadr and model.jnt_dofadr, never arithmetic.</text>
</svg>
