  <text x="82" y="60" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">0</text>
  <text x="130" y="60" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">1</text>
  <text x="178" y="60" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">2</text>
  <text x="226" y="60" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">3</text>
