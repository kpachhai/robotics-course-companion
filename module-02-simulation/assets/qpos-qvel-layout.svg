  <rect x="348" y="66" width="44" height="40" rx="6" fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="396" y="66" width="44" height="40" rx="6" fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="444" y="66" width="44" height="40" rx="6" fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="492" y="66" width="44" height="40" rx="6" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
