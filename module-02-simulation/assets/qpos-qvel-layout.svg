  <text x="466" y="60" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">8</text>
  <text x="514" y="60" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">9</text>
  <text x="562" y="60" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">10</text>
