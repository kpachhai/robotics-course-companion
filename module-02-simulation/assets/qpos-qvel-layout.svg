  <text x="202" y="92" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600" fill="var(--blue, #2d5d7c)">six joint angles</text>
  <text x="418" y="92" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600" fill="var(--green, #15614e)">x  y  z</text>
  <text x="586" y="92" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600" fill="var(--gold, #b07d22)">quaternion</text>

  <text x="202" y="128" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the arm</text>
  <text x="514" y="128" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the cube's free joint: where it is, and how it is turned</text>

  <text x="60" y="172" class="svg-disp" font-size="14" font-weight="700" fill="var(--blue, #2d5d7c)">data.qvel</text>
  <text x="136" y="172" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">nv = 12</text>

  <rect x="60" y="186" width="44" height="40" rx="6" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="108" y="186" width="44" height="40" rx="6" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="156" y="186" width="44" height="40" rx="6" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
