<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 286"
     role="img" aria-label="One simulation step as four stages left to right: place every body from the joint angles, find everything that is illegal, solve one system for the forces that fix it, then integrate and advance the clock, with a return arrow closing the loop one to five milliseconds later">

  <text x="380" y="26" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the cost, the tuning knobs and the strange behaviour all live in this one box</text>
  <line x1="450" y1="32" x2="450" y2="60"
        stroke="var(--muted, #6b6053)" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="24" y="60" width="146" height="80" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="36" y="80" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">1</text>
  <text x="97" y="100" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">place it all</text>
  <text x="97" y="118" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">joint angles into</text>
  <text x="97" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">world positions</text>

  <line x1="170" y1="100" x2="202" y2="100"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#osaArrowA)"/>

  <rect x="208" y="60" width="146" height="80" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="220" y="80" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">2</text>
  <text x="281" y="100" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">find what is illegal</text>
  <text x="281" y="118" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">overlaps, joint limits,</text>
  <text x="281" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">tendon limits, welds</text>

  <line x1="354" y1="100" x2="386" y2="100"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#osaArrowB)"/>

  <rect x="392" y="60" width="146" height="80" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="404" y="80" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">3</text>
  <text x="465" y="100" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">solve one system</text>
  <text x="465" y="118" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every constraint force,</text>
  <text x="465" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">agreed on at once</text>

  <line x1="538" y1="100" x2="570" y2="100"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#osaArrowC)"/>

  <rect x="576" y="60" width="140" height="80" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="588" y="80" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">4</text>
  <text x="646" y="100" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">commit</text>
  <text x="646" y="118" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">integrate, then</text>
  <text x="646" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">t += dt</text>

  <path d="M 646 140 L 646 196 L 97 196 L 97 141" fill="none"
        stroke="var(--green, #15614e)" stroke-width="1.6" marker-end="url(#osaArrowD)"/>
  <text x="372" y="216" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">and again, 1 to 5 ms of simulated time later</text>
  <text x="372" y="234" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nothing here knows about frames, rendering, or your control loop's rate</text>
  <text x="372" y="258" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a 2 ms step means 500 passes for one second of robot time</text>

  <defs>
    <marker id="osaArrowA" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="osaArrowB" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="osaArrowC" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="osaArrowD" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--green, #15614e)"/>
    </marker>
  </defs>
</svg>
