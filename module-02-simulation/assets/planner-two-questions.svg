<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280"
     role="img" aria-label="A planner box sends exactly two questions to a collision-checker box: is this single configuration free, and is this short move between two configurations free. The scene geometry sits behind the checker and no arrow reaches the planner from it">

  <rect x="20" y="80" width="170" height="86" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="105" y="112" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">the planner</text>
  <text x="105" y="132" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">samples, a tree,</text>
  <text x="105" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a nearest-neighbour search</text>

  <line x1="190" y1="104" x2="386" y2="104"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m2pTwoQArrow)"/>
  <text x="288" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">is this configuration free?</text>

  <line x1="190" y1="142" x2="386" y2="142"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m2pTwoQArrow)"/>
  <text x="288" y="136" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">is this short move free?</text>

  <line x1="386" y1="176" x2="194" y2="176"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m2pTwoQArrow)"/>
  <text x="288" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">yes, or no</text>

  <rect x="392" y="72" width="176" height="112" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="480" y="106" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">the checker</text>
  <text x="480" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nearly all the wall clock</text>
  <text x="480" y="142" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">is spent in here</text>
  <text x="480" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">~14,000 calls per second</text>

  <line x1="568" y1="128" x2="600" y2="128"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m2pTwoQArrow)"/>

  <rect x="606" y="72" width="118" height="112" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="665" y="106" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">the scene</text>
  <text x="665" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">meshes, discs,</text>
  <text x="665" y="142" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm's own</text>
  <text x="665" y="156" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">geometry</text>

  <text x="20" y="230" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">The planner never sees the scene, and it never builds the forbidden set. Swap the checker for one that reads</text>
  <text x="20" y="244" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">a MuJoCo contact list, or a six-joint arm for a two-joint one, and not a line of the planner changes.</text>

  <text x="20" y="44" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the whole interface, in two calls</text>

  <defs>
    <marker id="m2pTwoQArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
