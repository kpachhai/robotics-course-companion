<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 224" role="img" aria-label="The path from a written control value to a joint torque: the value is clipped to ctrlrange, turned into a force by the gain and bias terms, clipped again to forcerange, multiplied by the gear, and only then becomes the joint torque. The array you wrote still holds the original out-of-range number.">

  <rect x="16" y="56" width="108" height="76" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="70" y="86" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">data.ctrl</text>
  <text x="70" y="105" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you write</text>
  <text x="70" y="118" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">99.0</text>

  <line x1="124" y1="94" x2="146" y2="94"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#clampArrow)"/>

  <rect x="148" y="56" width="108" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="202" y="86" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">ctrlrange</text>
  <text x="202" y="105" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">clip to ±3.2</text>
  <text x="202" y="118" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">→ 3.2</text>

  <line x1="256" y1="94" x2="278" y2="94"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#clampArrow)"/>

  <rect x="280" y="56" width="108" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="334" y="86" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">gain, bias</text>
  <text x="334" y="105" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the PD line</text>
  <text x="334" y="118" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">→ 25.6</text>

  <line x1="388" y1="94" x2="410" y2="94"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#clampArrow)"/>

  <rect x="412" y="56" width="108" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="466" y="86" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">forcerange</text>
  <text x="466" y="105" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">clip to ±3</text>
  <text x="466" y="118" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">→ 3.0</text>

  <line x1="520" y1="94" x2="542" y2="94"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#clampArrow)"/>

  <rect x="544" y="56" width="88" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="588" y="86" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">gear</text>
  <text x="588" y="105" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">× 1 here</text>
  <text x="588" y="118" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">→ 3.0</text>

  <line x1="632" y1="94" x2="654" y2="94"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#clampArrow)"/>

  <rect x="656" y="56" width="92" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="702" y="82" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">qfrc</text>
  <text x="702" y="98" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">_actuator</text>
  <text x="702" y="117" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">at the joint</text>

  <path d="M70 132 L70 168 L196 168" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.1" stroke-dasharray="4 4"/>
  <text x="202" y="165" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">data.ctrl still reads 99.0 afterwards. Every clamp happens on a copy,</text>
  <text x="202" y="180" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">so the array you inspect is your intention, never the simulator's action.</text>

  <defs>
    <marker id="clampArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
