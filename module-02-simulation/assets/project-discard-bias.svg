<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 340" role="img" aria-label="Two views of the same sampling box: on the left every attempted cube position including the ones in the far band where the expert fails, on the right only the positions kept in the demonstration set, where that band is empty because failures were discarded">

  <text x="90" y="46" class="svg-disp" font-size="14" font-weight="700" fill="var(--blue, #2d5d7c)">what you sampled</text>
  <text x="90" y="62" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">100 attempts, uniform in the box</text>

  <rect x="244" y="70" width="26" height="180" fill="var(--ox-soft, #f1ddd6)" stroke="none"/>
  <rect x="90" y="70" width="180" height="180" rx="6" fill="none" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <g fill="var(--blue, #2d5d7c)">
    <circle cx="105" cy="90" r="3.4"/><circle cx="140" cy="78" r="3.4"/><circle cx="180" cy="95" r="3.4"/><circle cx="215" cy="84" r="3.4"/>
    <circle cx="112" cy="120" r="3.4"/><circle cx="150" cy="132" r="3.4"/><circle cx="196" cy="118" r="3.4"/><circle cx="230" cy="140" r="3.4"/>
    <circle cx="120" cy="160" r="3.4"/><circle cx="158" cy="150" r="3.4"/><circle cx="200" cy="170" r="3.4"/><circle cx="238" cy="158" r="3.4"/>
    <circle cx="100" cy="200" r="3.4"/><circle cx="145" cy="208" r="3.4"/><circle cx="185" cy="196" r="3.4"/><circle cx="222" cy="214" r="3.4"/>
    <circle cx="130" cy="238" r="3.4"/><circle cx="170" cy="230" r="3.4"/><circle cx="210" cy="242" r="3.4"/><circle cx="240" cy="196" r="3.4"/>
  </g>
  <g fill="var(--ox, #9c3b2e)">
    <circle cx="255" cy="96" r="3.8"/><circle cx="259" cy="128" r="3.8"/><circle cx="253" cy="206" r="3.8"/>
  </g>
  <text x="257" y="266" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--ox, #9c3b2e)">3 fail here</text>

  <line x1="292" y1="160" x2="352" y2="160" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#arrowDiscardBias)"/>
  <text x="322" y="152" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">keep successes</text>

  <text x="430" y="46" class="svg-disp" font-size="14" font-weight="700" fill="var(--green, #15614e)">what you shipped</text>
  <text x="430" y="62" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">50 demonstrations, all of them successes</text>

  <rect x="584" y="70" width="26" height="180" fill="var(--ox-soft, #f1ddd6)" stroke="none"/>
  <rect x="430" y="70" width="180" height="180" rx="6" fill="none" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <g fill="var(--green, #15614e)">
    <circle cx="445" cy="90" r="3.4"/><circle cx="480" cy="78" r="3.4"/><circle cx="520" cy="95" r="3.4"/><circle cx="555" cy="84" r="3.4"/>
    <circle cx="452" cy="120" r="3.4"/><circle cx="490" cy="132" r="3.4"/><circle cx="536" cy="118" r="3.4"/><circle cx="570" cy="140" r="3.4"/>
    <circle cx="460" cy="160" r="3.4"/><circle cx="498" cy="150" r="3.4"/><circle cx="540" cy="170" r="3.4"/><circle cx="578" cy="158" r="3.4"/>
    <circle cx="440" cy="200" r="3.4"/><circle cx="485" cy="208" r="3.4"/><circle cx="525" cy="196" r="3.4"/><circle cx="562" cy="214" r="3.4"/>
    <circle cx="470" cy="238" r="3.4"/><circle cx="510" cy="230" r="3.4"/><circle cx="550" cy="242" r="3.4"/><circle cx="580" cy="196" r="3.4"/>
  </g>
  <text x="597" y="266" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">empty</text>

  <text x="40" y="296" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">Dropping failures moves the demonstrations off the region you measured.</text>
  <text x="40" y="312" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">A policy cloned from the right is evaluated on the left, and meets that band for the first time there.</text>
  <text x="40" y="328" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">Keep none of the failures if you like, but record where they were.</text>

  <defs>
    <marker id="arrowDiscardBias" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
