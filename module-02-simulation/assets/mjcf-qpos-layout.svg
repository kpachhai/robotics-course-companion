<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" role="img" aria-label="The nine-number qpos vector of the two-link scene, split by joint: one number for the shoulder hinge, one for the elbow hinge, then seven for the cube's free joint, three of position and four of quaternion. The tree order decides the layout.">

  <text x="124" y="40" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">shoulder</text>
  <path d="M94 52 L94 60 M94 56 L154 56 M154 52 L154 60"
        fill="none" stroke="var(--blue, #2d5d7c)" stroke-width="1.3"/>

  <text x="188" y="40" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">elbow</text>
  <path d="M158 52 L158 60 M158 56 L218 56 M218 52 L218 60"
        fill="none" stroke="var(--green, #15614e)" stroke-width="1.3"/>

  <text x="444" y="26" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">cube, one free joint</text>
  <text x="444" y="42" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">three of position, then four of quaternion, in that order</text>
  <path d="M222 52 L222 60 M222 56 L666 56 M666 52 L666 60"
        fill="none" stroke="var(--gold, #b07d22)" stroke-width="1.3"/>

  <rect x="92" y="70" width="62" height="50" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="123" y="101" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">-0.9</text>
  <text x="123" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">qpos[0]</text>

  <rect x="156" y="70" width="62" height="50" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="187" y="101" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">1.6</text>
  <text x="187" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">qpos[1]</text>

  <rect x="220" y="70" width="62" height="50" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="251" y="101" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">0.42</text>
  <text x="251" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">qpos[2] x</text>

  <rect x="284" y="70" width="62" height="50" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="315" y="101" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">0</text>
  <text x="315" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">qpos[3] y</text>

  <rect x="348" y="70" width="62" height="50" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="379" y="101" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">0.03</text>
  <text x="379" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">qpos[4] z</text>

  <rect x="412" y="70" width="62" height="50" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="443" y="101" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">1</text>
  <text x="443" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">qpos[5] w</text>

  <rect x="476" y="70" width="62" height="50" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="507" y="101" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">0</text>
  <text x="507" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">qpos[6] x</text>

  <rect x="540" y="70" width="62" height="50" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="571" y="101" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">0</text>
  <text x="571" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">qpos[7] y</text>

  <rect x="604" y="70" width="62" height="50" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="635" y="101" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">0</text>
  <text x="635" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">qpos[8] z</text>

  <path d="M412 149 L412 161 M412 155 L666 155 M666 149 L666 161"
        fill="none" stroke="var(--gold, #b07d22)" stroke-width="1.3"/>
  <text x="539" y="180" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a quaternion takes four numbers to store but only three to change,</text>
  <text x="539" y="193" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">which is why nq is 9 here and nv is 8</text>
</svg>
