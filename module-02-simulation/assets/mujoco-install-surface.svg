<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 288" role="img" aria-label="One pip install command produces four things: the mujoco Python package with the native engine inside the same wheel, an mjpython launcher placed in the virtual environment's bin directory, the glfw and pyopengl windowing libraries, and three support libraries. No licence key and no separate engine download.">

  <rect x="24" y="100" width="190" height="72" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="119" y="130" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">pip install mujoco</text>
  <text x="119" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no licence key, no engine</text>
  <text x="119" y="163" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">download, no Homebrew</text>

  <line x1="214" y1="136" x2="244" y2="136"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="244" y1="42" x2="244" y2="246"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <line x1="244" y1="42" x2="264" y2="42"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#instSurfArrow)"/>
  <line x1="244" y1="110" x2="264" y2="110"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#instSurfArrow)"/>
  <line x1="244" y1="178" x2="264" y2="178"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#instSurfArrow)"/>
  <line x1="244" y1="246" x2="264" y2="246"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#instSurfArrow)"/>

  <rect x="272" y="14" width="440" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="292" y="38" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">mujoco</text>
  <text x="292" y="56" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the Python API and the native engine, in the same wheel</text>

  <rect x="272" y="82" width="440" height="56" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="292" y="106" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">mjpython</text>
  <text x="292" y="124" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a launcher dropped in .venv/bin, used only on macOS</text>

  <rect x="272" y="150" width="440" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="292" y="174" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">glfw, pyopengl</text>
  <text x="292" y="192" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">windows and OpenGL, pulled in for you</text>

  <rect x="272" y="218" width="440" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="292" y="242" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">absl-py, etils, numpy</text>
  <text x="292" y="260" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">support libraries; numpy you already had</text>

  <defs>
    <marker id="instSurfArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
