<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300"
     role="img" aria-label="A height scale from the table top upward: the bin walls at 3.2 centimetres, the cube top at 4 centimetres, the carried cube's underside at 4.5 centimetres, and the arm's highest vertical-gripper pose at 9 centimetres, with the clearance band between the wall top and the carried cube marked">

  <line x1="90" y1="252" x2="640" y2="252"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <text x="90" y="270" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">table top, z = 0</text>

  <line x1="120" y1="252" x2="120" y2="58"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <text x="112" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">z</text>

  <rect x="150" y="188" width="130" height="64" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="215" y="216" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">bin walls</text>
  <text x="215" y="232" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">3.2 cm</text>

  <rect x="320" y="172" width="80" height="80" rx="4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="360" y="208" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">cube</text>
  <text x="360" y="224" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">4 cm, at rest</text>

  <rect x="440" y="82" width="80" height="80" rx="4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"
        stroke-dasharray="4 4"/>
  <text x="480" y="118" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">cube</text>
  <text x="480" y="134" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">carried</text>

  <line x1="120" y1="162" x2="560" y2="162"
        stroke="var(--muted, #6b6053)" stroke-width="1.1" stroke-dasharray="4 4"/>
  <text x="566" y="159" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">4.5 cm  underside of the carried cube</text>

  <line x1="120" y1="188" x2="290" y2="188"
        stroke="var(--muted, #6b6053)" stroke-width="1.1" stroke-dasharray="4 4"/>

  <line x1="300" y1="188" x2="300" y2="162"
        stroke="var(--gold, #b07d22)" stroke-width="1.6"
        marker-start="url(#sceneHeightUp)" marker-end="url(#sceneHeightDown)"/>
  <text x="308" y="180" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">1.3 cm of clearance</text>

  <line x1="120" y1="72" x2="620" y2="72"
        stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="126" y="66" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">9.0 cm</text>
  <text x="190" y="66" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">highest pose with the gripper still vertical, measured at radius 0.20 m</text>

  <defs>
    <marker id="sceneHeightUp" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="var(--gold, #b07d22)"/>
    </marker>
    <marker id="sceneHeightDown" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--gold, #b07d22)"/>
    </marker>
  </defs>
</svg>
