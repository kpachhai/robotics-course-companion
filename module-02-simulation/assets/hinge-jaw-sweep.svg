<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300"
     role="img" aria-label="Side view of the gripper closing on the cube. The fixed finger is a vertical wall the arm must not hit on the way down. The moving jaw is on a hinge, so its tip travels along an arc that starts 7.6 centimetres forward and 3.5 centimetres high and sweeps down and back into the cube's far face, which is why the approach tolerance is one-sided">

  <rect x="192" y="44" width="10" height="118" rx="2"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="200" cy="164" r="4"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.4"/>
  <text x="150" y="40" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">fixed finger</text>
  <text x="150" y="56" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">never moves;</text>
  <text x="150" y="70" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm descends</text>
  <text x="150" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">right alongside it</text>

  <rect x="200" y="106" width="88" height="88" rx="3"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="244" y="155" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">cube</text>
  <text x="244" y="171" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">4 cm</text>

  <path d="M 411 73 Q 372 104 356 130 Q 336 148 321 150 Q 302 155 288 157 L 235 157"
        fill="none" stroke="var(--green, #15614e)" stroke-width="1.6" stroke-dasharray="5 4"
        marker-end="url(#jawArrow)"/>

  <circle cx="411" cy="73" r="4.5" fill="var(--green-soft, #e3ede7)"
          stroke="var(--green, #15614e)" stroke-width="1.5"/>
  <circle cx="356" cy="130" r="4.5" fill="var(--green-soft, #e3ede7)"
          stroke="var(--green, #15614e)" stroke-width="1.5"/>
  <circle cx="321" cy="150" r="4.5" fill="var(--green-soft, #e3ede7)"
          stroke="var(--green, #15614e)" stroke-width="1.5"/>
  <circle cx="288" cy="157" r="4.5" fill="var(--green-soft, #e3ede7)"
          stroke="var(--green, #15614e)" stroke-width="1.5"/>

  <text x="420" y="68" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">open, 1.20 rad</text>
  <text x="364" y="126" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">0.73 rad</text>
  <text x="329" y="146" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">0.50 rad</text>
  <text x="296" y="180" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">0.30 rad, first touch</text>

  <text x="420" y="110" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">moving jaw tip</text>
  <text x="420" y="126" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">a hinge, not a slide:</text>
  <text x="420" y="140" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">it comes down and back,</text>
  <text x="420" y="154" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">sweeping a long way in</text>
  <text x="420" y="168" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">front of the fixed finger</text>

  <line x1="200" y1="212" x2="288" y2="212"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <line x1="200" y1="206" x2="200" y2="218"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <line x1="288" y1="206" x2="288" y2="218"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>

  <text x="40" y="252" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">approach a few millimetres too near and the fixed finger shoves the cube away before the jaw ever closes;</text>
  <text x="40" y="268" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">approach three centimetres too far and the sweeping jaw still gathers it in</text>

  <defs>
    <marker id="jawArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--green, #15614e)"/>
    </marker>
  </defs>
</svg>
