<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300"
     role="img" aria-label="Two verification loops separated by the moment the robot moves. The planner produces a path that is checked against a model as many times as you like before any motion happens. The policy produces motion first, and the only check available afterwards is a success rate over a stated number of trials">

  <line x1="470" y1="34" x2="470" y2="252"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="470" y="26" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the robot moves here</text>

  <rect x="20" y="52" width="140" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="90" y="80" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">plan</text>
  <text x="90" y="100" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">geometry in</text>

  <line x1="160" y1="84" x2="204" y2="84"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m2pVerifyArrow)"/>

  <rect x="210" y="52" width="150" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="285" y="80" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">a list of numbers</text>
  <text x="285" y="100" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">re-check, bound, replay</text>

  <path d="M285,116 L285,140 L90,140 L90,120" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m2pVerifyArrow)"/>
  <text x="188" y="154" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">as many times as you like, with no robot</text>

  <line x1="360" y1="84" x2="500" y2="84"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m2pVerifyArrow)"/>

  <rect x="506" y="52" width="140" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="576" y="80" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the motion</text>
  <text x="576" y="100" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">already checked</text>

  <rect x="20" y="184" width="140" height="64" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="90" y="212" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">policy</text>
  <text x="90" y="232" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">observations in</text>

  <line x1="160" y1="216" x2="500" y2="216"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m2pVerifyArrow)"/>
  <text x="330" y="208" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nothing to inspect on the way past</text>

  <rect x="506" y="184" width="140" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="576" y="212" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the motion</text>
  <text x="576" y="232" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">not yet checked</text>

  <line x1="646" y1="216" x2="676" y2="216"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m2pVerifyArrow)"/>
  <text x="684" y="206" class="svg-mono" font-size="9.5" fill="var(--gold, #b07d22)">watch it,</text>
  <text x="684" y="220" class="svg-mono" font-size="9.5" fill="var(--gold, #b07d22)">count it</text>

  <path d="M700,228 L700,262 L90,262 L90,252" fill="none"
        stroke="var(--gold, #b07d22)" stroke-width="1.3" marker-end="url(#m2pVerifyGold)"/>
  <text x="390" y="276" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the only answer available is a rate with a denominator, and it costs a robot and a trial count</text>

  <defs>
    <marker id="m2pVerifyArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m2pVerifyGold" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--gold, #b07d22)"/>
    </marker>
  </defs>
</svg>
