<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292"
     role="img" aria-label="The same three lines of an integrator in two orders. On the left the position update runs before the velocity update, so it consumes a velocity that is already out of date and the spring gains energy without bound. On the right the velocity update runs first, and the energy stays put">

  <text x="180" y="30" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">explicit Euler</text>
  <text x="540" y="30" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">semi-implicit Euler</text>

  <rect x="30" y="44" width="300" height="140" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="86" y="80" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">a = force / mass</text>
  <text x="86" y="122" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">x = x + v · dt</text>
  <text x="86" y="164" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">v = v + a · dt</text>

  <path d="M 60 60 L 60 118 L 76 118" fill="none"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.6" marker-end="url(#uoArrowA)"/>
  <text x="46" y="54" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">v as it arrived</text>

  <text x="180" y="208" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the position moves using a velocity that is already stale</text>
  <text x="180" y="238" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">20 s on a spring: energy × 439,000,000</text>

  <rect x="390" y="44" width="300" height="140" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="446" y="80" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">a = force / mass</text>
  <text x="446" y="122" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">v = v + a · dt</text>
  <text x="446" y="164" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">x = x + v · dt</text>

  <path d="M 444 118 L 420 118 L 420 160 L 440 160" fill="none"
        stroke="var(--green, #15614e)" stroke-width="1.6" marker-end="url(#uoArrowB)"/>

  <text x="540" y="208" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the position moves using the velocity from this step</text>
  <text x="540" y="238" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">20 s on a spring: energy × 1.05</text>

  <text x="360" y="272" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same forces, same timestep, same three lines: only the order of the last two changed</text>

  <defs>
    <marker id="uoArrowA" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
    <marker id="uoArrowB" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--green, #15614e)"/>
    </marker>
  </defs>
</svg>
