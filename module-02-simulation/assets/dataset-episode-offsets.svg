<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 332" role="img" aria-label="In LeRobot v3 an episode is a row range rather than a file: the episode metadata holds byte and frame offsets that point into one shared Parquet file of numeric columns and one shared MP4 per camera, so episode seven is a slice of both rather than a folder of its own">

  <text x="40" y="28" class="svg-disp" font-size="14" font-weight="700" fill="var(--green, #15614e)">meta/episodes/</text>
  <text x="163" y="28" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">length, task and offsets, one record per episode</text>

  <rect x="40" y="44" width="180" height="30" rx="8" fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="56" y="64" class="svg-mono" font-size="9.5" fill="var(--green, #15614e)">episode 6   rows 1240-1418</text>

  <rect x="40" y="80" width="180" height="30" rx="8" fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="2.4"/>
  <text x="56" y="100" class="svg-mono" font-size="9.5" fill="var(--green, #15614e)">episode 7   rows 1419-1584</text>

  <rect x="40" y="116" width="180" height="30" rx="8" fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="56" y="136" class="svg-mono" font-size="9.5" fill="var(--green, #15614e)">episode 8   rows 1584-1742</text>

  <line x1="224" y1="95" x2="290" y2="95" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#arrowOffsetsA)"/>
  <line x1="224" y1="95" x2="290" y2="215" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#arrowOffsetsB)"/>

  <text x="296" y="60" class="svg-disp" font-size="14" font-weight="700" fill="var(--blue, #2d5d7c)">data/chunk-000/file-000.parquet</text>
  <text x="296" y="76" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">every numeric column for many episodes, in one file</text>

  <rect x="296" y="84" width="90" height="26" rx="5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.4"/>
  <rect x="388" y="84" width="70" height="26" rx="5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.4"/>
  <rect x="460" y="84" width="66" height="26" rx="5" fill="var(--blue, #2d5d7c)" stroke="var(--blue, #2d5d7c)" stroke-width="1.4"/>
  <rect x="528" y="84" width="62" height="26" rx="5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.4"/>
  <rect x="592" y="84" width="118" height="26" rx="5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.4"/>
  <text x="493" y="126" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--blue, #2d5d7c)">episode 7</text>

  <text x="296" y="180" class="svg-disp" font-size="14" font-weight="700" fill="var(--gold, #b07d22)">videos/observation.images.overhead/…/file-000.mp4</text>
  <text x="296" y="196" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">every frame from that camera for the same episodes, encoded once</text>

  <rect x="296" y="204" width="90" height="26" rx="5" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.4"/>
  <rect x="388" y="204" width="70" height="26" rx="5" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.4"/>
  <rect x="460" y="204" width="66" height="26" rx="5" fill="var(--gold, #b07d22)" stroke="var(--gold, #b07d22)" stroke-width="1.4"/>
  <rect x="528" y="204" width="62" height="26" rx="5" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.4"/>
  <rect x="592" y="204" width="118" height="26" rx="5" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.4"/>
  <text x="493" y="246" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--gold, #b07d22)">the same 166 frames, as video</text>

  <text x="40" y="282" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">Storage is decoupled from the API: you ask for episode 7 and the loader resolves it through the offsets.</text>
  <text x="40" y="298" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">Adding a fifty-first episode does not add a fifty-first file.</text>
  <text x="40" y="320" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">Measured on lerobot/svla_so101_pickplace: 50 episodes, 11,939 frames, 86.1 MB, of which 85.7 MB is video.</text>

  <defs>
    <marker id="arrowOffsetsA" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="arrowOffsetsB" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
