<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300"
     role="img" aria-label="The same arm pose drawn two ways: on the left the two links occupy a region of the workspace beside a disc, and on the right the identical pose is a single dot in a square whose horizontal axis is the shoulder angle and whose vertical axis is the elbow angle">

  <text x="30" y="34" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">workspace: the arm occupies a region</text>

  <circle cx="191" cy="116" r="16"
          fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="216" y="106" class="svg-mono" font-size="9.5"
        fill="var(--ox, #9c3b2e)">obstacle</text>
  <line x1="212" y1="103" x2="204" y2="110"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>

  <line x1="110" y1="215" x2="166" y2="145"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>
  <line x1="166" y1="145" x2="129" y2="94"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="215" r="5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="166" cy="145" r="5" fill="var(--blue, #2d5d7c)"/>

  <text x="86" y="234" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">base</text>
  <line x1="90" y1="230" x2="106" y2="219"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="186" y="176" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">elbow</text>
  <line x1="184" y1="172" x2="171" y2="151"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>

  <line x1="300" y1="150" x2="356" y2="150"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m2pTwoNumArrow)"/>
  <text x="328" y="142" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one point</text>

  <text x="430" y="34" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">configuration space: the arm is a dot</text>

  <rect x="430" y="40" width="210" height="210" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>

  <line x1="565" y1="250" x2="565" y2="106" stroke-dasharray="4 4"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <line x1="430" y1="102" x2="561" y2="102" stroke-dasharray="4 4"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <circle cx="565" cy="102" r="6" fill="var(--blue, #2d5d7c)"/>

  <text x="565" y="268" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">shoulder <tspan font-size="10">&#952;</tspan><tspan font-size="9.5" dy="3">1</tspan></text>
  <text x="424" y="102" text-anchor="end" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">elbow <tspan font-size="10">&#952;</tspan><tspan font-size="9.5" dy="3">2</tspan></text>

  <text x="556" y="88" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">q = (0.90, 1.30)</text>

  <text x="436" y="60" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">every legal pose of the arm</text>
  <text x="436" y="74" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">is somewhere in this square</text>

  <text x="656" y="252" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">both axes run</text>
  <text x="656" y="266" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">from -&#960; to +&#960;</text>

  <defs>
    <marker id="m2pTwoNumArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
