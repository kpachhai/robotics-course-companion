<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="The teleoperation loop: a key press nudges a target point, one damped least squares step turns that point into joint commands, the physics advances five milliseconds, and the commanded angles feed back as the next step's warm start; nothing feeds the tool tip's true position back to the target">

  <path d="M665,96 V52 H285 V96" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.3"
        stroke-dasharray="4 4" marker-end="url(#teleopLoopArrowRed)"/>
  <text x="475" y="44" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--ox, #9c3b2e)">not wired up: nothing checks where the tip really went</text>

  <rect x="20" y="96" width="150" height="72" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="126" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">key press</text>
  <text x="95" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one callback, one nudge</text>

  <line x1="170" y1="132" x2="206" y2="132" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#teleopLoopArrow)"/>
  <text x="188" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">5 mm</text>

  <rect x="210" y="96" width="150" height="72" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="285" y="126" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">target point</text>
  <text x="285" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">three numbers, world frame</text>

  <line x1="360" y1="132" x2="396" y2="132" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#teleopLoopArrow)"/>

  <rect x="400" y="96" width="150" height="72" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="475" y="126" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">one IK step</text>
  <text x="475" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">not solved, only improved</text>

  <line x1="550" y1="132" x2="586" y2="132" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#teleopLoopArrow)"/>
  <text x="568" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">ctrl</text>

  <rect x="590" y="96" width="150" height="72" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="665" y="126" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">5 ms of physics</text>
  <text x="665" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">servos, gravity, contact</text>

  <path d="M505,168 V204 H445 V168" fill="none" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#teleopLoopArrow)"/>
  <text x="475" y="222" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">warm start: last frame's answer</text>

  <text x="380" y="258" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the whole row runs 200 times a second</text>

  <defs>
    <marker id="teleopLoopArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="teleopLoopArrowRed" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
