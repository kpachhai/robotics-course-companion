<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 268"
     role="img" aria-label="Three conditions chained left to right - inside the bin footprint, low enough, at rest and released - feeding one success verdict, with the specific false positive each condition rejects hanging beneath it">

  <rect x="16" y="30" width="180" height="60" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="106" y="54" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">inside the footprint</text>
  <text x="106" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">|xy - bin_xy| &lt; 5 cm</text>

  <rect x="228" y="30" width="180" height="60" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="318" y="54" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">low enough</text>
  <text x="318" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">z &lt; 5 cm</text>

  <rect x="440" y="30" width="180" height="60" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="530" y="54" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">at rest, released</text>
  <text x="530" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">|v| &lt; 0.02, no finger contact</text>

  <line x1="196" y1="60" x2="228" y2="60"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#gateArrow)"/>
  <line x1="408" y1="60" x2="440" y2="60"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#gateArrow)"/>
  <line x1="620" y1="60" x2="652" y2="60"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#gateArrow)"/>

  <circle cx="690" cy="60" r="34"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="690" y="65" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">success</text>

  <line x1="106" y1="90" x2="106" y2="140"
        stroke="var(--muted, #6b6053)" stroke-width="1.1" stroke-dasharray="4 4"/>
  <line x1="318" y1="90" x2="318" y2="140"
        stroke="var(--muted, #6b6053)" stroke-width="1.1" stroke-dasharray="4 4"/>
  <line x1="530" y1="90" x2="530" y2="140"
        stroke="var(--muted, #6b6053)" stroke-width="1.1" stroke-dasharray="4 4"/>

  <rect x="16" y="140" width="180" height="76" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="106" y="164" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">drop this one and</text>
  <text x="106" y="184" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a cube that landed</text>
  <text x="106" y="198" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">beside the bin</text>
  <text x="106" y="212" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">scores a success</text>

  <rect x="228" y="140" width="180" height="76" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="318" y="164" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">drop this one and</text>
  <text x="318" y="184" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a cube held in the air</text>
  <text x="318" y="198" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">above the bin</text>
  <text x="318" y="212" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">scores a success</text>

  <rect x="440" y="140" width="180" height="76" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="530" y="164" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">drop this one and</text>
  <text x="530" y="184" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a cube passing through</text>
  <text x="530" y="198" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">on its way out</text>
  <text x="530" y="212" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">scores a success</text>

  <text x="16" y="242" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every condition you leave out is a class of failure your dataset will call expert behaviour</text>

  <defs>
    <marker id="gateArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
