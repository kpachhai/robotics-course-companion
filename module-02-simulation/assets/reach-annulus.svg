<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350"
     role="img" aria-label="Top view of the task scene: a square table, the arm base at the origin, and a shaded crescent showing the region where a top-down grasp pose exists, covering about a quarter of the table. The cube start position sits inside the crescent and the bin sits inside it to one side">

  <rect x="201" y="33" width="274" height="274" rx="4"
        fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <text x="205" y="322" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">table, 0.72 m square</text>

  <path d="M 263.7 269.6 A 106 106 0 1 0 263.7 70.4 L 283.2 124.0 A 49 49 0 1 1 283.2 216.0 Z"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>

  <circle cx="300" cy="170" r="8"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="300" y="196" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">arm base</text>

  <rect x="376" y="162" width="16" height="16" rx="2"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="400" y="168" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">cube</text>
  <text x="400" y="182" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">x = 0.22 m</text>

  <rect x="296" y="219" width="46" height="46" rx="3"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="319" y="246" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">bin</text>

  <line x1="497" y1="120" x2="420" y2="145"
        stroke="var(--muted, #6b6053)" stroke-width="1.1" marker-end="url(#reachArrow)"/>
  <text x="503" y="110" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">27% of the table</text>
  <text x="503" y="126" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every spot where a</text>
  <text x="503" y="140" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">straight-down grasp pose</text>
  <text x="503" y="154" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">exists at all</text>

  <text x="503" y="184" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the hole in the middle is</text>
  <text x="503" y="198" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">too close, the outside is</text>
  <text x="503" y="212" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">too far, and the wedge</text>
  <text x="503" y="226" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">behind is the pan limit</text>

  <defs>
    <marker id="reachArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
