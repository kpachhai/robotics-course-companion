<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" role="img" aria-label="Four steps in order: RT-1 in 2022 added one network for many tasks with actions as discrete tokens; RT-2 in 2023 wrote actions into the model's own vocabulary and co-trained on web data; Open X-Embodiment in 2023 pooled twenty-two robot bodies into one dataset; OpenVLA in 2024 published weights, code and a fine-tuning path">

  <text x="96" y="34" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Dec 2022</text>
  <text x="285" y="34" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Jul 2023</text>
  <text x="474" y="34" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Oct 2023</text>
  <text x="663" y="34" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Jun 2024</text>

  <rect x="14" y="44" width="165" height="86" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="96" y="70" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">RT-1</text>
  <text x="96" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one network,</text>
  <text x="96" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">many tasks, actions</text>
  <text x="96" y="120" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">as discrete tokens</text>

  <line x1="181" y1="87" x2="201" y2="87"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5LineageArrow)"/>

  <rect x="203" y="44" width="165" height="86" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="285" y="70" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">RT-2</text>
  <text x="285" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">actions in the model's</text>
  <text x="285" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">own vocabulary,</text>
  <text x="285" y="120" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">co-trained with the web</text>

  <line x1="370" y1="87" x2="390" y2="87"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5LineageArrow)"/>

  <rect x="392" y="44" width="165" height="86" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="474" y="70" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Open X-Embodiment</text>
  <text x="474" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">22 robot bodies</text>
  <text x="474" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pooled into one</text>
  <text x="474" y="120" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">standardized dataset</text>

  <line x1="559" y1="87" x2="579" y2="87"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5LineageArrow)"/>

  <rect x="581" y="44" width="165" height="86" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="663" y="70" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">OpenVLA</text>
  <text x="663" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">weights, code, recipe</text>
  <text x="663" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and a fine-tuning path,</text>
  <text x="663" y="120" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">published</text>

  <text x="14" y="160" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">each step adds exactly one thing, and each is removable: name what breaks and you have the lesson</text>
  <text x="14" y="176" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">everything after mid-2024 refines the action head and the training recipe, not this spine</text>

  <defs>
    <marker id="m5LineageArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
