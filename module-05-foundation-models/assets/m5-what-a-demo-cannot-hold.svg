<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="A behaviour-cloned policy fitted to fifty episodes of pixels and joint angles has no input port for a spoken request, for an object that was never demonstrated, or for the knowledge that something has gone wrong">

  <rect x="20" y="104" width="176" height="92" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="108" y="136" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Your 50 episodes</text>
  <text x="108" y="158" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pixels in, joint angles out</text>
  <text x="108" y="174" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one task, one object</text>

  <line x1="196" y1="150" x2="230" y2="150"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5DemoFit)"/>

  <rect x="236" y="88" width="176" height="124" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="324" y="134" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Behaviour-cloned</text>
  <text x="324" y="154" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">policy</text>
  <text x="324" y="180" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">fitted to those pixels</text>

  <line x1="452" y1="30" x2="452" y2="252"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.4" stroke-dasharray="4 4"/>

  <rect x="486" y="30" width="250" height="60" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="611" y="54" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">A request</text>
  <text x="611" y="74" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">&#8220;the blue one&#8221;, &#8220;no, try again&#8221;</text>

  <rect x="486" y="110" width="250" height="60" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="611" y="134" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">An object you never showed</text>
  <text x="611" y="154" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nothing forced it to learn &#8220;block&#8221;</text>

  <rect x="486" y="190" width="250" height="60" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="611" y="214" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">What going wrong looks like</text>
  <text x="611" y="234" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every episode you recorded succeeded</text>

  <line x1="486" y1="60" x2="458" y2="60"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m5DemoBlocked)"/>
  <line x1="486" y1="140" x2="458" y2="140"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m5DemoBlocked)"/>
  <line x1="486" y1="220" x2="458" y2="220"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m5DemoBlocked)"/>

  <text x="452" y="274" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">no input port exists for any of these, at any dataset size</text>

  <defs>
    <marker id="m5DemoFit" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m5DemoBlocked" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
