<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Two ways to join the slow half of a policy to the fast half. On the left a hidden-state tensor crosses the boundary and nothing about the handoff is readable. On the right an English sentence crosses, so the handoff appears in a log">
  <text x="200" y="30" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">a tensor crosses</text>
  <text x="560" y="30" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">a sentence crosses</text>

  <rect x="40" y="44" width="320" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="200" y="66" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">the slow half</text>
  <text x="200" y="82" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reads the scene, works out what the task means</text>

  <line x1="200" y1="92" x2="200" y2="108" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5IfaceArrow)"/>

  <rect x="70" y="112" width="260" height="32" rx="8" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="200" y="132" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">[ -0.41, 1.02, 0.77, ... ]</text>

  <line x1="200" y1="144" x2="200" y2="160" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5IfaceArrow)"/>

  <rect x="40" y="164" width="320" height="48" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="200" y="186" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">the fast half</text>
  <text x="200" y="202" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">turns it into motor commands</text>

  <text x="40" y="238" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">when it fails you get a video and a vector.</text>
  <text x="40" y="254" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the two halves only mean anything together.</text>

  <line x1="380" y1="20" x2="380" y2="264" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>

  <rect x="400" y="44" width="320" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="560" y="66" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">the slow half</text>
  <text x="560" y="82" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reads the scene, works out what the task means</text>

  <line x1="560" y1="92" x2="560" y2="108" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5IfaceArrow)"/>

  <rect x="430" y="112" width="260" height="32" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="560" y="132" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">"put the ketchup on the middle shelf"</text>

  <line x1="560" y1="144" x2="560" y2="160" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5IfaceArrow)"/>

  <rect x="400" y="164" width="320" height="48" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="560" y="186" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">the fast half</text>
  <text x="560" y="202" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">turns it into motor commands</text>

  <text x="400" y="238" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">when it fails you get a video and a line you can read.</text>
  <text x="400" y="254" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">you can tell which half was wrong.</text>

  <defs>
    <marker id="m5IfaceArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
