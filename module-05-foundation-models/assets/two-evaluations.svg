<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="The same model evaluated twice. On the vendor's own fifteen-task suite it leads the reference model by seventeen and a half points. On an independent laboratory's four-task SO-101 benchmark the same model trails the same reference model by five points. The sign of the difference reverses.">

  <text x="30" y="34" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Measured by the lab that built it</text>
  <text x="30" y="52" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">its own 15-task suite</text>

  <line x1="200" y1="70" x2="200" y2="160" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <rect x="200" y="92" width="61" height="44" rx="4"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="271" y="112" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">+17.5</text>
  <text x="271" y="130" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">vs pi0.5</text>
  <text x="200" y="182" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">0 = ties pi0.5</text>

  <line x1="380" y1="20" x2="380" y2="200" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>

  <text x="404" y="34" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Measured by an independent lab</text>
  <text x="404" y="52" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">SO-101, 4 tasks, 20 trials per cell</text>

  <line x1="620" y1="70" x2="620" y2="160" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <rect x="602" y="92" width="18" height="44" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="594" y="112" text-anchor="end" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">-5.0</text>
  <text x="594" y="130" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">vs pi0.5</text>
  <text x="620" y="182" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">0 = ties pi0.5</text>

  <text x="380" y="228" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">Same model. Same reference model. Opposite sign.</text>
</svg>
