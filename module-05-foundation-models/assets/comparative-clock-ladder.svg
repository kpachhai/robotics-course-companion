<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="A logarithmic rate axis from 1 hertz to 1 kilohertz with three designs placed on it. Pi zero point five runs its backbone and action expert together at up to 50 hertz. GR00T N1.7 runs its backbone and diffusion head at about 36 hertz. Helix 02 spreads across three rates: System 2 at roughly 1 hertz, System 1 at 200 hertz and System 0 at 1 kilohertz. Pi zero point five and GR00T leave the kilohertz rate to the robot's own servo loop.">

  <text x="380" y="18" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">one axis: how often each block has to produce an answer</text>

  <text x="92" y="82" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">&#960;<tspan font-size="9.5" dy="2">0.5</tspan></text>
  <line x1="110" y1="78" x2="700" y2="78" stroke="var(--line-2, #c8bca3)" stroke-width="1.1"/>
  <circle cx="443" cy="78" r="7" fill="var(--blue-soft, #dfeaf0)"
          stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="443" y="60" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">backbone and expert together</text>
  <circle cx="660" cy="78" r="7" fill="none" stroke="var(--muted, #6b6053)"
          stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="660" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm's own servo loop</text>

  <text x="92" y="152" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">GR00T N1.7</text>
  <line x1="110" y1="148" x2="700" y2="148" stroke="var(--line-2, #c8bca3)" stroke-width="1.1"/>
  <circle cx="419" cy="148" r="7" fill="var(--blue-soft, #dfeaf0)"
          stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="419" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">backbone and diffusion head</text>
  <circle cx="660" cy="148" r="7" fill="none" stroke="var(--muted, #6b6053)"
          stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="660" y="168" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm's own servo loop</text>

  <text x="92" y="222" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">Helix 02</text>
  <line x1="110" y1="218" x2="700" y2="218" stroke="var(--line-2, #c8bca3)" stroke-width="1.1"/>
  <circle cx="160" cy="218" r="7" fill="var(--green-soft, #e3ede7)"
          stroke="var(--green, #15614e)" stroke-width="1.5"/>
  <text x="160" y="200" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">System 2</text>
  <circle cx="543" cy="218" r="7" fill="var(--blue-soft, #dfeaf0)"
          stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="543" y="200" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">System 1</text>
  <circle cx="660" cy="218" r="7" fill="var(--gold-soft, #f3e7c9)"
          stroke="var(--gold, #b07d22)" stroke-width="1.5"/>
  <text x="660" y="200" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">System 0</text>

  <line x1="110" y1="258" x2="700" y2="258" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <line x1="160" y1="254" x2="160" y2="262" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <line x1="327" y1="254" x2="327" y2="262" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <line x1="443" y1="254" x2="443" y2="262" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <line x1="543" y1="254" x2="543" y2="262" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <line x1="660" y1="254" x2="660" y2="262" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <text x="160" y="276" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">1 Hz</text>
  <text x="327" y="276" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">10 Hz</text>
  <text x="443" y="276" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50 Hz</text>
  <text x="543" y="276" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">200 Hz</text>
  <text x="660" y="276" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">1 kHz</text>
  <text x="700" y="292" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">rate, logarithmic</text>
</svg>
