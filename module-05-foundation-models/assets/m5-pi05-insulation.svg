<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 284" role="img" aria-label="Knowledge insulation: the backbone is trained on discrete FAST action tokens while the action expert is trained with a flow-matching loss, and a stop-gradient blocks the action expert's gradients from ever reaching the backbone">
  <rect x="70" y="44" width="230" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="185" y="72" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">VLM backbone</text>
  <text x="185" y="90" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">knows what a mug is</text>

  <rect x="440" y="44" width="230" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="555" y="72" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">action expert</text>
  <text x="555" y="90" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">random at step zero</text>

  <line x1="300" y1="66" x2="436" y2="66"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5InsulArrow)"/>
  <text x="368" y="58" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">forward: tokens and hidden states</text>

  <line x1="436" y1="90" x2="304" y2="90"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"
        marker-end="url(#m5InsulArrow)"/>
  <text x="368" y="108" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gradients would flow back this way</text>

  <line x1="370" y1="80" x2="370" y2="100"
        stroke="var(--ox, #9c3b2e)" stroke-width="3.2"/>
  <text x="370" y="128" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">stop-gradient</text>

  <line x1="185" y1="192" x2="185" y2="114"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5InsulArrow)"/>
  <text x="196" y="156" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">a clean signal, so the</text>
  <text x="196" y="170" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">semantics survive</text>

  <line x1="555" y1="192" x2="555" y2="114"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5InsulArrow)"/>
  <text x="566" y="156" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">trains the fast head</text>
  <text x="566" y="170" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">only</text>

  <rect x="70" y="196" width="230" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="185" y="220" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">discrete FAST tokens</text>
  <text x="185" y="236" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">next-token cross-entropy</text>

  <rect x="440" y="196" width="230" height="54" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="555" y="220" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">flow-matching loss</text>
  <text x="555" y="236" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">on the continuous chunk</text>

  <text x="370" y="224" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">two losses,</text>
  <text x="370" y="238" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one training step</text>

  <defs>
    <marker id="m5InsulArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
