<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" role="img" aria-label="The pi zero architecture: camera images and the instruction enter a vision-language expert, joint angles and a noisy action chunk enter a separate action expert, both experts share one self-attention stack inside a single forward pass, and the action expert emits fifty continuous future actions">
  <rect x="34" y="32" width="160" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="114" y="53" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">camera images</text>
  <text x="114" y="68" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">one or more views</text>

  <rect x="208" y="32" width="160" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="288" y="53" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">the instruction</text>
  <text x="288" y="68" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">plain words</text>

  <rect x="392" y="32" width="160" height="46" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="472" y="53" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">joint angles</text>
  <text x="472" y="68" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">where the arm is now</text>

  <rect x="566" y="32" width="160" height="46" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="646" y="53" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">noisy actions</text>
  <text x="646" y="68" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">the chunk being refined</text>

  <line x1="114" y1="78" x2="114" y2="100" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5PiArrow)"/>
  <line x1="288" y1="78" x2="288" y2="100" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5PiArrow)"/>
  <line x1="472" y1="78" x2="472" y2="100" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5PiArrow)"/>
  <line x1="646" y1="78" x2="646" y2="100" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5PiArrow)"/>

  <rect x="34" y="104" width="692" height="120" rx="8" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>

  <rect x="52" y="120" width="310" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="207" y="146" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">vision-language expert</text>
  <text x="207" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a pretrained VLM backbone</text>

  <rect x="398" y="120" width="310" height="60" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="553" y="146" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">action expert</text>
  <text x="553" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">about 300M parameters</text>

  <line x1="368" y1="150" x2="392" y2="150"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-start="url(#m5PiBack)" marker-end="url(#m5PiArrow)"/>

  <rect x="52" y="188" width="656" height="24" rx="6" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="380" y="204" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one shared self-attention stack: every token can attend to every other token</text>

  <line x1="380" y1="224" x2="380" y2="250" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5PiArrow)"/>

  <rect x="230" y="254" width="300" height="52" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="380" y="278" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">50 future actions</text>
  <text x="380" y="295" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">continuous values, run at up to 50 Hz</text>

  <defs>
    <marker id="m5PiArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m5PiBack" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
