<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" role="img" aria-label="Four tasks arranged left to right by how much they demand beyond precise repetition: fixed pick and place, the same task with a randomised object position, language-conditioned selection among distractors, and a two-step sequence. A marked cliff sits between the second and third task, where a policy with no language input has no way to know which object is meant.">

  <text x="380" y="30" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">no language input, no way to know which block</text>
  <line x1="380" y1="40" x2="380" y2="180" stroke="var(--ox, #9c3b2e)" stroke-width="1.4" stroke-dasharray="4 4"/>

  <rect x="24" y="62" width="160" height="88" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="104" y="92" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">1 · Fixed place</text>
  <text x="104" y="114" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one object</text>
  <text x="104" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">fixed start pose</text>

  <rect x="208" y="62" width="160" height="88" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="288" y="92" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">2 · Randomised</text>
  <text x="288" y="114" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same task</text>
  <text x="288" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">position varies</text>

  <rect x="392" y="62" width="160" height="88" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="472" y="92" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">3 · Named object</text>
  <text x="472" y="114" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">"pick the red block"</text>
  <text x="472" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">two distractors present</text>

  <rect x="576" y="62" width="160" height="88" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="656" y="92" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">4 · Two steps</text>
  <text x="656" y="114" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">block into cup, then</text>
  <text x="656" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">cup onto coaster</text>

  <line x1="24" y1="192" x2="736" y2="192"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5pcLadderArrow)"/>
  <text x="380" y="214" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">how much the task demands beyond precise repetition</text>

  <defs>
    <marker id="m5pcLadderArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
