<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-label="Bolting a randomly initialised action head onto a pretrained backbone sends meaningless gradients backwards into the weights that hold everything the model knows, degrading them fastest in the early steps when the head is least useful">

  <rect x="24" y="48" width="240" height="92" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="144" y="84" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Pretrained backbone</text>
  <text x="144" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">has read most of the web</text>
  <text x="144" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">knows what a mug is</text>

  <line x1="264" y1="94" x2="302" y2="94"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5SandFwd)"/>

  <rect x="310" y="48" width="200" height="92" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="410" y="84" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Fresh action head</text>
  <text x="410" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">randomly initialised</text>
  <text x="410" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">its outputs are noise</text>

  <line x1="510" y1="94" x2="546" y2="94"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5SandFwd)"/>
  <text x="554" y="90" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">noise actions</text>
  <text x="554" y="110" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">for thousands of steps</text>

  <path d="M410,140 L410,196 L144,196 L144,148" fill="none"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.6" marker-end="url(#m5SandBack)"/>

  <text x="277" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gradients that carry no signal yet</text>
  <text x="277" y="242" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">the backbone is what they land on</text>

  <text x="380" y="274" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the fix is to cut this arrow; freezing the backbone is worse</text>

  <defs>
    <marker id="m5SandFwd" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m5SandBack" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
