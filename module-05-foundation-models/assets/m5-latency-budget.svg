<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" role="img" aria-label="Drawn to scale at six pixels per millisecond: one control period at 50 Hz is 20 milliseconds, the fastest published GR00T forward pass is 27.9 milliseconds on an H100 with TensorRT, and the same model on hardware you own is an unpublished, longer bar">

  <text x="80" y="66" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">one control period at 50 Hz &#183; the budget you have to fill</text>
  <rect x="80" y="76" width="120" height="30" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="212" y="96" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">20 ms</text>

  <text x="80" y="136" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">GR00T N1.7 forward pass &#183; H100 with TensorRT, 4 denoising steps, one camera</text>
  <rect x="80" y="146" width="167" height="30" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="259" y="166" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">27.9 ms, which is 35.9 Hz</text>

  <text x="80" y="206" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the same model on the hardware you own &#183; smaller card, more cameras, no TensorRT</text>
  <rect x="80" y="216" width="480" height="30" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"
        stroke-dasharray="5 4"/>
  <text x="572" y="239" class="svg-disp" font-size="18" font-weight="700"
        fill="var(--ox, #9c3b2e)">?</text>
  <text x="592" y="236" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">not published</text>

  <text x="80" y="278" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the fastest published number is longer than one control period &#183; which is why every model predicts a chunk</text>
  <text x="720" y="298" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">drawn to scale &#183; 6 px per millisecond</text>
</svg>
