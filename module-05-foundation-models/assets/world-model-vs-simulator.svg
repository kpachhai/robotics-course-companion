<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Two ways to answer what happens next. A hand-written physics engine exposes ground-truth state, deterministic reset, a computable reward and consistent contact. A learned world model exposes only a plausible next observation, with no state to query, no deterministic reset and no computable reward.">

  <rect x="286" y="12" width="188" height="44" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.4"/>
  <text x="380" y="40" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--muted, #6b6053)">what happens next?</text>

  <path d="M286 38 L215 38 L215 92" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmSimArrow)"/>
  <path d="M474 38 L545 38 L545 92" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmSimArrow)"/>

  <rect x="30" y="96" width="330" height="212" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="195" y="126" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">Physics engine</text>
  <text x="195" y="145" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">equations written by a person</text>
  <line x1="58" y1="158" x2="332" y2="158" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <text x="195" y="180" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">ground-truth state you can read</text>
  <text x="195" y="200" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">deterministic reset, every time</text>
  <text x="195" y="220" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reward computable from state</text>
  <text x="195" y="240" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">contact that stays consistent</text>
  <line x1="58" y1="256" x2="332" y2="256" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <text x="195" y="278" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">narrow, and you can trust it</text>
  <text x="195" y="296" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reinforcement learning works here</text>

  <rect x="400" y="96" width="330" height="212" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="565" y="126" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--gold, #b07d22)">Learned world model</text>
  <text x="565" y="145" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gradient descent on video</text>
  <line x1="428" y1="158" x2="702" y2="158" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <text x="565" y="180" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a plausible next observation</text>
  <text x="565" y="200" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no state underneath to query</text>
  <text x="565" y="220" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no deterministic reset</text>
  <text x="565" y="240" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no reward you can compute</text>
  <line x1="428" y1="256" x2="702" y2="256" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <text x="565" y="278" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">broad, and you cannot trust it</text>
  <text x="565" y="296" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no training loop closes in here</text>

  <defs>
    <marker id="m5wmSimArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
