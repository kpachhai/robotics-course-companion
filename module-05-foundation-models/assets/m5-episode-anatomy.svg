<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 292" role="img" aria-label="One recorded frame contains camera images, joint state, a task instruction string and an action; ACT reads images and state while a vision-language-action model also reads the instruction">

  <rect x="24" y="20" width="300" height="250" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="40" y="44" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">one recorded frame</text>

  <rect x="40" y="60" width="268" height="32" rx="8"
        fill="none" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="54" y="81" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">observation.images.top</text>

  <rect x="40" y="98" width="268" height="32" rx="8"
        fill="none" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="54" y="119" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">observation.images.wrist</text>

  <rect x="40" y="136" width="268" height="32" rx="8"
        fill="none" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="54" y="157" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">observation.state</text>
  <text x="296" y="157" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">6 joint angles</text>

  <rect x="40" y="174" width="268" height="32" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="54" y="195" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">task</text>
  <text x="296" y="195" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the instruction string</text>

  <rect x="40" y="212" width="268" height="32" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="54" y="233" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">action</text>
  <text x="296" y="233" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the training target</text>

  <line x1="324" y1="107" x2="424" y2="107"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5EpisodeArrow)"/>
  <text x="375" y="100" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">images + state</text>

  <line x1="324" y1="217" x2="424" y2="217"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5EpisodeArrow)"/>
  <text x="375" y="210" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">images + state + task</text>

  <rect x="430" y="76" width="282" height="62" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="571" y="102" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">ACT</text>
  <text x="571" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no language input; one task per checkpoint</text>

  <rect x="430" y="186" width="282" height="62" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="571" y="212" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">SmolVLA</text>
  <text x="571" y="232" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same frames, plus the instruction string</text>

  <defs>
    <marker id="m5EpisodeArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
