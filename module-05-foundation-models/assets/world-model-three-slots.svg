<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="A robot stack with three insertion points for a world model. Slot one generates synthetic episodes into the dataset. Slot two sits beside the control loop as a planner scoring imagined futures against a goal image. Slot three sits inside the policy as its pretrained vision backbone.">

  <rect x="190" y="26" width="198" height="72" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="289" y="52" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">1 · Data generator</text>
  <text x="289" y="70" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">invents plausible episodes</text>
  <text x="289" y="85" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">production use today</text>

  <rect x="558" y="26" width="198" height="72" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="657" y="52" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">2 · Planner</text>
  <text x="657" y="70" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">scores imagined futures</text>
  <text x="657" y="85" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">needs a goal image, runs slow</text>

  <line x1="289" y1="98" x2="289" y2="146" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmSlotArrow)"/>
  <line x1="657" y1="98" x2="657" y2="146" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmSlotArrow)"/>

  <rect x="30" y="150" width="150" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="105" y="180" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Demonstrations</text>
  <text x="105" y="198" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you teleoperate these</text>

  <rect x="214" y="150" width="150" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="289" y="180" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Dataset</text>
  <text x="289" y="198" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">what training sees</text>

  <rect x="398" y="150" width="150" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="473" y="180" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Policy</text>
  <text x="473" y="198" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the VLA you fine-tuned</text>

  <rect x="582" y="150" width="150" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="657" y="180" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Control loop</text>
  <text x="657" y="198" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">on the robot</text>

  <line x1="180" y1="184" x2="210" y2="184" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmSlotArrow)"/>
  <line x1="364" y1="184" x2="394" y2="184" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmSlotArrow)"/>
  <line x1="548" y1="184" x2="578" y2="184" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmSlotArrow)"/>

  <line x1="473" y1="246" x2="473" y2="222" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmSlotArrow)"/>

  <rect x="374" y="250" width="198" height="66" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="473" y="276" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">3 · Encoder</text>
  <text x="473" y="294" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the pretrained vision backbone</text>
  <text x="473" y="309" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">already shipping, rarely noticed</text>

  <defs>
    <marker id="m5wmSlotArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
