<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" role="img" aria-label="Two routes out of the backbone's last hidden state. The upper route puts a softmax over bins and decodes tokens one at a time, reusing the pretraining objective but paying hundreds of sequential forward passes. The lower route uses a continuous action head that emits the whole chunk in one pass or a few integration steps. Both produce the same action chunk">

  <rect x="16" y="118" width="140" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="86" y="150" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Last hidden</text>
  <text x="86" y="168" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">state</text>
  <text x="86" y="185" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">what the backbone saw</text>

  <path d="M156 156 L182 156 L182 78 L200 78" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5RouteArrow)"/>
  <path d="M156 156 L182 156 L182 234 L200 234" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5RouteArrow)"/>

  <text x="204" y="32" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">route one: pick from a list</text>

  <rect x="204" y="44" width="192" height="68" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="300" y="72" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Softmax over bins</text>
  <text x="300" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one token per dimension,</text>
  <text x="300" y="105" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">per timestep</text>

  <line x1="398" y1="78" x2="418" y2="78"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5RouteArrow)"/>

  <rect x="420" y="44" width="192" height="68" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="516" y="72" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Decode one at a time</text>
  <text x="516" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">350 sequential passes for a</text>
  <text x="516" y="105" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50-step chunk on 7 joints</text>

  <line x1="614" y1="78" x2="632" y2="78"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5RouteArrow)"/>

  <rect x="634" y="44" width="112" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="690" y="74" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">An action chunk</text>
  <text x="690" y="94" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50 by 6 numbers</text>

  <text x="204" y="130" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same objective as pretraining, so language grounding survives; slow at inference</text>

  <text x="204" y="188" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">route two: produce the number</text>

  <rect x="204" y="200" width="192" height="68" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="300" y="228" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Continuous head</text>
  <text x="300" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">regression, diffusion or</text>
  <text x="300" y="261" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">flow matching</text>

  <line x1="398" y1="234" x2="418" y2="234"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5RouteArrow)"/>

  <rect x="420" y="200" width="192" height="68" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="516" y="228" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">One pass, or a few</text>
  <text x="516" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a small fixed number of</text>
  <text x="516" y="261" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">integration steps</text>

  <line x1="614" y1="234" x2="632" y2="234"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5RouteArrow)"/>

  <rect x="634" y="200" width="112" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="690" y="230" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">An action chunk</text>
  <text x="690" y="250" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50 by 6 numbers</text>

  <text x="204" y="288" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">different objective from pretraining, so the backbone is at risk; fast enough for a 50 Hz loop</text>

  <defs>
    <marker id="m5RouteArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
