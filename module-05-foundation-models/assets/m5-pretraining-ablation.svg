<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" role="img" aria-label="Two training runs on the same frozen dataset differ only in their starting weights, one from the pretrained base and one from random initialisation, and are scored on the same trials so the gap measures what pretraining bought">

  <rect x="16" y="78" width="150" height="72" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="91" y="108" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">frozen dataset</text>
  <text x="91" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">identical for both runs</text>

  <path d="M166,114 H199 V55 H218" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5AblArrow)"/>
  <path d="M166,114 H199 V173 H218" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5AblArrow)"/>

  <rect x="226" y="22" width="242" height="66" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="347" y="50" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">run A: start from the base</text>
  <text x="347" y="70" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">lerobot/smolvla_base</text>

  <rect x="226" y="140" width="242" height="66" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="347" y="168" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">run B: start from scratch</text>
  <text x="347" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same recipe, random weights</text>

  <path d="M468,55 H494 V106 H516" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5AblArrow)"/>
  <path d="M468,173 H494 V122 H516" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5AblArrow)"/>

  <rect x="524" y="78" width="150" height="72" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="599" y="108" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">the same trials</text>
  <text x="599" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same scene, same count</text>

  <line x1="599" y1="150" x2="599" y2="172"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="640" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the gap is what pretraining bought</text>

  <defs>
    <marker id="m5AblArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
