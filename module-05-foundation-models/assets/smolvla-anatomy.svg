<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" role="img" aria-label="SmolVLA drawn in the shared skeleton: a SmolVLM2-500M backbone running 16 of its decoder's 32 layers on 64 visual tokens per frame, a seam, a roughly 100 million parameter flow-matching action expert at 75 percent of the backbone's hidden width, and a 50-step action chunk sent to the arm.">

  <text x="240" y="16" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the same skeleton, with the numbers you can actually run</text>

  <text x="240" y="40" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">camera frames · language instruction · joint state</text>

  <line x1="240" y1="48" x2="240" y2="70" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5SmolArrow)"/>

  <rect x="90" y="72" width="300" height="90" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="240" y="98" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--green, #15614e)">SmolVLM2-500M</text>
  <text x="240" y="117" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">SigLIP vision encoder + SmolLM2 decoder</text>
  <text x="240" y="132" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">16 of the decoder's 32 layers run</text>
  <text x="240" y="147" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">64 visual tokens per frame, not ~1024</text>

  <line x1="80" y1="188" x2="400" y2="188" stroke="var(--line-2, #c8bca3)"
        stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="72" y="192" text-anchor="end" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the seam</text>

  <line x1="240" y1="162" x2="240" y2="214" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5SmolArrow)"/>

  <rect x="90" y="216" width="300" height="90" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="240" y="242" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">Action expert</text>
  <text x="240" y="261" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">flow matching · 10 integration steps</text>
  <text x="240" y="276" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">width 720, 75% of the backbone's 960</text>
  <text x="240" y="291" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">self-attention every 2nd layer</text>

  <line x1="240" y1="306" x2="240" y2="328" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5SmolArrow)"/>

  <rect x="90" y="330" width="300" height="52" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="240" y="352" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">An action chunk</text>
  <text x="240" y="370" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50 future steps, handed over at once</text>

  <line x1="240" y1="382" x2="240" y2="400" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5SmolArrow)"/>
  <text x="240" y="415" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">to the joint controllers</text>

  <line x1="416" y1="110" x2="392" y2="110" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="422" y="106" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">roughly 350M of</text>
  <text x="422" y="120" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the 450M total</text>

  <line x1="416" y1="254" x2="392" y2="254" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="422" y="250" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">roughly 100M of</text>
  <text x="422" y="264" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the 450M total</text>

  <defs>
    <marker id="m5SmolArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
