<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="The per-trial loop. A randomised interleaved plan supplies the next policy, task and condition. The scene is reset from a written specification, the policy runs under a fixed timeout, the outcome is scored against a written criterion, a failure mode is recorded from a fixed list, and the row is appended to the log before the next trial begins.">

  <rect x="24" y="36" width="150" height="68" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="99" y="64" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Next trial</text>
  <text x="99" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">policy, task, condition</text>
  <text x="99" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">from the shuffled plan</text>

  <rect x="214" y="36" width="150" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="289" y="64" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Reset</text>
  <text x="289" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">from the written spec,</text>
  <text x="289" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">never from memory</text>

  <rect x="404" y="36" width="150" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="479" y="64" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Run</text>
  <text x="479" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">issue the instruction,</text>
  <text x="479" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">60 s timeout for all</text>

  <rect x="594" y="36" width="150" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="669" y="64" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Score</text>
  <text x="669" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">against the criterion,</text>
  <text x="669" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">not your impression</text>

  <line x1="174" y1="70" x2="210" y2="70" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5pcLoopArrow)"/>
  <line x1="364" y1="70" x2="400" y2="70" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5pcLoopArrow)"/>
  <line x1="554" y1="70" x2="590" y2="70" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5pcLoopArrow)"/>

  <path d="M669 104 L669 142 L479 142 L479 176" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5pcLoopArrow)"/>

  <rect x="404" y="180" width="150" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="479" y="208" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Failure mode</text>
  <text x="479" y="227" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">state · grasp · loop</text>
  <text x="479" y="242" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">from the fixed list</text>

  <rect x="594" y="180" width="150" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="669" y="208" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Append the row</text>
  <text x="669" y="227" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">first attempt, outcome,</text>
  <text x="669" y="242" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">seconds, notes</text>

  <line x1="554" y1="214" x2="590" y2="214" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5pcLoopArrow)"/>

  <path d="M669 248 L669 276 L99 276 L99 108" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5pcLoopArrow)"/>
  <text x="330" y="270" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">on disk before the next reset begins</text>

  <defs>
    <marker id="m5pcLoopArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
