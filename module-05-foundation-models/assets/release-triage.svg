<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 226" role="img" aria-label="A triage chain of four gates. Gate one asks whether weights are downloadable without a form, gate two which licence covers the weights rather than the repository, gate three who ran the evaluation, gate four how many trials per cell and whether out-of-distribution results are reported. A release that fails any gate drops out to its own verdict; one that passes all four is worth benching.">

  <rect x="30" y="24" width="128" height="80" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="94" y="52" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Weights?</text>
  <text x="94" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">downloadable now,</text>
  <text x="94" y="86" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no form, no waitlist</text>

  <rect x="176" y="24" width="128" height="80" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="240" y="52" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Which licence?</text>
  <text x="240" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">on the weights,</text>
  <text x="240" y="86" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">not on the repo</text>

  <rect x="322" y="24" width="128" height="80" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="386" y="52" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Who measured?</text>
  <text x="386" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the authors, or</text>
  <text x="386" y="86" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">somebody else</text>

  <rect x="468" y="24" width="128" height="80" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="532" y="52" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">How many trials?</text>
  <text x="532" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">per cell, and is</text>
  <text x="532" y="86" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">out-of-dist. shown</text>

  <rect x="614" y="24" width="128" height="80" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="678" y="52" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">Bench it</text>
  <text x="678" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">schedule the</text>
  <text x="678" y="86" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">fine-tune this week</text>

  <line x1="158" y1="64" x2="172" y2="64" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5rfTriageArrow)"/>
  <line x1="304" y1="64" x2="318" y2="64" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5rfTriageArrow)"/>
  <line x1="450" y1="64" x2="464" y2="64" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5rfTriageArrow)"/>
  <line x1="596" y1="64" x2="610" y2="64" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5rfTriageArrow)"/>

  <line x1="94" y1="104" x2="94" y2="148" stroke="var(--muted, #6b6053)" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#m5rfTriageArrow)"/>
  <line x1="240" y1="104" x2="240" y2="148" stroke="var(--muted, #6b6053)" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#m5rfTriageArrow)"/>
  <line x1="386" y1="104" x2="386" y2="148" stroke="var(--muted, #6b6053)" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#m5rfTriageArrow)"/>
  <line x1="532" y1="104" x2="532" y2="148" stroke="var(--muted, #6b6053)" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#m5rfTriageArrow)"/>

  <rect x="30" y="152" width="128" height="52" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="94" y="174" text-anchor="middle" class="svg-disp" font-size="12.5" font-weight="600"
        fill="var(--ox, #9c3b2e)">Demonstrated</text>
  <text x="94" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">log it, move on</text>

  <rect x="176" y="152" width="128" height="52" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="240" y="174" text-anchor="middle" class="svg-disp" font-size="12.5" font-weight="600"
        fill="var(--ox, #9c3b2e)">Cannot ship it</text>
  <text x="240" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">bookmark + a trigger</text>

  <rect x="322" y="152" width="128" height="52" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="386" y="174" text-anchor="middle" class="svg-disp" font-size="12.5" font-weight="600"
        fill="var(--ox, #9c3b2e)">Vendor-run only</text>
  <text x="386" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">halve your prior</text>

  <rect x="468" y="152" width="128" height="52" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="532" y="174" text-anchor="middle" class="svg-disp" font-size="12.5" font-weight="600"
        fill="var(--ox, #9c3b2e)">n too small</text>
  <text x="532" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no ranking survives</text>

  <defs>
    <marker id="m5rfTriageArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
