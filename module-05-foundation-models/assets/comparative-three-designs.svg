<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Three vision-language-action designs drawn in the same skeleton. Pi zero point five puts a VLM backbone and an action expert in one shared attention stack, with the action expert's gradients cut under the knowledge-insulation recipe. GR00T N1.7 hands a hidden state from a Cosmos-Reason2 backbone down to a separate 16-layer flow-matching diffusion transformer. Helix 02 passes a latent goal from System 2 to a 200 hertz System 1, and adds a learned System 0 whole-body controller at 1 kilohertz where the other two use the robot's own joint controllers.">

  <text x="132" y="20" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--muted, #6b6053)">&#960;<tspan font-size="10" dy="3">0.5</tspan></text>
  <text x="132" y="36" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Physical Intelligence · weights out</text>
  <text x="132" y="54" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">frames · instruction · joint state</text>
  <line x1="132" y1="62" x2="132" y2="82" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5AnatArrow)"/>

  <rect x="16" y="84" width="232" height="80" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="132" y="112" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">VLM backbone</text>
  <text x="132" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">PaliGemma-class</text>
  <text x="132" y="145" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">supervised on FAST action tokens</text>

  <line x1="56" y1="164" x2="56" y2="212" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5AnatArrow)"/>
  <text x="70" y="184" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one shared attention stack</text>
  <text x="70" y="197" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gradients cut (knowledge insulation)</text>

  <rect x="16" y="214" width="232" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="132" y="242" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Action expert</text>
  <text x="132" y="260" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a second set of transformer weights</text>
  <text x="132" y="275" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">flow matching, continuous actions</text>
  <text x="132" y="290" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50-step chunk</text>

  <line x1="56" y1="298" x2="56" y2="334" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5AnatArrow)"/>
  <text x="70" y="320" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">up to 50 Hz</text>

  <rect x="16" y="336" width="232" height="52" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="132" y="358" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">Joint controllers</text>
  <text x="132" y="375" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the robot's own, not the model</text>

  <text x="380" y="20" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--muted, #6b6053)">GR00T N1.7</text>
  <text x="380" y="36" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">NVIDIA · weights out, own licence</text>
  <text x="380" y="54" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one camera view · instruction · state</text>
  <line x1="380" y1="62" x2="380" y2="82" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5AnatArrow)"/>

  <rect x="264" y="84" width="232" height="80" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="380" y="112" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">Cosmos-Reason2-2B</text>
  <text x="380" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a VLM of the Qwen3-VL lineage</text>
  <text x="380" y="145" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">3B total including the head</text>

  <line x1="304" y1="164" x2="304" y2="212" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5AnatArrow)"/>
  <text x="318" y="184" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a hidden state handed down</text>
  <text x="318" y="197" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">two separate modules</text>

  <rect x="264" y="214" width="232" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="380" y="242" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Diffusion transformer</text>
  <text x="380" y="260" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">16 layers, flow matching</text>
  <text x="380" y="275" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">emits motor commands</text>
  <text x="380" y="290" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">4 integration steps at inference</text>

  <line x1="304" y1="298" x2="304" y2="334" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5AnatArrow)"/>
  <text x="318" y="320" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">35.9 Hz on an H100</text>

  <rect x="264" y="336" width="232" height="52" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="380" y="358" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">Joint controllers</text>
  <text x="380" y="375" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the robot's own, not the model</text>

  <text x="628" y="20" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--muted, #6b6053)">Helix 02</text>
  <text x="628" y="36" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Figure · no weights, no paper</text>
  <text x="628" y="54" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">head and palm cams · tactile · state</text>
  <line x1="628" y1="62" x2="628" y2="82" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5AnatArrow)"/>

  <rect x="512" y="84" width="232" height="80" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="628" y="112" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">System 2</text>
  <text x="628" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">scene understanding, language</text>
  <text x="628" y="145" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">roughly 1 Hz</text>

  <line x1="552" y1="164" x2="552" y2="212" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5AnatArrow)"/>
  <text x="566" y="184" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a latent goal vector</text>
  <text x="566" y="197" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no published details</text>

  <rect x="512" y="214" width="232" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="628" y="242" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">System 1</text>
  <text x="628" y="260" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">visuomotor transformer</text>
  <text x="628" y="275" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">full-body motor commands</text>
  <text x="628" y="290" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no parameter count published</text>

  <line x1="552" y1="298" x2="552" y2="334" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5AnatArrow)"/>
  <text x="566" y="320" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">200 Hz</text>

  <rect x="512" y="336" width="232" height="52" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="628" y="358" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">System 0</text>
  <text x="628" y="375" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">10M params · 1 kHz · learned in sim</text>

  <defs>
    <marker id="m5AnatArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
