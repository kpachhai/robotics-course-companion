<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 404" role="img" aria-label="The skeleton shared by every vision-language-action model: sensor inputs feed a pretrained vision-language backbone, a seam separates it from a small fast action head, and the head emits a chunk of future actions to the robot's controllers. Annotations mark the three places designs differ.">

  <text x="240" y="16" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">every model in this module is this drawing with three blanks filled in</text>

  <text x="240" y="40" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">camera frames · language instruction · joint state</text>

  <line x1="240" y1="48" x2="240" y2="70" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5SkelArrow)"/>

  <rect x="90" y="72" width="300" height="76" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="240" y="100" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--green, #15614e)">Backbone</text>
  <text x="240" y="119" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a pretrained vision-language model</text>
  <text x="240" y="134" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">big, slow, knows what things are</text>

  <line x1="80" y1="176" x2="400" y2="176" stroke="var(--line-2, #c8bca3)"
        stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="72" y="180" text-anchor="end" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the seam</text>

  <line x1="240" y1="148" x2="240" y2="202" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5SkelArrow)"/>

  <rect x="90" y="204" width="300" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="240" y="232" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">Action head</text>
  <text x="240" y="251" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">small, fast, emits numbers not words</text>
  <text x="240" y="266" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">tokens · diffusion · flow matching</text>

  <line x1="240" y1="280" x2="240" y2="302" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5SkelArrow)"/>

  <rect x="90" y="304" width="300" height="56" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="240" y="328" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">An action chunk</text>
  <text x="240" y="346" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">H future steps, handed over at once</text>

  <line x1="240" y1="360" x2="240" y2="382" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m5SkelArrow)"/>
  <text x="240" y="397" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">to the joint controllers</text>

  <line x1="416" y1="110" x2="392" y2="110" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="422" y="106" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">varies: which model,</text>
  <text x="422" y="120" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and how much of it runs</text>

  <line x1="416" y1="176" x2="402" y2="176" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="422" y="172" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">varies: what crosses,</text>
  <text x="422" y="186" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and whether gradients do</text>

  <line x1="416" y1="242" x2="392" y2="242" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="422" y="238" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">varies: how an action is</text>
  <text x="422" y="252" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">represented and decoded</text>

  <defs>
    <marker id="m5SkelArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
