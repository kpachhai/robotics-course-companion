<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" role="img" aria-label="Ninety-five percent confidence intervals for two success rates: at twenty trials each the intervals overlap almost entirely, and at one hundred trials each they still overlap">

  <text x="142" y="68" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">ACT 9/20</text>
  <text x="411" y="54" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">45%, CI 26 to 66</text>
  <g stroke="var(--blue, #2d5d7c)" stroke-width="2">
    <line x1="299.6" y1="64" x2="531.6" y2="64"/>
    <line x1="299.6" y1="59" x2="299.6" y2="69"/>
    <line x1="531.6" y1="59" x2="531.6" y2="69"/>
  </g>
  <circle cx="411" cy="64" r="4.5" fill="var(--blue, #2d5d7c)"/>

  <text x="142" y="108" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">SmolVLA 12/20</text>
  <text x="498" y="94" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">60%, CI 39 to 78</text>
  <g stroke="var(--gold, #b07d22)" stroke-width="2">
    <line x1="374.5" y1="104" x2="603" y2="104"/>
    <line x1="374.5" y1="99" x2="374.5" y2="109"/>
    <line x1="603" y1="99" x2="603" y2="109"/>
  </g>
  <circle cx="498" cy="104" r="4.5" fill="var(--gold, #b07d22)"/>

  <text x="730" y="134" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">20 trials each: these are the same result</text>

  <line x1="30" y1="152" x2="730" y2="152"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.3" stroke-dasharray="4 4"/>

  <text x="142" y="204" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">ACT 45/100</text>
  <text x="411" y="190" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">45%, CI 36 to 55</text>
  <g stroke="var(--blue, #2d5d7c)" stroke-width="2">
    <line x1="356.5" y1="200" x2="467.8" y2="200"/>
    <line x1="356.5" y1="195" x2="356.5" y2="205"/>
    <line x1="467.8" y1="195" x2="467.8" y2="205"/>
  </g>
  <circle cx="411" cy="200" r="4.5" fill="var(--blue, #2d5d7c)"/>

  <text x="142" y="244" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">SmolVLA 60/100</text>
  <text x="498" y="230" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">60%, CI 50 to 69</text>
  <g stroke="var(--gold, #b07d22)" stroke-width="2">
    <line x1="441.2" y1="240" x2="550.8" y2="240"/>
    <line x1="441.2" y1="235" x2="441.2" y2="245"/>
    <line x1="550.8" y1="235" x2="550.8" y2="245"/>
  </g>
  <circle cx="498" cy="240" r="4.5" fill="var(--gold, #b07d22)"/>

  <text x="730" y="264" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">100 trials each: they still touch</text>

  <line x1="150" y1="276" x2="730" y2="276"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <g stroke="var(--line-2, #c8bca3)" stroke-width="1.3">
    <line x1="150" y1="276" x2="150" y2="282"/>
    <line x1="295" y1="276" x2="295" y2="282"/>
    <line x1="440" y1="276" x2="440" y2="282"/>
    <line x1="585" y1="276" x2="585" y2="282"/>
    <line x1="730" y1="276" x2="730" y2="282"/>
  </g>
  <text x="150" y="296" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">0%</text>
  <text x="295" y="296" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">25%</text>
  <text x="440" y="296" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50%</text>
  <text x="585" y="296" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">75%</text>
  <text x="730" y="296" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">100%</text>
</svg>
