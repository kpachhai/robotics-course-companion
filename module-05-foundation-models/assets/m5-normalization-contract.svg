<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" role="img" aria-label="Training normalizes recorded joint angles using the dataset statistics, and deployment de-normalizes the policy output with the same statistics; a mismatch produces no error, only wrong motion">

  <rect x="20" y="40" width="190" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="115" y="66" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">recorded angles</text>
  <text x="115" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">your arm's own units and range</text>

  <line x1="210" y1="68" x2="242" y2="68"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5NormArrow)"/>

  <rect x="250" y="40" width="190" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="345" y="66" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">normalize</text>
  <text x="345" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">at training time</text>

  <line x1="440" y1="68" x2="472" y2="68"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5NormArrow)"/>

  <rect x="480" y="40" width="240" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="600" y="66" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the policy learns here</text>
  <text x="600" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">dimensionless, roughly minus one to one</text>

  <rect x="250" y="126" width="190" height="52" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="345" y="150" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">dataset statistics</text>
  <text x="345" y="168" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one set of numbers per dimension</text>

  <line x1="345" y1="126" x2="345" y2="98"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"
        marker-end="url(#m5NormArrow)"/>
  <line x1="345" y1="178" x2="345" y2="202"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"
        marker-end="url(#m5NormArrow)"/>

  <line x1="440" y1="152" x2="470" y2="152"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="478" y="146" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a mismatch here raises no error.</text>
  <text x="478" y="162" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm moves smoothly to the wrong place.</text>

  <rect x="20" y="204" width="190" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="115" y="230" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">policy output</text>
  <text x="115" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">still dimensionless</text>

  <line x1="210" y1="232" x2="242" y2="232"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5NormArrow)"/>

  <rect x="250" y="204" width="190" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="345" y="230" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">de-normalize</text>
  <text x="345" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">at deployment time</text>

  <line x1="440" y1="232" x2="472" y2="232"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5NormArrow)"/>

  <rect x="480" y="204" width="240" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="600" y="230" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">servo command</text>
  <text x="600" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">back in your arm's own units</text>

  <defs>
    <marker id="m5NormArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
