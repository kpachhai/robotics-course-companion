<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Two prediction pipelines. The pixel pipeline encodes an observation, generates a whole future frame and decodes it before scoring, paying for texture no decision reads. The latent pipeline encodes once, predicts the next embedding directly and scores it, never producing an image.">

  <text x="30" y="34" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Predicting pixels</text>

  <rect x="30" y="46" width="120" height="54" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="90" y="78" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">observation</text>

  <rect x="176" y="46" width="120" height="54" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="236" y="78" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">encode</text>

  <rect x="322" y="46" width="150" height="54" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="397" y="78" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">generate frame</text>

  <rect x="498" y="46" width="120" height="54" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="558" y="78" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">decode</text>

  <rect x="644" y="46" width="86" height="54" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="687" y="78" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">score</text>

  <line x1="150" y1="73" x2="172" y2="73" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmLatentArrow)"/>
  <line x1="296" y1="73" x2="318" y2="73" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmLatentArrow)"/>
  <line x1="472" y1="73" x2="494" y2="73" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmLatentArrow)"/>
  <line x1="618" y1="73" x2="640" y2="73" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmLatentArrow)"/>

  <line x1="397" y1="100" x2="397" y2="116" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <line x1="558" y1="100" x2="558" y2="116" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <line x1="397" y1="116" x2="558" y2="116" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="478" y="134" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">texture, shadow, highlight: none of it read downstream</text>

  <line x1="30" y1="160" x2="730" y2="160" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>

  <text x="30" y="190" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Predicting in latent space</text>

  <rect x="30" y="202" width="120" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="90" y="234" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">observation</text>

  <rect x="176" y="202" width="120" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="236" y="234" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">encode</text>

  <rect x="322" y="202" width="150" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="397" y="228" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">predict the next</text>
  <text x="397" y="245" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">embedding</text>

  <rect x="644" y="202" width="86" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="687" y="234" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">score</text>

  <line x1="150" y1="229" x2="172" y2="229" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmLatentArrow)"/>
  <line x1="296" y1="229" x2="318" y2="229" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmLatentArrow)"/>
  <line x1="472" y1="229" x2="640" y2="229" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5wmLatentArrow)"/>
  <text x="556" y="220" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no image is ever produced</text>

  <defs>
    <marker id="m5wmLatentArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
