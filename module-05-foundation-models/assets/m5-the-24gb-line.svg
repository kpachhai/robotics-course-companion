<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Fine-tuning footprints sorted into three zones: SmolVLA 450M sits under 24 GB with room, a pi0-class LoRA run and OpenVLA 7B sit right on a 24 GB card with no headroom, and a full pi0 fine-tune or GR00T N1.7 needs rented hardware">

  <text x="136" y="42" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">Under 24 GB, with room</text>
  <text x="380" y="42" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">24 GB, no headroom</text>
  <text x="624" y="42" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">Rented hardware only</text>

  <rect x="24" y="56" width="224" height="176" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="268" y="56" width="224" height="176" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <rect x="512" y="56" width="224" height="176" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>

  <text x="136" y="100" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">SmolVLA 450M</text>
  <text x="136" y="124" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">inference on a laptop CPU</text>
  <text x="136" y="142" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">fine-tune on one consumer GPU</text>
  <text x="136" y="160" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">RTX 3090 reported by users</text>

  <text x="380" y="100" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">pi0 / pi0.5, about 3B</text>
  <text x="380" y="120" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">LoRA: more than 22.5 GB</text>
  <text x="380" y="156" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">OpenVLA 7B</text>
  <text x="380" y="176" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">LoRA: roughly 24 GB</text>

  <text x="624" y="100" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">pi0 / pi0.5, full run</text>
  <text x="624" y="120" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">more than 70 GB</text>
  <text x="624" y="156" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">GR00T N1.7 3B</text>
  <text x="624" y="176" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">40 GB and up recommended</text>

  <line x1="48" y1="196" x2="224" y2="196" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <line x1="292" y1="196" x2="468" y2="196" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <line x1="536" y1="196" x2="712" y2="196" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>

  <text x="136" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you run the experiment</text>
  <text x="380" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one card, nothing to spare</text>
  <text x="624" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">rent it, or read about it</text>

  <text x="380" y="268" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the 24 GB line is why this module&#8217;s hands-on work is built on the smallest model here</text>
</svg>
