<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" role="img" aria-label="Knowledge insulation in pi zero point five. Images and an instruction enter a vision-language backbone. A FAST discrete-token head above it supplies the only gradients the backbone ever receives. A flow-matching action expert below it produces the chunk that runs on the robot, and its gradient path back into the backbone is deliberately blocked">

  <text x="20" y="170" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">images + instruction</text>
  <line x1="164" y1="175" x2="192" y2="175"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5InsArrow)"/>

  <rect x="196" y="120" width="190" height="110" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="291" y="160" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Vision-language</text>
  <text x="291" y="178" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">backbone</text>
  <text x="291" y="200" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pretrained on the web;</text>
  <text x="291" y="213" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the thing worth protecting</text>

  <path d="M386 155 L420 155 L420 102 L446 102" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5InsArrow)"/>
  <path d="M386 195 L420 195 L420 252 L446 252" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m5InsArrow)"/>

  <rect x="450" y="64" width="212" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="556" y="92" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">FAST token head</text>
  <text x="556" y="112" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">cross-entropy on discrete tokens,</text>
  <text x="556" y="125" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the objective the backbone knows</text>

  <rect x="450" y="214" width="212" height="76" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="556" y="242" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Flow-matching expert</text>
  <text x="556" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">emits the chunk in a few steps,</text>
  <text x="556" y="275" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and is what runs on the robot</text>

  <path d="M556 64 L556 42 L291 42 L291 116" fill="none"
        stroke="var(--gold, #b07d22)" stroke-width="1.6" marker-end="url(#m5InsGoldArrow)"/>
  <text x="424" y="34" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gradients flow back: the backbone's only teacher</text>

  <path d="M556 290 L556 316 L291 316 L291 254" fill="none"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.6" stroke-dasharray="4 4"/>
  <line x1="275" y1="248" x2="307" y2="248"
        stroke="var(--ox, #9c3b2e)" stroke-width="3.2"/>
  <text x="316" y="252" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">gradient cut here</text>

  <text x="20" y="344" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a freshly initialized expert emits noise, and its early gradients would degrade the pretrained representation</text>

  <defs>
    <marker id="m5InsArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m5InsGoldArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--gold, #b07d22)"/>
    </marker>
  </defs>
</svg>
