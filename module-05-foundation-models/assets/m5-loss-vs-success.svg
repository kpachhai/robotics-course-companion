<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 348" role="img" aria-label="Illustrative shape: the training loss falls smoothly with steps while on-robot success rate measured at four checkpoints is non-monotonic with wide overlapping confidence intervals">

  <g stroke="var(--line-2, #c8bca3)" stroke-width="1.1" stroke-dasharray="4 4">
    <line x1="150" y1="30" x2="150" y2="140"/>
    <line x1="290" y1="30" x2="290" y2="140"/>
    <line x1="430" y1="30" x2="430" y2="140"/>
    <line x1="610" y1="30" x2="610" y2="140"/>
    <line x1="150" y1="190" x2="150" y2="300"/>
    <line x1="290" y1="190" x2="290" y2="300"/>
    <line x1="430" y1="190" x2="430" y2="300"/>
    <line x1="610" y1="190" x2="610" y2="300"/>
  </g>

  <text x="70" y="22" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">training loss</text>
  <line x1="70" y1="30" x2="70" y2="140" stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <line x1="70" y1="140" x2="700" y2="140" stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <path d="M70,44 C130,100 200,116 300,124 S520,133 700,136" fill="none"
        stroke="var(--blue, #2d5d7c)" stroke-width="2"/>

  <text x="700" y="164" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the curve above is monotone. the rate below is not.</text>

  <text x="70" y="182" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">on-robot success, 20 trials per checkpoint</text>
  <line x1="70" y1="190" x2="70" y2="300" stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <line x1="70" y1="300" x2="700" y2="300" stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <text x="62" y="194" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">100%</text>
  <text x="62" y="304" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">0%</text>

  <g stroke="var(--gold, #b07d22)" stroke-width="1.4">
    <line x1="150" y1="250.5" x2="150" y2="294.5"/>
    <line x1="144" y1="250.5" x2="156" y2="250.5"/>
    <line x1="144" y1="294.5" x2="156" y2="294.5"/>
    <line x1="290" y1="217.5" x2="290" y2="261.5"/>
    <line x1="284" y1="217.5" x2="296" y2="217.5"/>
    <line x1="284" y1="261.5" x2="296" y2="261.5"/>
    <line x1="430" y1="228.5" x2="430" y2="272.5"/>
    <line x1="424" y1="228.5" x2="436" y2="228.5"/>
    <line x1="424" y1="272.5" x2="436" y2="272.5"/>
    <line x1="610" y1="223" x2="610" y2="267"/>
    <line x1="604" y1="223" x2="616" y2="223"/>
    <line x1="604" y1="267" x2="616" y2="267"/>
  </g>
  <g fill="var(--gold, #b07d22)" stroke="var(--gold, #b07d22)" stroke-width="1.5">
    <circle cx="150" cy="272.5" r="4"/>
    <circle cx="290" cy="239.5" r="4"/>
    <circle cx="430" cy="250.5" r="4"/>
    <circle cx="610" cy="245" r="4"/>
  </g>

  <text x="150" y="318" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">5k</text>
  <text x="290" y="318" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">10k</text>
  <text x="430" y="318" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">20k</text>
  <text x="610" y="318" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">40k</text>
  <text x="385" y="338" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">training steps</text>
</svg>
