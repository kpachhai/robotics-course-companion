<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img" aria-label="Two timelines. Run synchronously, the arm stands still during every inference window. Run asynchronously, the next chunk is computed while the current chunk is still executing, so the arm never stops">

  <text x="80" y="82" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Synchronous</text>
  <text x="176" y="82" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">ask, wait, move, ask again</text>

  <rect x="80" y="92" width="80" height="36" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="120" y="115" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">infer</text>
  <rect x="160" y="92" width="180" height="36" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="250" y="115" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">run the chunk</text>
  <rect x="340" y="92" width="80" height="36" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="380" y="115" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">infer</text>
  <rect x="420" y="92" width="180" height="36" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="510" y="115" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">run the chunk</text>
  <rect x="600" y="92" width="80" height="36" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="640" y="115" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">infer</text>
  <rect x="680" y="92" width="40" height="36" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>

  <text x="80" y="150" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the arm is standing still inside every red block</text>

  <text x="80" y="184" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Asynchronous</text>
  <text x="184" y="184" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">ask early, keep moving</text>

  <rect x="180" y="192" width="80" height="26" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="220" y="209" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">infer next</text>
  <rect x="360" y="192" width="80" height="26" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="400" y="209" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">infer next</text>
  <rect x="540" y="192" width="80" height="26" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="580" y="209" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">infer next</text>

  <line x1="260" y1="218" x2="260" y2="228" stroke="var(--green, #15614e)" stroke-width="1.2"/>
  <line x1="440" y1="218" x2="440" y2="228" stroke="var(--green, #15614e)" stroke-width="1.2"/>
  <line x1="620" y1="218" x2="620" y2="228" stroke="var(--green, #15614e)" stroke-width="1.2"/>

  <rect x="80" y="228" width="180" height="36" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="170" y="251" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">run the chunk</text>
  <rect x="260" y="228" width="180" height="36" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="350" y="251" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">run the chunk</text>
  <rect x="440" y="228" width="180" height="36" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="530" y="251" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">run the chunk</text>
  <rect x="620" y="228" width="100" height="36" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>

  <text x="80" y="286" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">SmolVLA reports about 30% faster completion this way, 9.7 s against 13.75 s (its authors&#8217; own figure)</text>
  <text x="720" y="150" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">time &#8594;</text>
</svg>
