<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" role="img" aria-label="One claim followed by three levels of interviewer follow-up, with a threshold between level one and level two marking where recited work runs out">

  <rect x="40" y="10" width="560" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="320" y="32" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">The claim</text>
  <text x="320" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">"I fine-tuned a vision-language-action model on my own dataset"</text>

  <line x1="320" y1="64" x2="320" y2="84" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7probeStep)"/>

  <rect x="40" y="88" width="560" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="320" y="110" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Level one</text>
  <text x="320" y="130" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">how many episodes, on what hardware, for how long</text>

  <line x1="40" y1="164" x2="600" y2="164" stroke="var(--ox, #9c3b2e)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="600" y="158" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">recited work stops here</text>

  <line x1="320" y1="142" x2="320" y2="182" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7probeStep)"/>

  <rect x="40" y="186" width="560" height="54" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="320" y="208" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Level two</text>
  <text x="320" y="228" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">which episodes did you throw away, and how did you decide</text>

  <line x1="320" y1="240" x2="320" y2="260" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7probeStep)"/>

  <rect x="40" y="264" width="560" height="54" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="320" y="286" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Level three</text>
  <text x="320" y="306" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">what did throwing them away do to the success rate, by how much</text>

  <defs>
    <marker id="m7probeStep" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
