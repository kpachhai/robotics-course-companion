<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" role="img" aria-label="A chain from the world through a sensor and model to a signed record that a stranger can check, with the uncovered gap between the world and the sensor marked">

  <text x="191" y="30" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">not covered</text>
  <text x="191" y="46" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">the gap</text>

  <rect x="20" y="60" width="150" height="80" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="94" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">The world</text>
  <text x="95" y="116" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">whatever is actually true</text>

  <line x1="172" y1="100" x2="208" y2="100" stroke="var(--ox, #9c3b2e)" stroke-width="1.4"
        stroke-dasharray="4 4" marker-end="url(#m7attestOx)"/>

  <rect x="214" y="60" width="150" height="80" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="289" y="94" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Sensor and model</text>
  <text x="289" y="116" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pixels become a claim</text>

  <line x1="366" y1="100" x2="402" y2="100" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7attestFwd)"/>

  <rect x="408" y="60" width="150" height="80" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="483" y="94" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Signed record</text>
  <text x="483" y="116" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">hash, key, timestamp</text>

  <line x1="560" y1="100" x2="596" y2="100" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7attestFwd)"/>

  <rect x="602" y="60" width="138" height="80" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="671" y="94" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">A stranger</text>
  <text x="671" y="116" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">checks the signature</text>

  <line x1="20" y1="152" x2="20" y2="164" stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <line x1="20" y1="164" x2="210" y2="164" stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <line x1="210" y1="164" x2="210" y2="152" stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <text x="115" y="182" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">was it true, was the camera</text>
  <text x="115" y="196" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pointed at the right thing</text>

  <line x1="214" y1="152" x2="214" y2="164" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="214" y1="164" x2="740" y2="164" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="740" y1="164" x2="740" y2="152" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="477" y="182" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the signature covers everything from here on: nothing was edited afterwards</text>

  <defs>
    <marker id="m7attestFwd" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m7attestOx" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
