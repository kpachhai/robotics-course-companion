<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="The capstone spine running from sensor through decision, control and actuation to measurement, with the four seams between stages marked as clock, frames, rates and message loss, and a dashed box above listing shell features that get cut">

  <rect x="16" y="20" width="728" height="78" rx="8"
        fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="380" y="48" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">The shell, and the kill list it becomes</text>
  <text x="380" y="70" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a web UI, a second embodiment, a config system, a second policy to compare, a deployment story</text>
  <text x="380" y="86" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">each one is a week, and none of them is evidence</text>

  <rect x="16" y="130" width="132" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="82" y="162" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Sensor</text>
  <text x="82" y="183" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">camera, encoders</text>

  <rect x="165" y="130" width="132" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="231" y="162" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Decision</text>
  <text x="231" y="183" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">policy or planner</text>

  <rect x="314" y="130" width="132" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="380" y="162" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Control</text>
  <text x="380" y="183" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">joint commands</text>

  <rect x="463" y="130" width="132" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="529" y="162" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Actuation</text>
  <text x="529" y="183" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the real robot</text>

  <rect x="612" y="130" width="132" height="76" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="678" y="162" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Measurement</text>
  <text x="678" y="183" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the logged outcome</text>

  <line x1="148" y1="168" x2="161" y2="168" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7capsSpine)"/>
  <line x1="297" y1="168" x2="310" y2="168" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7capsSpine)"/>
  <line x1="446" y1="168" x2="459" y2="168" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7capsSpine)"/>
  <line x1="595" y1="168" x2="608" y2="168" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7capsSpine)"/>

  <line x1="156" y1="206" x2="156" y2="224" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <line x1="305" y1="206" x2="305" y2="224" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <line x1="454" y1="206" x2="454" y2="224" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <line x1="603" y1="206" x2="603" y2="224" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>

  <circle cx="156" cy="234" r="9" fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.5"/>
  <circle cx="305" cy="234" r="9" fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.5"/>
  <circle cx="454" cy="234" r="9" fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.5"/>
  <circle cx="603" cy="234" r="9" fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.5"/>

  <text x="156" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">which clock</text>
  <text x="305" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">which frame</text>
  <text x="454" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">which rate</text>
  <text x="603" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">dropped messages</text>

  <text x="380" y="286" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the seams are where the weeks go, and five weekend projects contain none of them</text>

  <defs>
    <marker id="m7capsSpine" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
