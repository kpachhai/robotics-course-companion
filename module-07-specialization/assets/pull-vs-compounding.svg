<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 404" role="img" aria-label="A two by two grid placing a specialization track by how strongly the work pulls you and how much your existing background compounds inside it, with the four quadrants named">

  <rect x="115" y="44" width="278" height="149" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="254" y="106" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">The expensive hobby</text>
  <text x="254" y="132" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you will finish it, because you want to</text>
  <text x="254" y="148" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and you start the hard part from zero</text>

  <rect x="397" y="44" width="281" height="149" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="537" y="106" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">The position</text>
  <text x="537" y="132" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">two of your strengths at once</text>
  <text x="537" y="148" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the only quadrant that survives a bad month</text>

  <rect x="115" y="197" width="278" height="149" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="254" y="259" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">Neither</text>
  <text x="254" y="285" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">chosen for the headlines or the salary table</text>
  <text x="254" y="301" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">abandoned in week five</text>

  <rect x="397" y="197" width="281" height="149" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="537" y="259" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">The arbitrage</text>
  <text x="537" y="285" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pays quickly, priced below what it is worth</text>
  <text x="537" y="301" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">needs an external deadline to finish</text>

  <line x1="106" y1="352" x2="106" y2="36"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4" marker-end="url(#m7pullUp)"/>
  <line x1="106" y1="352" x2="686" y2="352"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4" marker-end="url(#m7pullRight)"/>

  <text x="98" y="52" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">high</text>
  <text x="98" y="342" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">low</text>
  <text x="30" y="194" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)" transform="rotate(-90 30 194)">how strongly it pulls you</text>

  <text x="120" y="370" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">low</text>
  <text x="678" y="370" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">high</text>
  <text x="396" y="392" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">how much your existing background compounds</text>

  <defs>
    <marker id="m7pullUp" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--line-2, #c8bca3)"/>
    </marker>
    <marker id="m7pullRight" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--line-2, #c8bca3)"/>
    </marker>
  </defs>
</svg>
