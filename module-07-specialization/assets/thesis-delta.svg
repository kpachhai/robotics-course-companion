<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" role="img" aria-label="The week-one thesis note sorted into three piles, held, broken and newly bet, which together become the rewritten note you date today">

  <rect x="16" y="44" width="164" height="180" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="98" y="112" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Week one</text>
  <text x="98" y="140" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one page, written</text>
  <text x="98" y="156" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">before you had</text>
  <text x="98" y="172" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">touched a servo</text>

  <line x1="182" y1="106" x2="228" y2="72" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7deltaFlow)"/>
  <line x1="182" y1="134" x2="228" y2="134" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7deltaFlow)"/>
  <line x1="182" y1="162" x2="228" y2="196" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7deltaFlow)"/>

  <rect x="234" y="44" width="246" height="56" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="357" y="68" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Held</text>
  <text x="357" y="88" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">survived contact with hardware</text>

  <rect x="234" y="106" width="246" height="56" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="357" y="130" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Broken</text>
  <text x="357" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you can name the run that broke it</text>

  <rect x="234" y="168" width="246" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="357" y="192" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">New</text>
  <text x="357" y="212" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a bet you could not have had in week one</text>

  <line x1="482" y1="72" x2="530" y2="106" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7deltaFlow)"/>
  <line x1="482" y1="134" x2="530" y2="134" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7deltaFlow)"/>
  <line x1="482" y1="196" x2="530" y2="162" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7deltaFlow)"/>

  <rect x="536" y="44" width="168" height="180" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="620" y="112" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">Today</text>
  <text x="620" y="140" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the same page,</text>
  <text x="620" y="156" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">rewritten, dated,</text>
  <text x="620" y="172" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">with a review date</text>

  <text x="360" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">keep both files; the delta is the only honest measure of the year</text>

  <defs>
    <marker id="m7deltaFlow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
