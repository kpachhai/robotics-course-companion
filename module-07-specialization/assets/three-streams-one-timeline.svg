<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-label="Three time-aligned lanes: camera frames at thirty hertz, joint states at two hundred hertz drawn as a dense comb, and policy actions at thirty hertz offset from the frames, with a marked gripper-close event and the vision gap before it highlighted">

  <line x1="150" y1="80" x2="700" y2="80" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <line x1="150" y1="150" x2="700" y2="150" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <line x1="150" y1="212" x2="700" y2="212" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>

  <text x="138" y="85" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">camera</text>
  <text x="138" y="155" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">joint states</text>
  <text x="138" y="217" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">policy actions</text>

  <text x="708" y="85" text-anchor="start" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">30 Hz</text>
  <text x="708" y="155" text-anchor="start" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">200 Hz</text>
  <text x="708" y="217" text-anchor="start" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">30 Hz</text>

  <circle cx="150" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="205" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="260" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="315" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="370" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="425" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="480" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="535" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="590" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="645" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>
  <circle cx="700" cy="80" r="3.5" fill="var(--blue, #2d5d7c)"/>

  <line x1="150" y1="150" x2="700" y2="150" stroke="var(--blue, #2d5d7c)" stroke-width="8"
        stroke-dasharray="1.5 7"/>

  <circle cx="168" cy="212" r="3.5" fill="var(--gold, #b07d22)"/>
  <circle cx="223" cy="212" r="3.5" fill="var(--gold, #b07d22)"/>
  <circle cx="278" cy="212" r="3.5" fill="var(--gold, #b07d22)"/>
  <circle cx="333" cy="212" r="3.5" fill="var(--gold, #b07d22)"/>
  <circle cx="388" cy="212" r="3.5" fill="var(--gold, #b07d22)"/>
  <circle cx="443" cy="212" r="3.5" fill="var(--gold, #b07d22)"/>
  <circle cx="498" cy="212" r="3.5" fill="var(--gold, #b07d22)"/>
  <circle cx="553" cy="212" r="3.5" fill="var(--gold, #b07d22)"/>
  <circle cx="608" cy="212" r="3.5" fill="var(--gold, #b07d22)"/>
  <circle cx="663" cy="212" r="3.5" fill="var(--gold, #b07d22)"/>

  <line x1="520" y1="56" x2="520" y2="228" stroke="var(--ox, #9c3b2e)" stroke-width="1.4"
        stroke-dasharray="4 4"/>
  <text x="520" y="46" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">gripper closes</text>

  <line x1="480" y1="102" x2="520" y2="102" stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <line x1="480" y1="98" x2="480" y2="106" stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <line x1="520" y1="98" x2="520" y2="106" stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <text x="472" y="106" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no new frame in this window</text>

  <text x="738" y="266" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the failure is a relationship between lanes, and no print statement records it</text>
</svg>
