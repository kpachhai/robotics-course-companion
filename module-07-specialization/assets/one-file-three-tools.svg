<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img" aria-label="Robot and simulator both write one recording in a single container format, which three different viewers then read: RViz2 for live inspection, Foxglove for shared review, and Rerun for notebooks and datasets">

  <rect x="24" y="110" width="150" height="72" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="99" y="142" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">robot and sim</text>
  <text x="99" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same schema, both</text>

  <line x1="176" y1="146" x2="214" y2="146" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m7toolsFwd)"/>

  <rect x="218" y="96" width="180" height="100" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="308" y="134" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">one recording</text>
  <text x="308" y="158" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">self-describing, indexed</text>
  <text x="308" y="176" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">seekable by time</text>

  <line x1="400" y1="146" x2="486" y2="66" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m7toolsFwd)"/>
  <line x1="400" y1="146" x2="486" y2="146" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m7toolsFwd)"/>
  <line x1="400" y1="146" x2="486" y2="226" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m7toolsFwd)"/>

  <rect x="490" y="36" width="246" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="613" y="62" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">RViz2</text>
  <text x="613" y="82" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">live, and what the interview assumes</text>

  <rect x="490" y="116" width="246" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="613" y="142" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Foxglove</text>
  <text x="613" y="162" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">shared and remote review</text>

  <rect x="490" y="196" width="246" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="613" y="222" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Rerun</text>
  <text x="613" y="242" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">notebooks, datasets, agents</text>

  <text x="308" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the container is the durable skill</text>
  <text x="308" y="266" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the viewers change every few months</text>

  <defs>
    <marker id="m7toolsFwd" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
