<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-label="Two rows. In the first, a reliable publisher and a reliable subscriber connect and messages arrive. In the second, a best-effort publisher and a reliable subscriber never connect and no error is reported">

  <rect x="40" y="40" width="190" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="135" y="68" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Publisher</text>
  <text x="135" y="88" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">offers: reliable</text>

  <line x1="232" y1="72" x2="386" y2="72" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m7qosFwd)"/>

  <rect x="390" y="40" width="190" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="485" y="68" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Subscriber</text>
  <text x="485" y="88" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">requests: reliable</text>

  <line x1="582" y1="72" x2="592" y2="72" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m7qosFwd)"/>

  <rect x="596" y="40" width="144" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="668" y="68" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Connected</text>
  <text x="668" y="88" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">messages arrive</text>

  <line x1="40" y1="136" x2="740" y2="136" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>

  <rect x="40" y="170" width="190" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="135" y="198" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Publisher</text>
  <text x="135" y="218" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">offers: best effort</text>

  <line x1="232" y1="202" x2="386" y2="202" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        stroke-dasharray="4 4"/>
  <line x1="301" y1="194" x2="317" y2="210" stroke="var(--ox, #9c3b2e)" stroke-width="2"/>
  <line x1="317" y1="194" x2="301" y2="210" stroke="var(--ox, #9c3b2e)" stroke-width="2"/>

  <rect x="390" y="170" width="190" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="485" y="198" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Subscriber</text>
  <text x="485" y="218" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">requests: reliable</text>

  <line x1="582" y1="202" x2="592" y2="202" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m7qosOx)"/>

  <rect x="596" y="170" width="144" height="64" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="668" y="198" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">No connection</text>
  <text x="668" y="218" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and no error</text>

  <text x="309" y="254" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the subscriber demands a guarantee the publisher never offered</text>
  <text x="740" y="278" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">ros2 topic list shows the topic either way</text>

  <defs>
    <marker id="m7qosFwd" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m7qosOx" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
