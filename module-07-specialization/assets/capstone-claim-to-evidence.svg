<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" role="img" aria-label="A capstone claim feeding three kinds of evidence, measured behaviour, a durable artifact and a failure account, which together let a stranger check the work without the author present, with a clean demo video shown separately as something that counts as no evidence at all">

  <rect x="16" y="98" width="176" height="92" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="104" y="132" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">The claim</text>
  <text x="104" y="154" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one sentence</text>
  <text x="104" y="170" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">that could be false</text>

  <line x1="194" y1="140" x2="252" y2="52" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7capsEv)"/>
  <line x1="194" y1="144" x2="252" y2="144" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7capsEv)"/>
  <line x1="194" y1="148" x2="252" y2="236" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7capsEv)"/>

  <rect x="258" y="16" width="244" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="380" y="44" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Measured behaviour</text>
  <text x="380" y="66" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">N trials, broken out by condition</text>

  <rect x="258" y="110" width="244" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="380" y="138" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">A durable artifact</text>
  <text x="380" y="160" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">dataset, recording, checkpoint</text>

  <rect x="258" y="204" width="244" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="380" y="232" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">A failure account</text>
  <text x="380" y="254" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">what broke, and the root cause</text>

  <line x1="504" y1="52" x2="560" y2="122" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7capsEv)"/>
  <line x1="504" y1="144" x2="560" y2="144" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7capsEv)"/>
  <line x1="504" y1="236" x2="560" y2="166" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7capsEv)"/>

  <rect x="566" y="98" width="178" height="92" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="655" y="130" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">Something to ask</text>
  <text x="655" y="152" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a stranger can check it</text>
  <text x="655" y="168" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">without you in the room</text>

  <line x1="258" y1="294" x2="502" y2="294" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <text x="380" y="312" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">does not count as evidence</text>

  <rect x="258" y="320" width="244" height="34" rx="8"
        fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="380" y="342" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">a clean demo video, alone</text>

  <defs>
    <marker id="m7capsEv" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
