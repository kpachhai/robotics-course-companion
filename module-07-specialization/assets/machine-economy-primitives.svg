<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-label="Three machine-economy primitives, each split into the part already deployed in robotics today and the part that is still speculative">

  <text x="356" y="36" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--green, #15614e)">Deployed today</text>
  <text x="618" y="36" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--ox, #9c3b2e)">Still speculative</text>

  <rect x="20" y="50" width="190" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="115" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Identity with</text>
  <text x="115" y="96" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">delegated authority</text>

  <rect x="232" y="50" width="248" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="356" y="78" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Device identity</text>
  <text x="356" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">per-device credentials, mutual auth</text>

  <rect x="496" y="50" width="244" height="64" rx="8"
        fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="618" y="78" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Cross-operator scope</text>
  <text x="618" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">authority someone else evaluates</text>

  <rect x="20" y="132" width="190" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="115" y="170" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Metered exchange</text>

  <rect x="232" y="132" width="248" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="356" y="160" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Metered billing</text>
  <text x="356" y="180" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">solved, everywhere except robotics</text>

  <rect x="496" y="132" width="244" height="64" rx="8"
        fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="618" y="160" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Robot paying robot</text>
  <text x="618" y="180" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">for a resource with a real price</text>

  <rect x="20" y="214" width="190" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="115" y="252" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Attested telemetry</text>

  <rect x="232" y="214" width="248" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="356" y="242" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Signed logs</text>
  <text x="356" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">normal in adjacent regulated fields</text>

  <rect x="496" y="214" width="244" height="64" rx="8"
        fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="618" y="242" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Checkable evaluation</text>
  <text x="618" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">buildable now, expected by nobody</text>
</svg>
