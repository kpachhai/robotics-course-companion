<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 282" role="img" aria-label="A failed software tool call compared with a failed robot skill call, across the error you receive, the state afterwards, and what a retry costs">

  <text x="295" y="28" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">A software tool call</text>
  <text x="565" y="28" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">A robot skill call</text>

  <text x="152" y="85" text-anchor="end" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">The call fails</text>
  <rect x="170" y="50" width="250" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="295" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">You get an error</text>
  <text x="295" y="96" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and that is the whole event</text>
  <rect x="440" y="50" width="250" height="60" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="565" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">You get an error</text>
  <text x="565" y="96" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the event carries on without you</text>

  <text x="152" y="161" text-anchor="end" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">State afterwards</text>
  <rect x="170" y="126" width="250" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="295" y="152" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Nothing moved</text>
  <text x="295" y="172" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">exactly where you left it</text>
  <rect x="440" y="126" width="250" height="60" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="565" y="152" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">The world moved</text>
  <text x="565" y="172" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">floor, gripper, or stalled</text>

  <text x="152" y="237" text-anchor="end" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">Cost of a retry</text>
  <rect x="170" y="202" width="250" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="295" y="228" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Free</text>
  <text x="295" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same call, same starting state</text>
  <rect x="440" y="202" width="250" height="60" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="565" y="228" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Not free</text>
  <text x="565" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">look, classify, recover, re-check</text>
</svg>
