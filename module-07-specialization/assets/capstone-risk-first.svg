<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img" aria-label="Two eight-week capstone orderings compared: the easiest-first order meets its riskiest assumption in week six with two weeks left to respond, while the risk-first order probes the same assumption in week one and leaves seven weeks of correction">

  <text x="54" y="40" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">week</text>
  <text x="138" y="40" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">1</text>
  <text x="219" y="40" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">2</text>
  <text x="300" y="40" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">3</text>
  <text x="381" y="40" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">4</text>
  <text x="462" y="40" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">5</text>
  <text x="543" y="40" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">6</text>
  <text x="624" y="40" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">7</text>
  <text x="705" y="40" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">8</text>

  <text x="54" y="78" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">Easiest</text>
  <text x="54" y="94" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">first</text>

  <rect x="100" y="54" width="401" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="300" y="80" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">the parts you already know how to build</text>
  <text x="300" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">visible progress, no information</text>

  <rect x="505" y="54" width="77" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="543" y="80" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">the risk</text>
  <text x="543" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">met here</text>

  <rect x="586" y="54" width="158" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="665" y="80" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">rescue attempt</text>
  <text x="665" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">or a shrunken claim</text>

  <line x1="505" y1="126" x2="740" y2="126" stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m7capsWeekOx)"/>
  <text x="622" y="142" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">two weeks left to respond</text>

  <text x="54" y="184" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">Risk</text>
  <text x="54" y="200" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">first</text>

  <rect x="100" y="160" width="77" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="138" y="186" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">probe</text>
  <text x="138" y="204" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">thrown away</text>

  <rect x="181" y="160" width="77" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="219" y="186" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">slice</text>
  <text x="219" y="204" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">end to end</text>

  <rect x="262" y="160" width="239" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="381" y="186" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">improve, measure, repeat</text>
  <text x="381" y="204" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the loop that raises the number</text>

  <rect x="505" y="160" width="77" height="54" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="543" y="186" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">freeze</text>
  <text x="543" y="204" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">run the eval</text>

  <rect x="586" y="160" width="158" height="54" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="665" y="186" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">ship it</text>
  <text x="665" y="204" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">README, video, write-up</text>

  <line x1="177" y1="232" x2="740" y2="232" stroke="var(--green, #15614e)" stroke-width="1.3" marker-end="url(#m7capsWeekOk)"/>
  <text x="458" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">seven weeks left to respond</text>

  <defs>
    <marker id="m7capsWeekOx" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
    <marker id="m7capsWeekOk" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--green, #15614e)"/>
    </marker>
  </defs>
</svg>
