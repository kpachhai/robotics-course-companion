<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 208" role="img" aria-label="The order a stranger opens your work in, the question each object answers, and the one sentence they leave with">

  <rect x="14" y="40" width="132" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="80" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">The README</text>
  <text x="80" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">what did they</text>
  <text x="80" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">actually build</text>

  <line x1="148" y1="82" x2="178" y2="82" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7readChain)"/>

  <rect x="182" y="40" width="132" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="248" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">The video</text>
  <text x="248" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">is any of it</text>
  <text x="248" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">real hardware</text>

  <line x1="316" y1="82" x2="346" y2="82" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7readChain)"/>

  <rect x="350" y="40" width="132" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="416" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">The numbers</text>
  <text x="416" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">does it work, and</text>
  <text x="416" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">how often</text>

  <line x1="484" y1="82" x2="514" y2="82" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7readChain)"/>

  <rect x="518" y="40" width="132" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="584" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">The post-mortem</text>
  <text x="584" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">can they find a</text>
  <text x="584" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">root cause</text>

  <line x1="652" y1="82" x2="682" y2="82" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7readChain)"/>

  <rect x="686" y="40" width="80" height="84" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="726" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">One</text>
  <text x="726" y="88" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">sentence</text>
  <text x="726" y="108" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">they repeat</text>

  <text x="390" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">seven minutes, no follow-up questions, and you are not in the room</text>

  <defs>
    <marker id="m7readChain" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
