<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" role="img" aria-label="The locomotion training loop: thousands of randomised parallel simulations produce one policy that must survive one real robot, with the compute bill and the repair bill marked and a feedback path back to randomisation">

  <rect x="20" y="18" width="144" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="92" y="40" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">The compute bill</text>
  <text x="92" y="56" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">sustained, not bursty</text>
  <line x1="92" y1="62" x2="92" y2="76" stroke="var(--muted, #6b6053)" stroke-width="1.2"/>

  <rect x="596" y="18" width="144" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="668" y="40" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">The repair bill</text>
  <text x="668" y="56" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every fall costs parts</text>
  <line x1="668" y1="62" x2="668" y2="76" stroke="var(--muted, #6b6053)" stroke-width="1.2"/>

  <rect x="20" y="76" width="144" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="92" y="106" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Parallel sim</text>
  <text x="92" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">thousands at a time</text>
  <text x="92" y="144" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">on one GPU</text>

  <line x1="166" y1="118" x2="206" y2="118" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7locoFwd)"/>

  <rect x="212" y="76" width="144" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="284" y="106" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Randomise</text>
  <text x="284" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">friction, mass, delay</text>
  <text x="284" y="144" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">terrain, curriculum</text>

  <line x1="358" y1="118" x2="398" y2="118" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7locoFwd)"/>

  <rect x="404" y="76" width="144" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="476" y="106" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">One policy</text>
  <text x="476" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">trained where nothing</text>
  <text x="476" y="144" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">actually breaks</text>

  <line x1="550" y1="118" x2="590" y2="118" stroke="var(--ox, #9c3b2e)" stroke-width="1.4"
        stroke-dasharray="4 4" marker-end="url(#m7locoOx)"/>

  <rect x="596" y="76" width="144" height="84" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="668" y="106" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">One real robot</text>
  <text x="668" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">where everything does</text>

  <text x="570" y="180" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">the reality gap</text>

  <line x1="700" y1="160" x2="700" y2="214" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="700" y1="214" x2="284" y2="214" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="284" y1="214" x2="284" y2="164" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7locoFwd)"/>
  <text x="470" y="206" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">widen the randomisation and train again</text>

  <defs>
    <marker id="m7locoFwd" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m7locoOx" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
