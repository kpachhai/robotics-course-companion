<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-label="The robot data plane: robot to recorder to validated ingest to a versioned dataset, then training, evaluation and staged deployment, closing back on the robot">

  <rect x="20" y="40" width="154" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="97" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Robot</text>
  <text x="97" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">many clocks, one world</text>

  <line x1="176" y1="78" x2="204" y2="78" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7planeFwd)"/>

  <rect x="208" y="40" width="154" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="285" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Recorder</text>
  <text x="285" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one timeline, one format</text>

  <line x1="364" y1="78" x2="392" y2="78" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7planeFwd)"/>

  <rect x="396" y="40" width="154" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="473" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Ingest and check</text>
  <text x="473" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reject with a reason</text>

  <line x1="552" y1="78" x2="580" y2="78" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7planeFwd)"/>

  <rect x="584" y="40" width="154" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="661" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Dataset store</text>
  <text x="661" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">versioned, addressable</text>

  <line x1="661" y1="118" x2="661" y2="166" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7planeFwd)"/>

  <rect x="584" y="170" width="154" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="661" y="200" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Training</text>
  <text x="661" y="222" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the part with the papers</text>

  <line x1="582" y1="208" x2="554" y2="208" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7planeFwd)"/>

  <rect x="396" y="170" width="154" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="473" y="200" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Eval harness</text>
  <text x="473" y="222" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">N trials, per condition</text>

  <line x1="394" y1="208" x2="366" y2="208" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7planeFwd)"/>

  <rect x="208" y="170" width="154" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="285" y="200" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Deploy</text>
  <text x="285" y="222" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">staged and observed</text>

  <line x1="208" y1="208" x2="97" y2="208" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="97" y1="208" x2="97" y2="120" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m7planeFwd)"/>
  <text x="150" y="200" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">back to the robot</text>

  <text x="738" y="280" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the two gold boxes are the ones nobody writes papers about</text>

  <defs>
    <marker id="m7planeFwd" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
