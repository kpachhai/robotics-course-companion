<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" role="img" aria-label="A single-threaded executor containing a pending queue and one running callback that is blocked waiting for a service reply; the reply returns into the same queue that only the blocked executor can drain">

  <rect x="30" y="44" width="450" height="186" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="255" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Single-threaded executor</text>

  <rect x="56" y="92" width="170" height="118" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="141" y="118" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">pending queue</text>
  <text x="141" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the service reply</text>
  <text x="141" y="168" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the next timer tick</text>
  <text x="141" y="190" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every subscription</text>

  <rect x="256" y="92" width="196" height="64" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="354" y="118" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">callback, running</text>
  <text x="354" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">blocked, waiting for a reply</text>

  <line x1="454" y1="112" x2="556" y2="112" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m7execFwd)"/>
  <text x="505" y="104" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">request</text>

  <rect x="560" y="92" width="170" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="645" y="118" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">service server</text>
  <text x="645" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">replies at once</text>

  <line x1="645" y1="156" x2="645" y2="188" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="645" y1="188" x2="230" y2="188" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m7execFwd)"/>
  <text x="350" y="180" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the reply comes back and joins the queue</text>

  <text x="740" y="262" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">only the blocked executor can drain that queue, so nothing ever moves again</text>

  <defs>
    <marker id="m7execFwd" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
