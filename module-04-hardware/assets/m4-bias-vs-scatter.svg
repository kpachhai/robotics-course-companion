  <circle cx="522" cy="148" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <circle cx="590" cy="96" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <circle cx="470" cy="122" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <circle cx="566" cy="192" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
