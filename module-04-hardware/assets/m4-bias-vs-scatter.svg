  <text x="195" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">bias 29 mm, scatter 6 mm</text>
  <text x="195" y="264" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">go and look at geometry</text>
  <text x="195" y="282" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">calibration, a camera that moved, a shifted mount</text>

  <text x="545" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
