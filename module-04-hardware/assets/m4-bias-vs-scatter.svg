<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 296" role="img" aria-label="Two panels of where the gripper landed relative to the object. On the left a tight cluster sitting well to one side of the target, which is a systematic error. On the right a wide cloud centred on the target, which is a random error. The two need completely different fixes">
  <text x="195" y="30" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Tight, and in the wrong place</text>
  <text x="545" y="30" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Centred, and all over the place</text>

  <rect x="40" y="44" width="310" height="180" rx="8" fill="var(--paper-2, #faf7ef)"
        stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <circle cx="195" cy="134" r="26" fill="none" stroke="var(--green, #15614e)"
          stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="185" y1="134" x2="205" y2="134" stroke="var(--green, #15614e)" stroke-width="1.4"/>
  <line x1="195" y1="124" x2="195" y2="144" stroke="var(--green, #15614e)" stroke-width="1.4"/>
  <line x1="195" y1="108" x2="228" y2="72" stroke="var(--muted, #6b6053)" stroke-width="1"/>
  <text x="232" y="69" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the object, and</text>
  <text x="232" y="81" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the grasp tolerance</text>
  <circle cx="146" cy="130" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <circle cx="152" cy="137" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <circle cx="144" cy="139" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
