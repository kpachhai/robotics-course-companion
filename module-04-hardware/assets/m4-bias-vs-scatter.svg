  <circle cx="155" cy="133" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <circle cx="141" cy="132" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <circle cx="149" cy="142" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <circle cx="153" cy="127" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <circle cx="147" cy="136" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <circle cx="158" cy="138" r="3.5" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.2"/>
  <line x1="150" y1="185" x2="192" y2="185" stroke="var(--muted, #6b6053)" stroke-width="1.1"
