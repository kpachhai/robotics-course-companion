  <text x="545" y="264" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">go and look at the data</text>
  <text x="545" y="282" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">coverage, demo consistency, lighting drift</text>

  <defs>
    <marker id="m4BiasTick" markerWidth="7" markerHeight="9" refX="3.5" refY="4.5" orient="auto">
      <path d="M3.5,0 L3.5,9" stroke="var(--muted, #6b6053)" stroke-width="1.1" fill="none"/>
    </marker>
  </defs>
</svg>
