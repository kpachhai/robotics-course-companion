  <line x1="535" y1="134" x2="555" y2="134" stroke="var(--green, #15614e)" stroke-width="1.4"/>
  <line x1="545" y1="124" x2="545" y2="144" stroke="var(--green, #15614e)" stroke-width="1.4"/>
