<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Two motors sharing the factory default ID both answer the same question and the transaction fails as a timeout; the procedure below connects one motor alone, writes its ID into non-volatile memory, and repeats six times from the gripper to the base">

  <text x="20" y="14" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">what happens when two motors share an ID</text>

  <rect x="20" y="58" width="110" height="64" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="75" y="86" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">Board</text>
  <text x="75" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">asks: who is 1?</text>

  <line x1="130" y1="90" x2="170" y2="90" stroke="var(--muted, #6b6053)" stroke-width="1.6"/>
  <line x1="170" y1="49" x2="170" y2="131" stroke="var(--muted, #6b6053)" stroke-width="1.6"/>
  <line x1="170" y1="49" x2="200" y2="49" stroke="var(--muted, #6b6053)" stroke-width="1.6"/>
  <line x1="170" y1="131" x2="200" y2="131" stroke="var(--muted, #6b6053)" stroke-width="1.6"/>

  <rect x="200" y="22" width="110" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="255" y="46" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">ID 1</text>
  <text x="255" y="64" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">factory default</text>

  <rect x="200" y="104" width="110" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="255" y="128" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">ID 1</text>
  <text x="255" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">factory default</text>

  <line x1="312" y1="52" x2="386" y2="82"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m4IdArrowBad)"/>
  <line x1="312" y1="128" x2="386" y2="98"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m4IdArrowBad)"/>
  <line x1="392" y1="82" x2="408" y2="98" stroke="var(--ox, #9c3b2e)" stroke-width="2"/>
  <line x1="392" y1="98" x2="408" y2="82" stroke="var(--ox, #9c3b2e)" stroke-width="2"/>

  <line x1="414" y1="90" x2="450" y2="90"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4IdArrow)"/>

  <rect x="456" y="58" width="284" height="64" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="598" y="86" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">Timeout</text>
  <text x="598" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one damaged reply, or none at all</text>

  <line x1="20" y1="180" x2="740" y2="180"
        stroke="var(--line-2, #c8bca3)" stroke-width="1" stroke-dasharray="4 5"/>

  <text x="20" y="200" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the procedure that prevents it</text>

  <rect x="20" y="212" width="200" height="72" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="120" y="242" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">One motor, alone</text>
  <text x="120" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nothing else on the bus</text>

  <line x1="222" y1="248" x2="262" y2="248"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4IdArrow)"/>

  <rect x="268" y="212" width="200" height="72" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="368" y="242" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Write ID and baud</text>
  <text x="368" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">into EEPROM, once, forever</text>

  <line x1="470" y1="248" x2="510" y2="248"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4IdArrow)"/>

  <rect x="516" y="212" width="214" height="72" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="623" y="242" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Repeat six times</text>
  <text x="623" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gripper first, base last</text>

  <path d="M 623,286 L 623,306 L 120,306 L 120,288" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4IdArrow)"/>

  <defs>
    <marker id="m4IdArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m4IdArrowBad" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
