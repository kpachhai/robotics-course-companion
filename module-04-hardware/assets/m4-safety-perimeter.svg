<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="The bench seen from above before an autonomous run: a dashed arc marks everything the arm can sweep, the power plug sits outside that arc within reach of your free hand, the keyboard and mug sit outside it too, and nothing fragile is inside">

  <rect x="40" y="30" width="680" height="300" rx="8"
        fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>
  <text x="56" y="52" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">your bench, from above</text>

  <path d="M230,268 A170,170 0 0 1 570,268" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="400" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">everything the arm can reach</text>

  <rect x="290" y="146" width="220" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="400" y="170" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">nothing fragile in here</text>
  <text x="400" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and nothing you would miss</text>

  <circle cx="500" cy="215" r="13"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="500" y="243" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the object</text>

  <rect x="350" y="268" width="100" height="42" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="400" y="288" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">arm base</text>
  <text x="400" y="304" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">clamped down</text>

  <rect x="60" y="190" width="150" height="56" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="135" y="214" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">power plug</text>
  <text x="135" y="232" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">loose, in reach</text>

  <rect x="580" y="190" width="130" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="645" y="214" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">keyboard, mug</text>
  <text x="645" y="232" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">outside the arc</text>
</svg>
