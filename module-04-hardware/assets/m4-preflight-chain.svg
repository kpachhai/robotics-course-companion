<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="Five pre-flight gates before every autonomous run: clear the desk, match the cameras to the reference photo, set the motion clamp, keep the duration short, and put a hand on the power plug with safety glasses on">

  <rect x="24" y="56" width="130" height="86" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="89" y="88" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Clear the desk</text>
  <text x="89" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nothing fragile</text>
  <text x="89" y="125" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">inside the sweep</text>

  <rect x="168" y="56" width="130" height="86" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="233" y="88" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Match cameras</text>
  <text x="233" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same names, same view</text>
  <text x="233" y="125" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">as the reference photo</text>

  <rect x="312" y="56" width="130" height="86" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="377" y="88" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Clamp motion</text>
  <text x="377" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">max_relative_target</text>
  <text x="377" y="125" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">is off by default</text>

  <rect x="456" y="56" width="130" height="86" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="521" y="88" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Keep it short</text>
  <text x="521" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">--duration=15 on</text>
  <text x="521" y="125" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the very first run</text>

  <rect x="600" y="56" width="130" height="86" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="665" y="88" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">Hand on plug</text>
  <text x="665" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">glasses on, and be</text>
  <text x="665" y="125" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">ready to catch it</text>

  <line x1="154" y1="99" x2="164" y2="99"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L14PreArrow)"/>
  <line x1="298" y1="99" x2="308" y2="99"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L14PreArrow)"/>
  <line x1="442" y1="99" x2="452" y2="99"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L14PreArrow)"/>
  <line x1="586" y1="99" x2="596" y2="99"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L14PreArrow)"/>

  <path d="M24 166 L24 176 L730 176 L730 166" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <text x="377" y="196" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">all five, before every autonomous run, not only the first one</text>

  <text x="377" y="40" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm has no collision detection, no force sensing, and no external stop button</text>

  <defs>
    <marker id="m4L14PreArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
