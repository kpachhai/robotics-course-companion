<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" role="img" aria-label="One joint's angle drawn as a line, at three moments in a single sweep. Setting off, the follower sits a little behind the leader. Moving fast, the gap is at its widest. When the hand stops, the follower catches up and the two coincide">

  <text x="20" y="22" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one joint's angle, increasing to the right, at three moments of one sweep</text>

  <line x1="150" y1="72" x2="660" y2="72" stroke="var(--line-2, #c8bca3)" stroke-width="1.1"/>
  <text x="140" y="76" text-anchor="end" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">setting off</text>
  <circle cx="230" cy="72" r="8" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <circle cx="278" cy="72" r="8" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="278" y="54" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">leader, where your hand is</text>
  <text x="230" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">follower, where it got to</text>

  <line x1="150" y1="160" x2="660" y2="160" stroke="var(--line-2, #c8bca3)" stroke-width="1.1"/>
  <text x="140" y="164" text-anchor="end" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">mid sweep, fast</text>
  <circle cx="382" cy="160" r="8" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <circle cx="520" cy="160" r="8" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <line x1="390" y1="138" x2="512" y2="138" stroke="var(--ox, #9c3b2e)" stroke-width="1.4"/>
  <line x1="390" y1="132" x2="390" y2="144" stroke="var(--ox, #9c3b2e)" stroke-width="1.4"/>
  <line x1="512" y1="132" x2="512" y2="144" stroke="var(--ox, #9c3b2e)" stroke-width="1.4"/>
  <text x="451" y="124" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">the gap is widest here</text>
  <text x="451" y="186" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the follower is fighting gravity, gearbox friction and its own inertia</text>

  <line x1="150" y1="240" x2="660" y2="240" stroke="var(--line-2, #c8bca3)" stroke-width="1.1"/>
  <text x="140" y="244" text-anchor="end" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">you stop</text>
  <circle cx="596" cy="240" r="12" fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <circle cx="596" cy="240" r="6" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="596" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the follower catches up, gap closed</text>

  <text x="20" y="270" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">How wide your gap gets is a number nobody can give you.</text>
  <text x="20" y="284" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Find the fastest sweep where you cannot see one, and treat that as your speed budget.</text>

</svg>
