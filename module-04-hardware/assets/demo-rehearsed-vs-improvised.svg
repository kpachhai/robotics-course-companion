<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 232" role="img" aria-label="Two episodes of the same task drawn on the same time scale. The rehearsed one runs approach, grip, lift, carry, return in one committed pass. The improvised one contains the same phases plus a hesitation, a second approach, a re-grip and a pause, which are the blocks of training rows you did not mean to write">

  <text x="20" y="20" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">two episodes of one task, same operator, same afternoon, drawn on the same time scale</text>

  <text x="80" y="69" text-anchor="end" class="svg-disp" font-size="13.5" font-weight="700"
        fill="var(--blue, #2d5d7c)">rehearsed</text>

  <rect x="90" y="44" width="89" height="40" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="134" y="68" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">approach</text>
  <rect x="182" y="44" width="43" height="40" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="203" y="68" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">grip</text>
  <rect x="228" y="44" width="43" height="40" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="249" y="68" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">lift</text>
  <rect x="274" y="44" width="135" height="40" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="341" y="68" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">carry</text>
  <rect x="412" y="44" width="80" height="40" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="452" y="68" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">return</text>
  <text x="504" y="69" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">8.8 s</text>

  <text x="80" y="151" text-anchor="end" class="svg-disp" font-size="13.5" font-weight="700"
        fill="var(--ox, #9c3b2e)">improvised</text>

  <rect x="90" y="126" width="89" height="40" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="134" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">approach</text>
  <rect x="182" y="126" width="61" height="40" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="212" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">hesitate</text>
  <rect x="246" y="126" width="52" height="40" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="272" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">again</text>
  <rect x="301" y="126" width="43" height="40" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="322" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">grip</text>
  <rect x="347" y="126" width="57" height="40" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="375" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">re-grip</text>
  <rect x="407" y="126" width="43" height="40" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="428" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">lift</text>
  <rect x="453" y="126" width="135" height="40" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="520" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">carry</text>
  <rect x="591" y="126" width="38" height="40" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="610" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pause</text>
  <rect x="632" y="126" width="80" height="40" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="672" y="150" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">return</text>
  <text x="724" y="151" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">13.6 s</text>

  <line x1="212" y1="166" x2="212" y2="190"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <line x1="375" y1="166" x2="375" y2="190"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <line x1="610" y1="166" x2="610" y2="190"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <line x1="212" y1="192" x2="610" y2="192"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <text x="212" y="212" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">the rows you did not mean to write</text>
  <text x="212" y="226" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">both episodes end with the brick in the bin. Only one of them is a good label.</text>
</svg>
