<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="What one recorded frame holds: a front camera image, a wrist camera image, the follower's measured joint positions, and the command that was sent at that instant, all stamped with a time, an episode index and the task sentence. The policy learns to predict the command from the images and joint positions">

  <rect x="24" y="40" width="460" height="220" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.4"/>
  <text x="40" y="32" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one frame, captured thirty times a second</text>

  <rect x="48" y="76" width="190" height="64" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="143" y="104" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">front image</text>
  <text x="143" y="123" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">640 by 480 pixels</text>

  <rect x="48" y="156" width="190" height="64" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="143" y="184" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">wrist image</text>
  <text x="143" y="203" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">640 by 480 pixels</text>

  <rect x="258" y="76" width="202" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="359" y="104" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">joint positions</text>
  <text x="359" y="123" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">six numbers, where it is</text>

  <rect x="258" y="156" width="202" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="359" y="184" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">the command</text>
  <text x="359" y="203" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">six numbers, what you asked for</text>

  <line x1="254" y1="260" x2="254" y2="272"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="254" y="288" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">stamped with a time, an episode index, and the task sentence</text>

  <line x1="484" y1="150" x2="524" y2="150"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L12FrameArrow)"/>

  <rect x="532" y="98" width="204" height="104" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.4"/>
  <text x="634" y="128" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--muted, #6b6053)">what gets learned</text>
  <text x="634" y="152" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">images and joint positions</text>
  <text x="634" y="168" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">go in, the command comes out</text>
  <text x="634" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">your hand is the label</text>

  <defs>
    <marker id="m4L12FrameArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
