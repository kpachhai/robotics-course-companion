<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="Six checkpoints saved along a training run, with three of them singled out for a twenty-trial evaluation on the real arm, because a lower training loss does not guarantee a higher success rate">

  <line x1="100" y1="130" x2="700" y2="130"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>

  <circle cx="140" cy="130" r="16"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="140" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">10k</text>

  <circle cx="240" cy="130" r="16"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="240" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">20k</text>

  <circle cx="340" cy="130" r="16"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.8"/>
  <text x="340" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">30k</text>

  <circle cx="440" cy="130" r="16"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="440" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">40k</text>

  <circle cx="540" cy="130" r="16"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.8"/>
  <text x="540" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50k</text>

  <circle cx="640" cy="130" r="16"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.8"/>
  <text x="640" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">60k, the last one</text>

  <rect x="300" y="24" width="300" height="48" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="450" y="53" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">run twenty real trials on each of these</text>

  <line x1="360" y1="72" x2="342" y2="112"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="500" y1="72" x2="536" y2="112"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="560" y1="72" x2="634" y2="112"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <text x="100" y="196" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every checkpoint is saved by --save_freq; a lower training loss does not promise a higher success rate</text>
</svg>
