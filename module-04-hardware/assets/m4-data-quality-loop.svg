<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" role="img" aria-label="The data-quality loop: record episodes, train a policy, evaluate over twenty or more trials, then diagnose the failures into buckets, and only then record again with the next batch aimed at the largest bucket">
  <rect x="25" y="28" width="155" height="58" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="102.5" y="54" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Record</text>
  <text x="102.5" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">episodes you chose</text>

  <line x1="180" y1="57" x2="208" y2="57"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4LoopArrow)"/>

  <rect x="210" y="28" width="155" height="58" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="287.5" y="54" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Train</text>
  <text x="287.5" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">five to ten epochs</text>

  <line x1="365" y1="57" x2="393" y2="57"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4LoopArrow)"/>

  <rect x="395" y="28" width="155" height="58" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="472.5" y="54" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Evaluate</text>
  <text x="472.5" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">20+ trials, watched</text>

  <line x1="550" y1="57" x2="578" y2="57"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4LoopArrow)"/>

  <rect x="580" y="28" width="155" height="58" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="657.5" y="54" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--gold, #b07d22)">Diagnose</text>
  <text x="657.5" y="72" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">sort failures into buckets</text>

  <path d="M657.5 86 V132 H102.5 V90" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4LoopArrow)"/>
  <text x="380" y="152" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the next batch is aimed at the largest bucket, not simply added to the pile</text>
  <text x="380" y="168" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">skip the gold box and the dataset grows while the success rate does not</text>

  <defs>
    <marker id="m4LoopArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
