<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 294" role="img" aria-label="From the same starting view you sometimes reached around the left of the mug and sometimes around the right. Both routes work. The model sees one situation with two different correct answers, and the average of the two goes straight through the mug">

  <circle cx="56" cy="146" r="9"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="56" y="180" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gripper here,</text>
  <text x="56" y="194" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same camera view</text>

  <rect x="290" y="118" width="58" height="58" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="319" y="152" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">mug</text>

  <circle cx="580" cy="146" r="9"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="580" y="180" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">handle</text>

  <path d="M66 140 C170 54, 470 54, 570 138" fill="none"
        stroke="var(--blue, #2d5d7c)" stroke-width="2" marker-end="url(#m4DemoModeArrow)"/>
  <text x="319" y="62" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">what you did in 30 episodes</text>

  <path d="M66 154 C170 240, 470 240, 570 156" fill="none"
        stroke="var(--blue, #2d5d7c)" stroke-width="2" marker-end="url(#m4DemoModeArrow)"/>
  <text x="319" y="244" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">what you did in the other 20</text>

  <line x1="70" y1="146" x2="566" y2="146"
        stroke="var(--ox, #9c3b2e)" stroke-width="2" stroke-dasharray="6 5"
        marker-end="url(#m4DemoModeOxArrow)"/>
  <text x="100" y="138" class="svg-disp" font-size="13.5" font-weight="700"
        fill="var(--ox, #9c3b2e)">the average of the two</text>

  <text x="24" y="266" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">A chunked or diffusion policy can hold both routes as separate options, which is much of why they exist.</text>
  <text x="24" y="280" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Neither rescues variation that had no reason: noise has no second mode to learn, only a wider spread.</text>

  <defs>
    <marker id="m4DemoModeArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--blue, #2d5d7c)"/>
    </marker>
    <marker id="m4DemoModeOxArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
