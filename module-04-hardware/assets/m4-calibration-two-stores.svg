<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-label="Calibration is written to two places at once, the motor's own memory and a JSON file named after your robot id, and every connect compares them: if they agree the arm runs, and if they differ or the file is missing LeRobot quietly recalibrates">

  <rect x="60" y="40" width="280" height="80" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="200" y="70" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Motor EEPROM</text>
  <text x="200" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">written into each servo</text>
  <text x="200" y="108" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">survives power-off</text>

  <rect x="420" y="40" width="280" height="80" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="560" y="70" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Calibration file</text>
  <text x="560" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">~/.cache/huggingface/lerobot/</text>
  <text x="560" y="108" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">calibration/robots/so_follower/&lt;id&gt;.json</text>

  <path d="M200,120 L200,146 L330,146 L330,166" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4TwoStoreArrow)"/>
  <path d="M560,120 L560,146 L430,146 L430,166" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4TwoStoreArrow)"/>

  <rect x="250" y="170" width="260" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="380" y="196" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">connect() compares them</text>
  <text x="380" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every single time</text>

  <path d="M330,234 L330,246 L200,246 L200,258" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4TwoStoreArrow)"/>
  <path d="M430,234 L430,246 L560,246 L560,258" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4TwoStoreArrow)"/>

  <rect x="60" y="262" width="280" height="72" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="200" y="290" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">They agree</text>
  <text x="200" y="312" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm runs on your numbers</text>

  <rect x="420" y="262" width="280" height="72" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="560" y="286" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">They differ, or it is gone</text>
  <text x="560" y="306" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">LeRobot quietly re-calibrates</text>
  <text x="560" y="322" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a typo in --robot.id looks the same</text>

  <defs>
    <marker id="m4TwoStoreArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
