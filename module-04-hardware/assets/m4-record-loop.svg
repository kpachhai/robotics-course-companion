<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="The per-episode recording loop: reset the scene, demonstrate the task, then judge the episode. Keeping it with the right arrow or n and discarding it with the left arrow or r both return to the reset step, while escape or q ends the session and starts encoding">

  <rect x="24" y="110" width="150" height="70" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="99" y="140" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Reset the scene</text>
  <text x="99" y="159" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">object into its cell</text>

  <rect x="214" y="110" width="150" height="70" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="289" y="140" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Demonstrate</text>
  <text x="289" y="159" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same grasp, same timing</text>

  <rect x="404" y="110" width="150" height="70" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="479" y="140" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Judge it</text>
  <text x="479" y="159" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">decide before you forget</text>

  <rect x="594" y="44" width="142" height="58" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="665" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Keep</text>
  <text x="665" y="88" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">right arrow, or n</text>

  <rect x="594" y="188" width="142" height="58" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="665" y="214" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Discard</text>
  <text x="665" y="232" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">left arrow, or r</text>

  <rect x="404" y="212" width="150" height="52" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.4"/>
  <text x="479" y="234" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">End the session</text>
  <text x="479" y="252" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">escape or q, then encode</text>

  <line x1="174" y1="145" x2="210" y2="145"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L12RecArrow)"/>
  <line x1="364" y1="145" x2="400" y2="145"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L12RecArrow)"/>
  <path d="M554 132 L574 132 L574 73 L590 73" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L12RecArrow)"/>
  <path d="M554 158 L574 158 L574 217 L590 217" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L12RecArrow)"/>
  <line x1="479" y1="180" x2="479" y2="208"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L12RecArrow)"/>

  <path d="M665 44 L665 20 L99 20 L99 106" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L12RecArrow)"/>
  <path d="M665 246 L665 286 L99 286 L99 184" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L12RecArrow)"/>
  <text x="330" y="14" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the episode is written to disk</text>
  <text x="330" y="300" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the episode is thrown away, and costs you forty seconds</text>

  <defs>
    <marker id="m4L12RecArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
