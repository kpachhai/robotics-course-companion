<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-label="At each step the policy receives two camera images and six joint positions, and emits six joint targets; object pose, depth, contact force and camera pose are not part of the observation">
  <rect x="20" y="18" width="222" height="50" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="131" y="39" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Top camera</text>
  <text x="131" y="56" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">uint8 [480,640,3] · 30 Hz</text>

  <rect x="20" y="76" width="222" height="50" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="131" y="97" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Wrist camera</text>
  <text x="131" y="114" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">uint8 [480,640,3] · 30 Hz</text>

  <rect x="20" y="134" width="222" height="50" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="131" y="155" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Joint positions</text>
  <text x="131" y="172" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">float ×6 · degrees, gripper 0-100</text>

  <rect x="20" y="192" width="222" height="60" rx="8" stroke-dasharray="4 4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="131" y="213" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">Not in the observation</text>
  <text x="131" y="230" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">object pose · depth · contact force</text>
  <text x="131" y="243" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">where the camera is</text>

  <line x1="242" y1="43" x2="300" y2="82" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4ObsArrow)"/>
  <line x1="242" y1="101" x2="300" y2="116" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4ObsArrow)"/>
  <line x1="242" y1="159" x2="300" y2="150" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4ObsArrow)"/>

  <rect x="306" y="44" width="176" height="148" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="394" y="106" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--purple, #5e2d8c)">Policy</text>
  <text x="394" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nothing inside here</text>
  <text x="394" y="142" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">is measured in metres</text>

  <line x1="482" y1="118" x2="540" y2="118" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4ObsArrow)"/>

  <rect x="546" y="88" width="194" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="643" y="114" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Six joint targets</text>
  <text x="643" y="132" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">what the follower is told</text>

  <defs>
    <marker id="m4ObsArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
