<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-label="Three nested boxes. Innermost, each servo closes its own loop between goal and encoder. Around it, the host program copies six numbers each way and never sees the object, so it closes no loop at all. Only the outermost box, you, contains both the arm and the object, which is why you are the policy during teleoperation">

  <rect x="20" y="20" width="720" height="238" rx="8"
        fill="none" stroke="var(--green, #15614e)" stroke-width="1.8"/>
  <text x="40" y="46" class="svg-disp" font-size="14.5" font-weight="700"
        fill="var(--green, #15614e)">You</text>
  <text x="82" y="46" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the only box with both the arm and the object inside it</text>

  <rect x="56" y="70" width="410" height="140" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="261" y="94" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--muted, #6b6053)">the host program</text>

  <rect x="96" y="112" width="330" height="66" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="261" y="138" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="700"
        fill="var(--blue, #2d5d7c)">each servo</text>
  <text x="261" y="157" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">goal against encoder, closed inside the box</text>

  <text x="261" y="196" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reads six numbers, writes six numbers, never sees the object</text>

  <rect x="540" y="106" width="164" height="72" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="622" y="134" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="700"
        fill="var(--gold, #b07d22)">the object</text>
  <text x="622" y="153" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">moves only because you moved it</text>

  <path d="M622 178 L622 232 L120 232 L120 210" fill="none"
        stroke="var(--green, #15614e)" stroke-width="1.5" marker-end="url(#m4TeleopLoopArrow)"/>
  <text x="371" y="226" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you look at it, you decide, your hand corrects the leader</text>

  <text x="20" y="284" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Teleoperation adds no autonomy. Take yourself out and nothing here is watching the task.</text>

  <defs>
    <marker id="m4TeleopLoopArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--green, #15614e)"/>
    </marker>
  </defs>
</svg>
