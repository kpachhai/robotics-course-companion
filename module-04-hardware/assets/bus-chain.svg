<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-label="One control board and six motors on a single daisy-chained wire, with IDs one to six mapped to shoulder pan, shoulder lift, elbow flex, wrist flex, wrist roll and gripper">

  <text x="440" y="26" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">half duplex: one conductor, one talker at a time</text>
  <line x1="146" y1="40" x2="734" y2="40"
        stroke="var(--muted, #6b6053)" stroke-width="1.2"
        marker-start="url(#m4BusArrowLeft)" marker-end="url(#m4BusArrowRight)"/>

  <rect x="18" y="64" width="104" height="68" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="70" y="94" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">Board</text>
  <text x="70" y="114" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">USB to the host</text>

  <line x1="122" y1="98" x2="140" y2="98" stroke="var(--muted, #6b6053)" stroke-width="1.6"/>

  <rect x="140" y="64" width="90" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="185" y="96" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">1</text>
  <text x="185" y="116" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">shoulder_pan</text>

  <line x1="230" y1="98" x2="242" y2="98" stroke="var(--muted, #6b6053)" stroke-width="1.6"/>

  <rect x="242" y="64" width="90" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="287" y="96" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">2</text>
  <text x="287" y="116" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">shoulder_lift</text>

  <line x1="332" y1="98" x2="344" y2="98" stroke="var(--muted, #6b6053)" stroke-width="1.6"/>

  <rect x="344" y="64" width="90" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="389" y="96" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">3</text>
  <text x="389" y="116" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">elbow_flex</text>

  <line x1="434" y1="98" x2="446" y2="98" stroke="var(--muted, #6b6053)" stroke-width="1.6"/>

  <rect x="446" y="64" width="90" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="491" y="96" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">4</text>
  <text x="491" y="116" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">wrist_flex</text>

  <line x1="536" y1="98" x2="548" y2="98" stroke="var(--muted, #6b6053)" stroke-width="1.6"/>

  <rect x="548" y="64" width="90" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="593" y="96" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">5</text>
  <text x="593" y="116" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">wrist_roll</text>

  <line x1="638" y1="98" x2="650" y2="98" stroke="var(--muted, #6b6053)" stroke-width="1.6"/>

  <rect x="650" y="64" width="90" height="68" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="695" y="96" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--green, #15614e)">6</text>
  <text x="695" y="116" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">gripper</text>

  <text x="440" y="160" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">1,000,000 baud - protocol 0 - 4096 encoder counts per turn</text>
  <text x="695" y="152" text-anchor="middle" class="svg-mono" font-size="9"
        fill="var(--muted, #6b6053)">reports 0-100</text>

  <defs>
    <marker id="m4BusArrowRight" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m4BusArrowLeft" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
