<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Two registers inside one motor: Goal_Position which you write, Present_Position which you read, and the motor's own proportional-derivative loop between them, with the residual gap caused by deadband, friction, backlash and gravity">

  <rect x="50" y="56" width="200" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="150" y="86" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Goal_Position</text>
  <text x="150" y="108" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">register 42</text>
  <text x="150" y="124" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you write this</text>

  <rect x="290" y="56" width="180" height="76" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="380" y="86" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">The inner loop</text>
  <text x="380" y="108" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">P = 16 · I = 0 · D = 32</text>
  <text x="380" y="124" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">runs inside the motor</text>

  <rect x="510" y="56" width="200" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="610" y="86" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Present_Position</text>
  <text x="610" y="108" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">register 56</text>
  <text x="610" y="124" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you read this</text>

  <line x1="252" y1="94" x2="286" y2="94"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4GoalArrow)"/>
  <line x1="472" y1="94" x2="506" y2="94"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4GoalArrow)"/>

  <path d="M150,132 L150,158 L610,158 L610,132" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="380" y1="158" x2="380" y2="184"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4GoalArrow)"/>

  <rect x="210" y="188" width="340" height="72" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="380" y="214" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">the two never quite match</text>
  <text x="380" y="234" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">deadband · friction · backlash · gravity</text>
  <text x="380" y="250" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and no integral term to mop up the rest</text>

  <defs>
    <marker id="m4GoalArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
