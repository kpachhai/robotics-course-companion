<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 316" role="img" aria-label="Five artifacts that make a hardware result auditable, each paired with the reader question it answers: the dataset, the checkpoint, the evaluation protocol, the uncut video, and the failure reel">
  <rect x="30" y="24" width="300" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="180" y="45" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Dataset</text>
  <text x="180" y="61" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">on the Hub, episode count stated</text>
  <line x1="330" y1="47" x2="366" y2="47" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4ArtifactArrow)"/>
  <rect x="368" y="24" width="342" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="539" y="52" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--gold, #b07d22)">"Could I collect this myself?"</text>

  <rect x="30" y="82" width="300" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="180" y="103" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Checkpoint</text>
  <text x="180" y="119" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">weights, config, library version pinned</text>
  <line x1="330" y1="105" x2="366" y2="105" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4ArtifactArrow)"/>
  <rect x="368" y="82" width="342" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="539" y="110" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--gold, #b07d22)">"Could I run your policy?"</text>

  <rect x="30" y="140" width="300" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="180" y="161" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Evaluation protocol</text>
  <text x="180" y="177" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">conditions, criterion, trial count, voids</text>
  <line x1="330" y1="163" x2="366" y2="163" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4ArtifactArrow)"/>
  <rect x="368" y="140" width="342" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="539" y="168" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--gold, #b07d22)">"What exactly did you measure?"</text>

  <rect x="30" y="198" width="300" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="180" y="219" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Uncut video</text>
  <text x="180" y="235" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every trial, in order, real time</text>
  <line x1="330" y1="221" x2="366" y2="221" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4ArtifactArrow)"/>
  <rect x="368" y="198" width="342" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="539" y="226" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--gold, #b07d22)">"Is the number real?"</text>

  <rect x="30" y="256" width="300" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="180" y="277" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Failure reel</text>
  <text x="180" y="293" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the trials that did not work, tagged</text>
  <line x1="330" y1="279" x2="366" y2="279" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4ArtifactArrow)"/>
  <rect x="368" y="256" width="342" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="539" y="284" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--gold, #b07d22)">"Where does it break?"</text>

  <defs>
    <marker id="m4ArtifactArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
