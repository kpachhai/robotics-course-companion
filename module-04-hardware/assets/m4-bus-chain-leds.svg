<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Six motors daisy-chained from the control board: the first four show a steady lit LED and answer, the last two are dark, which localises the fault to the cable between motor four and motor five">

  <rect x="40" y="80" width="110" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="106" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Board</text>
  <text x="95" y="124" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">USB in</text>

  <line x1="150" y1="108" x2="180" y2="108" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <rect x="180" y="80" width="72" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="216" y="113" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">id 1</text>
  <line x1="252" y1="108" x2="264" y2="108" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <rect x="264" y="80" width="72" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="300" y="113" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">id 2</text>
  <line x1="336" y1="108" x2="348" y2="108" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <rect x="348" y="80" width="72" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="384" y="113" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">id 3</text>
  <line x1="420" y1="108" x2="432" y2="108" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <rect x="432" y="80" width="72" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="468" y="113" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">id 4</text>

  <line x1="504" y1="108" x2="516" y2="108" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" stroke-dasharray="3 3"/>
  <circle cx="510" cy="108" r="5" fill="var(--ox, #9c3b2e)"/>

  <rect x="516" y="80" width="72" height="56" rx="8"
        fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="552" y="113" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--ox, #9c3b2e)">id 5</text>
  <line x1="588" y1="108" x2="600" y2="108" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" stroke-dasharray="3 3"/>

  <rect x="600" y="80" width="72" height="56" rx="8"
        fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="636" y="113" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--ox, #9c3b2e)">id 6</text>

  <line x1="510" y1="113" x2="510" y2="166" stroke="var(--muted, #6b6053)"
        stroke-width="1.2" stroke-dasharray="4 4"/>

  <line x1="180" y1="170" x2="504" y2="170" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="180" y1="166" x2="180" y2="174" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="504" y1="166" x2="504" y2="174" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="342" y="190" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">steady red · these are answering</text>

  <line x1="516" y1="170" x2="672" y2="170" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="516" y1="166" x2="516" y2="174" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="672" y1="166" x2="672" y2="174" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="594" y="190" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">dark · the break is at this cable</text>

  <text x="40" y="62" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one chain, base to gripper</text>
</svg>
