<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Four things held fixed for the whole recording session - the lighting, the camera poses, the operator, and the grasp strategy - against the single thing allowed to vary, which is which cell the object starts in">

  <rect x="24" y="40" width="430" height="164" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="239" y="32" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">held fixed from the first episode to the last</text>

  <rect x="44" y="60" width="190" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="139" y="86" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the light</text>
  <text x="139" y="105" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">lamps on, blinds down</text>

  <rect x="244" y="60" width="190" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="339" y="86" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the cameras</text>
  <text x="339" y="105" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">taped, never nudged</text>

  <rect x="44" y="134" width="190" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="139" y="160" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the operator</text>
  <text x="139" y="179" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one pair of hands</text>

  <rect x="244" y="134" width="190" height="60" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="339" y="160" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the strategy</text>
  <text x="339" y="179" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one approach, one grasp</text>

  <line x1="458" y1="122" x2="496" y2="122"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L12ConstArrow)"/>

  <rect x="504" y="90" width="232" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="620" y="118" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">only the start cell varies</text>
  <text x="620" y="137" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">on a schedule you wrote down</text>

  <defs>
    <marker id="m4L12ConstArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
