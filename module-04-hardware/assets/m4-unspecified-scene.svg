<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="A one-sentence task description in the centre, with six arrows pointing outward to the things that sentence leaves unspecified: where the brick starts, how it is turned, what else is on the desk, where the bowl sits, what the light is doing, and who is driving the leader arm">

  <rect x="250" y="124" width="260" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="380" y="150" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">&#8220;put the red brick in the bowl&#8221;</text>
  <text x="380" y="168" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">goes into --dataset.single_task verbatim</text>

  <rect x="24" y="34" width="186" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="117" y="62" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">where the brick starts</text>

  <rect x="24" y="130" width="186" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="117" y="158" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">how the brick is turned</text>

  <rect x="24" y="226" width="186" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="117" y="254" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">what else is on the desk</text>

  <rect x="550" y="34" width="186" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="643" y="62" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">where the bowl sits</text>

  <rect x="550" y="130" width="186" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="643" y="158" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">what the light is doing</text>

  <rect x="550" y="226" width="186" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="643" y="254" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">who drives the leader</text>

  <line x1="252" y1="136" x2="214" y2="60"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L11UnspecArrow)"/>
  <line x1="246" y1="152" x2="214" y2="152"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L11UnspecArrow)"/>
  <line x1="252" y1="170" x2="214" y2="244"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L11UnspecArrow)"/>
  <line x1="508" y1="136" x2="546" y2="60"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L11UnspecArrow)"/>
  <line x1="514" y1="152" x2="546" y2="152"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L11UnspecArrow)"/>
  <line x1="508" y1="170" x2="546" y2="244"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L11UnspecArrow)"/>

  <defs>
    <marker id="m4L11UnspecArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
