<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="A constrained core recorded as one batch of episodes on the left, followed by four separate steps that each add one kind of variation: positions, then lighting, then objects, then operators, with a bracket marking that only one axis is relaxed at a time">

  <rect x="24" y="88" width="186" height="100" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="117" y="118" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">The constrained core</text>
  <text x="117" y="139" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one object, one start cell</text>
  <text x="117" y="154" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one camera pose, one operator</text>
  <text x="117" y="169" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">your first batch of episodes</text>

  <rect x="234" y="103" width="114" height="70" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="291" y="134" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">Add positions</text>
  <text x="291" y="153" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">more start cells</text>

  <rect x="362" y="103" width="114" height="70" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="419" y="134" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">Add lighting</text>
  <text x="419" y="153" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a second lamp setting</text>

  <rect x="490" y="103" width="114" height="70" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="547" y="134" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">Add objects</text>
  <text x="547" y="153" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a second brick shape</text>

  <rect x="618" y="103" width="114" height="70" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="675" y="134" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">Add operators</text>
  <text x="675" y="153" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a second pair of hands</text>

  <line x1="210" y1="138" x2="230" y2="138"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L11LadderArrow)"/>
  <line x1="348" y1="138" x2="358" y2="138"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L11LadderArrow)"/>
  <line x1="476" y1="138" x2="486" y2="138"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L11LadderArrow)"/>
  <line x1="604" y1="138" x2="614" y2="138"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L11LadderArrow)"/>

  <path d="M234 90 L234 80 L732 80 L732 90" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="483" y="70" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one axis at a time, and never two in the same batch</text>

  <line x1="291" y1="173" x2="291" y2="192"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="291" y="207" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">re-run the twenty-trial evaluation after every step</text>

  <defs>
    <marker id="m4L11LadderArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
