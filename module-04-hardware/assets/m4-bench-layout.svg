<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="A top-down view of the bench: the follower arm base on the left, a taped six-cell start region for the object, a taped bowl as the target, a front camera whose position is marked on the desk, and a wrist camera that moves with the arm">

  <rect x="20" y="20" width="720" height="280" rx="8"
        fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>
  <text x="36" y="40" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the bench, seen from above</text>

  <circle cx="110" cy="160" r="30"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="110" y="165" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">arm</text>
  <text x="110" y="116" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">follower base, clamped</text>

  <rect x="210" y="90" width="230" height="140" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="325" y="82" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">start region, every cell reached by hand first</text>

  <rect x="222" y="100" width="64" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="254" y="133" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">A1</text>
  <rect x="296" y="100" width="64" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="328" y="133" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">A2</text>
  <rect x="370" y="100" width="64" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="402" y="133" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">A3</text>

  <rect x="222" y="166" width="64" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="254" y="199" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">B1</text>
  <rect x="296" y="166" width="64" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="328" y="199" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">B2</text>
  <rect x="370" y="166" width="64" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="402" y="199" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">B3</text>

  <circle cx="530" cy="160" r="36"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.5"/>
  <text x="530" y="165" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">bowl</text>
  <text x="530" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">outline taped to the desk</text>

  <rect x="600" y="46" width="130" height="48" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="665" y="70" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">front camera</text>
  <text x="665" y="86" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">feet outlined in tape</text>
  <line x1="640" y1="94" x2="420" y2="140"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"/>

  <rect x="56" y="242" width="150" height="48" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="131" y="266" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">wrist camera</text>
  <text x="131" y="282" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">travels with the arm</text>
  <line x1="118" y1="242" x2="110" y2="192"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <text x="470" y="272" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nothing else on the desk, and nothing moves between recording and evaluation</text>
</svg>
