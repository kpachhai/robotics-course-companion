<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 288" role="img" aria-label="How one rollout becomes one recorded outcome: if the rig broke or you intervened it is a void and must be reported as one, otherwise it is a success if the written criterion was met inside the time limit and a tagged failure if it was not">
  <rect x="280" y="14" width="180" height="42" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="370" y="40" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">one rollout</text>

  <line x1="370" y1="56" x2="370" y2="78" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4TrialArrow)"/>

  <rect x="250" y="80" width="240" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="370" y="104" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">Did the rig break, or did</text>
  <text x="370" y="122" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">you touch anything?</text>

  <line x1="490" y1="108" x2="536" y2="108" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4TrialArrow)"/>
  <text x="513" y="100" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">yes</text>
  <rect x="538" y="86" width="180" height="44" rx="8" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="628" y="105" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--muted, #6b6053)">VOID</text>
  <text x="628" y="121" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">counted, and published as one</text>

  <line x1="370" y1="136" x2="370" y2="160" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4TrialArrow)"/>
  <text x="384" y="152" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no</text>

  <rect x="250" y="162" width="240" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="370" y="186" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">Was the written criterion</text>
  <text x="370" y="204" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">met inside the time limit?</text>

  <line x1="250" y1="190" x2="204" y2="190" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4TrialArrow)"/>
  <text x="227" y="182" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">yes</text>
  <rect x="22" y="168" width="180" height="44" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="112" y="187" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--green, #15614e)">SUCCESS</text>
  <text x="112" y="203" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no partial credit</text>

  <line x1="370" y1="218" x2="370" y2="238" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4TrialArrow)"/>
  <text x="384" y="232" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no</text>
  <rect x="280" y="240" width="180" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="370" y="259" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--ox, #9c3b2e)">FAILURE</text>
  <text x="370" y="275" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">tagged now, not from memory later</text>

  <defs>
    <marker id="m4TrialArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
