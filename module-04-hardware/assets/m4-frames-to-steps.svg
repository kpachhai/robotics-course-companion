<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="The arithmetic that turns a recording session into a training length: episodes times frames per second times seconds gives total frames, dividing by the batch size gives steps per epoch, and multiplying by five to ten epochs gives the total number of training steps">

  <rect x="24" y="76" width="170" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="109" y="106" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">your session</text>
  <text x="109" y="125" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">episodes, fps, seconds</text>

  <rect x="224" y="76" width="150" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="299" y="106" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">frames</text>
  <text x="299" y="125" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the size of the dataset</text>

  <rect x="404" y="76" width="170" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="489" y="106" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">steps per epoch</text>
  <text x="489" y="125" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one pass over the data</text>

  <rect x="604" y="76" width="132" height="76" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="670" y="106" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">total steps</text>
  <text x="670" y="125" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">passed to --steps</text>

  <line x1="194" y1="114" x2="220" y2="114"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L13ArithArrow)"/>
  <line x1="374" y1="114" x2="400" y2="114"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L13ArithArrow)"/>
  <line x1="574" y1="114" x2="600" y2="114"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4L13ArithArrow)"/>

  <text x="207" y="64" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">multiply</text>
  <text x="387" y="64" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">divide by batch</text>
  <text x="587" y="64" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">times 5 to 10</text>

  <line x1="380" y1="152" x2="380" y2="172"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="380" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50 episodes at 30 fps for 30 s is 45,000 frames; at batch 8 that is 5,625 per epoch</text>

  <defs>
    <marker id="m4L13ArithArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
