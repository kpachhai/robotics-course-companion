<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Stopping the arm is not the same as holding it: Ctrl+C or pulling the plug disables torque, an unpowered servo has no holding force, and the arm falls onto whatever is underneath, so the fix is to park it low or support it by hand first">

  <rect x="30" y="40" width="160" height="92" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="110" y="70" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">You stop it</text>
  <text x="110" y="90" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Ctrl+C, or the plug</text>
  <text x="110" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">comes out</text>

  <rect x="215" y="40" width="160" height="92" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="295" y="70" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Torque goes off</text>
  <text x="295" y="90" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">disable_torque_on_</text>
  <text x="295" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">disconnect = True</text>

  <rect x="400" y="40" width="160" height="92" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="480" y="70" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Nothing holds it</text>
  <text x="480" y="90" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">an unpowered servo</text>
  <text x="480" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">has no holding torque</text>

  <rect x="585" y="40" width="160" height="92" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="665" y="70" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">It falls</text>
  <text x="665" y="90" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">onto whatever is</text>
  <text x="665" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">under the gripper</text>

  <line x1="192" y1="86" x2="211" y2="86"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4StopArrow)"/>
  <line x1="377" y1="86" x2="396" y2="86"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4StopArrow)"/>
  <line x1="562" y1="86" x2="581" y2="86"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4StopArrow)"/>

  <path d="M665,132 L665,152 L390,152 L390,172" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.2" stroke-dasharray="4 4"
        marker-end="url(#m4StopArrow)"/>

  <rect x="180" y="176" width="420" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="390" y="204" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Park it low before you stop it</text>
  <text x="390" y="224" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">or put a hand under the forearm first</text>

  <defs>
    <marker id="m4StopArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
