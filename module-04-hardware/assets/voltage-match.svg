<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="A 7.4 volt supply on a 7.4 volt servo build gives steady LEDs and a working arm, while a 12 volt supply on the same motors puts them into a blinking error state">

  <rect x="30" y="30" width="170" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="115" y="58" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">7.4 V supply</text>
  <text x="115" y="78" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the one in the parts list</text>

  <line x1="202" y1="62" x2="244" y2="62"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4VoltArrow)"/>

  <rect x="250" y="30" width="200" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="350" y="58" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">STS3215, 7.4 V build</text>
  <text x="350" y="78" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">all twelve motors</text>

  <line x1="452" y1="62" x2="494" y2="62"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4VoltArrow)"/>

  <rect x="500" y="30" width="230" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="615" y="58" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">Steady LEDs</text>
  <text x="615" y="78" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm answers</text>

  <rect x="30" y="140" width="170" height="64" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="115" y="168" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">12 V supply</text>
  <text x="115" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">for the other motor variant</text>

  <line x1="202" y1="172" x2="244" y2="172"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m4VoltArrowBad)"/>
  <line x1="215" y1="164" x2="231" y2="180" stroke="var(--ox, #9c3b2e)" stroke-width="2"/>
  <line x1="215" y1="180" x2="231" y2="164" stroke="var(--ox, #9c3b2e)" stroke-width="2"/>

  <rect x="250" y="140" width="200" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="350" y="168" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">STS3215, 7.4 V build</text>
  <text x="350" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the same motors</text>

  <line x1="452" y1="172" x2="494" y2="172"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m4VoltArrowBad)"/>

  <rect x="500" y="140" width="230" height="64" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="615" y="168" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">Blinking LEDs</text>
  <text x="615" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">error state, motors at risk</text>

  <line x1="350" y1="206" x2="350" y2="222"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="350" y="238" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">on the SO-101 the leader is always the 7.4 V build</text>

  <defs>
    <marker id="m4VoltArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m4VoltArrowBad" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
