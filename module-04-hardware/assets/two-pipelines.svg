<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="The classical pipeline turns pixels into an object pose, then needs the base-to-camera transform before inverse kinematics can run. The imitation pipeline maps images and joint positions straight to joint targets and forms no transform at all">
  <text x="30" y="26" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Classical: detect, then plan</text>

  <rect x="30" y="44" width="118" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="89" y="68" text-anchor="middle" class="svg-disp" font-size="12" font-weight="700"
        fill="var(--blue, #2d5d7c)">Pixels</text>
  <text x="89" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one camera frame</text>

  <line x1="148" y1="70" x2="166" y2="70" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4PipeArrow)"/>

  <rect x="170" y="44" width="118" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="229" y="68" text-anchor="middle" class="svg-disp" font-size="12" font-weight="700"
        fill="var(--blue, #2d5d7c)">Detector</text>
  <text x="229" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">plus depth</text>

  <line x1="288" y1="70" x2="306" y2="70" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4PipeArrow)"/>

  <rect x="310" y="44" width="118" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="369" y="68" text-anchor="middle" class="svg-disp" font-size="12" font-weight="700"
        fill="var(--blue, #2d5d7c)">Object pose</text>
  <text x="369" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">in camera frame</text>

  <line x1="428" y1="70" x2="446" y2="70" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4PipeArrow)"/>

  <rect x="450" y="44" width="118" height="52" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="509" y="68" text-anchor="middle" class="svg-disp" font-size="12" font-weight="700"
        fill="var(--gold, #b07d22)">base ← camera</text>
  <text x="509" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">hand-eye calibration</text>

  <line x1="568" y1="70" x2="586" y2="70" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4PipeArrow)"/>

  <rect x="590" y="44" width="118" height="52" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="649" y="68" text-anchor="middle" class="svg-disp" font-size="12" font-weight="700"
        fill="var(--green, #15614e)">IK targets</text>
  <text x="649" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">joint angles</text>

  <text x="30" y="138" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Imitation: pixels straight to targets</text>

  <rect x="30" y="156" width="170" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="115" y="180" text-anchor="middle" class="svg-disp" font-size="12" font-weight="700"
        fill="var(--blue, #2d5d7c)">Images + joint positions</text>
  <text x="115" y="196" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">exactly what you recorded</text>

  <line x1="200" y1="182" x2="246" y2="182" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4PipeArrow)"/>

  <rect x="250" y="156" width="170" height="52" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="335" y="188" text-anchor="middle" class="svg-disp" font-size="12" font-weight="700"
        fill="var(--gold, #b07d22)">Policy weights</text>

  <line x1="420" y1="182" x2="466" y2="182" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4PipeArrow)"/>

  <rect x="470" y="156" width="170" height="52" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="555" y="188" text-anchor="middle" class="svg-disp" font-size="12" font-weight="700"
        fill="var(--green, #15614e)">Joint targets</text>

  <text x="335" y="226" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the transform is folded in here, and you cannot read it out</text>

  <defs>
    <marker id="m4PipeArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
