<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 316" role="img" aria-label="Five layers of the hardware stack, each paired with the single probe that isolates it: wiring and power tested by the motor LEDs, calibration tested by teleoperation, cameras tested by the find-cameras preview, data tested by replaying a recorded episode, and the policy tested by a rollout">
  <rect x="30" y="24" width="380" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="220" y="45" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">1. Wiring and power</text>
  <text x="220" y="61" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">bus continuity, supply voltage, connectors seated</text>
  <line x1="410" y1="47" x2="446" y2="47" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4ProbeArrow)"/>
  <rect x="448" y="24" width="262" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="579" y="45" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--gold, #b07d22)">look at the LEDs</text>
  <text x="579" y="61" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">steady red all the way to the base</text>

  <rect x="30" y="82" width="380" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="220" y="103" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">2. Calibration</text>
  <text x="220" y="119" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">homing offsets and joint ranges, per arm id</text>
  <line x1="410" y1="105" x2="446" y2="105" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4ProbeArrow)"/>
  <rect x="448" y="82" width="262" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="579" y="103" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--gold, #b07d22)">teleoperate</text>
  <text x="579" y="119" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">follower pose matches leader pose</text>

  <rect x="30" y="140" width="380" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="220" y="161" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">3. Cameras</text>
  <text x="220" y="177" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">index, resolution, pose, lighting</text>
  <line x1="410" y1="163" x2="446" y2="163" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4ProbeArrow)"/>
  <rect x="448" y="140" width="262" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="579" y="161" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--gold, #b07d22)">look at the frames</text>
  <text x="579" y="177" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">could you do the task from this view?</text>

  <rect x="30" y="198" width="380" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="220" y="219" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">4. Data</text>
  <text x="220" y="235" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">episodes, coverage, demonstration quality</text>
  <line x1="410" y1="221" x2="446" y2="221" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4ProbeArrow)"/>
  <rect x="448" y="198" width="262" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="579" y="219" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--gold, #b07d22)">replay an episode</text>
  <text x="579" y="235" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the recording round-trips on the arm</text>

  <rect x="30" y="256" width="380" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="220" y="277" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">5. Policy</text>
  <text x="220" y="293" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">weights, training length, action chunking</text>
  <line x1="410" y1="279" x2="446" y2="279" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#m4ProbeArrow)"/>
  <rect x="448" y="256" width="262" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="579" y="277" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--gold, #b07d22)">roll it out</text>
  <text x="579" y="293" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">only meaningful once 1 to 4 pass</text>

  <path d="M18 30 V296" fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m4ProbeArrow)"/>
  <text x="14" y="24" text-anchor="start" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">check in this order</text>

  <defs>
    <marker id="m4ProbeArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
