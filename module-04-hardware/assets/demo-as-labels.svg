<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="One thirty-second episode recorded at thirty frames a second becomes nine hundred training rows. Each row pairs the camera images and joint angles at that instant with the action that followed. A two-second hesitation in the middle contributes sixty rows whose correct answer is: do not move">

  <text x="24" y="22" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one episode · 30 seconds · 30 rows a second · 900 rows, each weighted the same</text>

  <rect x="24" y="36" width="712" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>

  <line x1="48" y1="36" x2="48" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="72" y1="36" x2="72" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="96" y1="36" x2="96" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="120" y1="36" x2="120" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="144" y1="36" x2="144" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="168" y1="36" x2="168" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="192" y1="36" x2="192" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="216" y1="36" x2="216" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="240" y1="36" x2="240" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="264" y1="36" x2="264" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="288" y1="36" x2="288" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="312" y1="36" x2="312" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="336" y1="36" x2="336" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="360" y1="36" x2="360" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>

  <rect x="384" y="36" width="72" height="52"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <line x1="396" y1="36" x2="396" y2="88" stroke="var(--ox, #9c3b2e)" stroke-width="0.7" opacity="0.55"/>
  <line x1="408" y1="36" x2="408" y2="88" stroke="var(--ox, #9c3b2e)" stroke-width="0.7" opacity="0.55"/>
  <line x1="420" y1="36" x2="420" y2="88" stroke="var(--ox, #9c3b2e)" stroke-width="0.7" opacity="0.55"/>
  <line x1="432" y1="36" x2="432" y2="88" stroke="var(--ox, #9c3b2e)" stroke-width="0.7" opacity="0.55"/>
  <line x1="444" y1="36" x2="444" y2="88" stroke="var(--ox, #9c3b2e)" stroke-width="0.7" opacity="0.55"/>

  <line x1="480" y1="36" x2="480" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="504" y1="36" x2="504" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="528" y1="36" x2="528" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="552" y1="36" x2="552" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="576" y1="36" x2="576" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="600" y1="36" x2="600" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="624" y1="36" x2="624" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="648" y1="36" x2="648" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="672" y1="36" x2="672" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="696" y1="36" x2="696" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>
  <line x1="720" y1="36" x2="720" y2="88" stroke="var(--blue, #2d5d7c)" stroke-width="0.7" opacity="0.55"/>

  <line x1="140" y1="88" x2="140" y2="118"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4DemoLabelArrow)"/>
  <rect x="24" y="122" width="272" height="72" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="160" y="146" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="700"
        fill="var(--blue, #2d5d7c)">one row of training data</text>
  <text x="160" y="165" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">in: two camera frames, six joint angles</text>
  <text x="160" y="179" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">out: the six angles your hand asked for next</text>

  <line x1="420" y1="88" x2="420" y2="118"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m4DemoLabelOxArrow)"/>
  <rect x="330" y="122" width="298" height="72" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="479" y="146" text-anchor="middle" class="svg-disp" font-size="13.5" font-weight="700"
        fill="var(--ox, #9c3b2e)">you paused here for two seconds</text>
  <text x="479" y="165" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">60 rows whose correct answer is: do not move,</text>
  <text x="479" y="179" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">taken in a situation that looks like every approach</text>

  <text x="24" y="224" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">There is no column for "I was thinking". There is no weight column either: your</text>
  <text x="24" y="238" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">best second and your worst second count for exactly the same during training.</text>

  <defs>
    <marker id="m4DemoLabelArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m4DemoLabelOxArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
