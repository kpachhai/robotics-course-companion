<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" role="img" aria-label="One pixel is a wedge leaving the lens: a 4 cm block at 35 cm, a 6 cm block at 52 cm and an 8 cm block at 70 cm all fill exactly the same pixel">
  <rect x="20" y="86" width="52" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="46" y="114" text-anchor="middle" class="svg-disp" font-size="12" font-weight="700"
        fill="var(--blue, #2d5d7c)">camera</text>

  <line x1="72" y1="109.3" x2="700" y2="73.4" stroke="var(--muted, #6b6053)" stroke-width="1.2"/>
  <line x1="72" y1="110.7" x2="700" y2="146.6" stroke="var(--muted, #6b6053)" stroke-width="1.2"/>

  <line x1="200" y1="40" x2="200" y2="180" stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <text x="200" y="32" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">image plane</text>

  <rect x="196" y="102" width="8" height="16" rx="2"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <line x1="244" y1="168" x2="206" y2="118" stroke="var(--muted, #6b6053)" stroke-width="1"/>
  <text x="262" y="172" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one pixel</text>

  <rect x="315" y="95" width="31" height="31" rx="3"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="330" y="158" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">4 cm at 35 cm</text>

  <rect x="442" y="87" width="46" height="46" rx="3"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="465" y="158" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">6 cm at 52 cm</text>

  <rect x="569" y="79" width="62" height="62" rx="3"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="600" y="158" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">8 cm at 70 cm</text>
</svg>
