<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Four build gates in order: printed-part accuracy, motor identity, orientation on assembly and cable slack, with everything after the identity gate marked as requiring disassembly to revisit">

  <rect x="20" y="30" width="152" height="96" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="96" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gate 1</text>
  <text x="96" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Print accuracy</text>
  <text x="96" y="96" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gauge before arm</text>
  <text x="96" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">skip: reprint both</text>

  <line x1="174" y1="78" x2="206" y2="78"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4GatesArrow)"/>

  <rect x="210" y="30" width="152" height="96" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="286" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gate 2</text>
  <text x="286" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Motor identity</text>
  <text x="286" y="96" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">ID before install</text>
  <text x="286" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">skip: disassemble</text>

  <line x1="364" y1="78" x2="396" y2="78"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4GatesArrow)"/>

  <rect x="400" y="30" width="152" height="96" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="476" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gate 3</text>
  <text x="476" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Orientation</text>
  <text x="476" y="96" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">horn as filmed</text>
  <text x="476" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">skip: lopsided range</text>

  <line x1="554" y1="78" x2="586" y2="78"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4GatesArrow)"/>

  <rect x="590" y="30" width="152" height="96" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="666" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gate 4</text>
  <text x="666" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Cable slack</text>
  <text x="666" y="96" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a loop per joint</text>
  <text x="666" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">skip: it unplugs itself</text>

  <line x1="400" y1="142" x2="400" y2="150"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.4"/>
  <line x1="742" y1="142" x2="742" y2="150"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.4"/>
  <line x1="400" y1="142" x2="742" y2="142"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="571" y="172" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">from here, reaching a motor means undoing joints</text>

  <defs>
    <marker id="m4GatesArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
