<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-label="Four stages that must quote the same calibration: calibrate, teleoperate, record and deploy, with a warning that changing the map at any point shifts every stage to the right of it">

  <rect x="40" y="60" width="150" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="115" y="86" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Calibrate</text>
  <text x="115" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you set the map</text>
  <text x="115" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">once, per arm</text>

  <rect x="215" y="60" width="150" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="290" y="86" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Teleoperate</text>
  <text x="290" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">leader and follower</text>
  <text x="290" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">share one map</text>

  <rect x="390" y="60" width="150" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="465" y="86" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Record</text>
  <text x="465" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every frame stamped</text>
  <text x="465" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">in these units</text>

  <rect x="565" y="60" width="150" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="640" y="86" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">Deploy</text>
  <text x="640" y="106" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the policy emits</text>
  <text x="640" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">these same units</text>

  <line x1="192" y1="98" x2="211" y2="98"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4AgreeArrow)"/>
  <line x1="367" y1="98" x2="386" y2="98"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4AgreeArrow)"/>
  <line x1="542" y1="98" x2="561" y2="98"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4AgreeArrow)"/>

  <line x1="290" y1="136" x2="290" y2="176" stroke="var(--muted, #6b6053)"
        stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="465" y1="136" x2="465" y2="176" stroke="var(--muted, #6b6053)"
        stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="640" y1="136" x2="640" y2="176" stroke="var(--muted, #6b6053)"
        stroke-width="1.2" stroke-dasharray="4 4"/>

  <rect x="215" y="180" width="500" height="76" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="465" y="208" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Re-map at any point and everything downstream moves</text>
  <text x="465" y="228" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same arm, same id, same file, from the first calibration to the last eval</text>
  <text x="465" y="244" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">re-calibrating after recording quietly re-labels the dataset</text>

  <defs>
    <marker id="m4AgreeArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
