<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="The learning rate schedule decays over thirty thousand steps by default, so a five thousand step run ends inside the shaded region at the very start of the decay, where the learning rate has barely moved">

  <rect x="60" y="52" width="110" height="128"
        fill="var(--ox-soft, #f1ddd6)" stroke="none"/>

  <line x1="60" y1="180" x2="720" y2="180"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>
  <line x1="60" y1="52" x2="60" y2="180"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>

  <line x1="60" y1="60" x2="720" y2="168"
        stroke="var(--blue, #2d5d7c)" stroke-width="2"/>

  <line x1="170" y1="180" x2="170" y2="46"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.4" stroke-dasharray="4 4"/>

  <text x="66" y="46" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">learning rate</text>
  <text x="178" y="40" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">a 5,000-step run ends here</text>
  <text x="178" y="56" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the rate has barely moved, so nothing ever anneals</text>

  <text x="60" y="198" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">step 0</text>
  <text x="720" y="198" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">step 30,000, the scheduler_decay_steps default</text>

  <text x="60" y="222" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the fix: set --policy.scheduler_decay_steps to whatever you passed to --steps</text>
</svg>
