<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Print the accuracy gauges, test the fit against a real servo, and only print the arm once the fit passes; a failed fit sends you back to the slicer settings and another gauge, never forward to the arm">

  <rect x="20" y="40" width="180" height="72" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="110" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Print the gauges</text>
  <text x="110" y="90" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Gauge_0 + Gauge_tight_1</text>

  <line x1="202" y1="76" x2="230" y2="76"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4GaugeArrow)"/>

  <rect x="236" y="40" width="200" height="72" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="336" y="66" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Test the fit</text>
  <text x="336" y="86" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">against a real STS3215,</text>
  <text x="336" y="100" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">or a 4x2 Lego brick</text>

  <line x1="438" y1="76" x2="474" y2="76"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m4GaugeArrow)"/>
  <text x="456" y="66" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">fits</text>

  <rect x="480" y="40" width="250" height="72" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="605" y="70" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Print the arm</text>
  <text x="605" y="90" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one pre-oriented file per arm</text>

  <line x1="336" y1="114" x2="336" y2="146"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m4GaugeArrowBad)"/>
  <text x="346" y="134" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">does not fit</text>

  <rect x="236" y="152" width="200" height="60" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="336" y="178" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Adjust the slicer</text>
  <text x="336" y="197" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one setting at a time</text>

  <path d="M 234,182 L 110,182 L 110,116" fill="none"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m4GaugeArrowBad)"/>

  <defs>
    <marker id="m4GaugeArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m4GaugeArrowBad" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
