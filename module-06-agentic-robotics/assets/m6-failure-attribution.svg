<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 244" role="img" aria-label="Failure attribution across three hundred and one failed long-horizon agent tasks: execution forty-six per cent, task planning twenty-eight per cent, memory twenty-six per cent">

  <text x="170" y="24" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">301 failed long-horizon tasks, attributed to one tier each</text>

  <text x="160" y="63" text-anchor="end" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Execution</text>
  <rect x="170" y="40" width="241" height="34" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="421" y="63" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">46.3%</text>
  <text x="170" y="90" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the skill was called correctly and did not do what it promised</text>

  <text x="160" y="129" text-anchor="end" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Task planning</text>
  <rect x="170" y="106" width="144" height="34" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="324" y="129" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">27.7%</text>
  <text x="170" y="156" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every step reported success and the goal was still not reached</text>

  <text x="160" y="195" text-anchor="end" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">Memory</text>
  <rect x="170" y="172" width="135" height="34" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="315" y="195" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">26.0%</text>
  <text x="170" y="222" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the agent forgot or misremembered what it had already done</text>
</svg>
