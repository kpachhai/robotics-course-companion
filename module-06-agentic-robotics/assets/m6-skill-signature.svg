<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 226" role="img" aria-label="A skill declaration with four annotated defences against a guessed argument: a closed set of surface names, the unit carried in the parameter name, bounds that turn an off-desk value into a validation error, and an explicitly stated coordinate frame">

  <rect x="24" y="32" width="380" height="170" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>

  <text x="40" y="58" class="svg-mono" font-size="10" fill="var(--muted, #6b6053)">"name": "place_on"</text>
  <text x="40" y="86" class="svg-mono" font-size="10" fill="var(--muted, #6b6053)">"surface": enum ["desk", "shelf", "tray"]</text>
  <text x="40" y="114" class="svg-mono" font-size="10" fill="var(--muted, #6b6053)">"offset_x_m": number</text>
  <text x="40" y="142" class="svg-mono" font-size="10" fill="var(--muted, #6b6053)">   minimum -0.15, maximum 0.15</text>
  <text x="40" y="170" class="svg-mono" font-size="10" fill="var(--muted, #6b6053)">"frame": enum ["surface"]</text>

  <line x1="410" y1="86" x2="440" y2="86"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6sigArrow)"/>
  <line x1="410" y1="114" x2="440" y2="114"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6sigArrow)"/>
  <line x1="410" y1="142" x2="440" y2="142"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6sigArrow)"/>
  <line x1="410" y1="170" x2="440" y2="170"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6sigArrow)"/>

  <text x="448" y="89" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">a closed set of names</text>
  <text x="448" y="117" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the unit lives in the name</text>
  <text x="448" y="145" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">off-desk fails validation</text>
  <text x="448" y="173" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the frame is stated, not guessed</text>

  <defs>
    <marker id="m6sigArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
