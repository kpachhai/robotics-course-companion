<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img" aria-label="Three gates a skill call passes through: the call returned, the motion completed, and the world changed as promised. A grasp that closed on air passes the first two, the third is never checked, and the skill reports success">

  <text x="24" y="44" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the run where the gripper closed on air</text>

  <rect x="24" y="56" width="214" height="88" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="131" y="88" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">the call returned</text>
  <text x="131" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no exception, no timeout</text>
  <text x="131" y="126" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and no information</text>

  <rect x="262" y="56" width="214" height="88" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="369" y="88" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">the motion completed</text>
  <text x="369" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">chunks emitted, controller settled</text>
  <text x="369" y="126" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">exactly as trained</text>

  <rect x="500" y="56" width="214" height="88" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="607" y="88" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">the world changed</text>
  <text x="607" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gripper width 2 mm: empty</text>
  <text x="607" y="126" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the gate most wrappers skip</text>

  <line x1="238" y1="100" x2="258" y2="100"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6threeGatesArrow)"/>
  <line x1="476" y1="100" x2="496" y2="100"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6threeGatesArrow)"/>

  <text x="131" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">passes</text>
  <text x="369" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">passes</text>
  <text x="607" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">never asked</text>

  <line x1="607" y1="170" x2="607" y2="190"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6threeGatesArrow)"/>

  <rect x="262" y="194" width="452" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="488" y="218" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">reported: success</text>
  <text x="488" y="238" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and the mug is still on the desk</text>

  <defs>
    <marker id="m6threeGatesArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
