<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 268" role="img" aria-label="The four fields of an honest failure report: what was attempted, what was measured, what the world looks like now, and what is still true, with the last field marked as the one that decides whether to retry or abandon the plan">

  <rect x="30" y="36" width="400" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="46" y="58" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">attempted</text>
  <text x="46" y="76" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pick(object_id="obj_3")</text>

  <rect x="30" y="92" width="400" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="46" y="114" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">measured</text>
  <text x="46" y="132" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gripper width 2 mm, empty below 3 mm</text>

  <rect x="30" y="148" width="400" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="46" y="170" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">world now</text>
  <text x="46" y="188" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gripper empty, arm at the pre-grasp pose</text>

  <rect x="30" y="204" width="400" height="48" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="46" y="226" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">what is still true</text>
  <text x="46" y="244" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">obj_3 detected, unmoved, still reachable</text>

  <line x1="434" y1="228" x2="460" y2="228"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6reportArrow)"/>
  <text x="468" y="222" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the field people leave out</text>
  <text x="468" y="238" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">it decides retry against abandon</text>

  <defs>
    <marker id="m6reportArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
