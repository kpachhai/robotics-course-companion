<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 256" role="img" aria-label="A chain of twenty skill calls each ninety-five per cent reliable, with the cumulative probability that the whole task succeeds falling from ninety-five per cent after one call to thirty-six per cent after twenty">

