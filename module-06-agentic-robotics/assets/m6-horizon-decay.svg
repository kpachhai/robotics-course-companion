  <text x="92" y="226" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">after 1</text>
  <text x="212" y="226" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">after 5</text>
  <text x="362" y="226" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">after 10</text>
  <text x="662" y="226" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">after 20</text>

  <text x="377" y="246" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">probability that every call so far has worked</text>
</svg>
