<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 268" role="img" aria-label="Two failure reports for the same failed grasp and the moves each one leaves open to the planner: a bare error status permits only an identical retry, while a report carrying the world state permits a regrasp, a different approach, or an informed handoff">

  <text x="184" y="24" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">a status</text>

  <rect x="24" y="38" width="320" height="86" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="44" y="72" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">{ "status": "error" }</text>
  <text x="44" y="98" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">true, and useless</text>

  <line x1="184" y1="124" x2="184" y2="150" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m6TwoReportsArrow)"/>

  <rect x="24" y="154" width="320" height="72" rx="8"
        fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <text x="44" y="178" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the planner's options:</text>
  <text x="44" y="200" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">· call the identical thing again</text>
  <text x="44" y="216" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">· fail the identical way</text>

  <line x1="370" y1="14" x2="370" y2="234" stroke="var(--line-2, #c8bca3)"
        stroke-width="1.2" stroke-dasharray="4 4"/>

  <text x="556" y="24" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">a postcondition</text>

  <rect x="396" y="38" width="320" height="86" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="414" y="60" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">{ "ok": false,</text>
  <text x="414" y="76" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">  "why": "gripper closed on nothing",</text>
  <text x="414" y="92" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">  "gripper": "empty",</text>
  <text x="414" y="108" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">  "mug_seen_at": [0.31, 0.10, 0.02] }</text>

  <line x1="556" y1="124" x2="556" y2="150" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#m6TwoReportsArrow)"/>

  <rect x="396" y="154" width="320" height="72" rx="8"
        fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <text x="414" y="178" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the planner's options:</text>
  <text x="414" y="200" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">· regrasp at the reported pose</text>
  <text x="414" y="216" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">· open wider · ask, with a reason</text>

  <text x="370" y="252" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">same failure, same policy, same hardware</text>

  <defs>
    <marker id="m6TwoReportsArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
