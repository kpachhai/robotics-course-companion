  <text x="34" y="247" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">planner call, about 1 s</text>
  <rect x="196" y="238" width="12" height="10" rx="2" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="214" y="247" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">robot moving</text>
