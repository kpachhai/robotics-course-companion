<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 272" role="img" aria-label="Ten runs scored two ways: a step-completion ladder that averages seventy-one per cent, and a binary clear-desk gate that passes twice, both computed from the same log">

  <text x="20" y="22" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">Scored by steps</text>
  <text x="20" y="38" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">bar height is the fraction of seven steps completed</text>

  <rect x="22" y="127" width="22" height="63" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="55" y="80" width="22" height="110" rx="4"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="88" y="111" width="22" height="79" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="121" y="143" width="22" height="47" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="154" y="96" width="22" height="94" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="187" y="111" width="22" height="79" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="220" y="80" width="22" height="110" rx="4"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="253" y="127" width="22" height="63" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="286" y="96" width="22" height="94" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="319" y="143" width="22" height="47" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>

  <line x1="18" y1="190" x2="348" y2="190" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>

  <text x="33" y="204" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">1</text>
  <text x="66" y="204" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">2</text>
  <text x="99" y="204" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">3</text>
  <text x="132" y="204" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">4</text>
  <text x="165" y="204" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">5</text>
  <text x="198" y="204" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">6</text>
  <text x="231" y="204" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">7</text>
  <text x="264" y="204" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">8</text>
  <text x="297" y="204" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">9</text>
  <text x="330" y="204" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">10</text>

  <text x="183" y="232" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">71% of steps completed</text>
  <text x="183" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the number that says you are nearly there</text>

  <line x1="370" y1="30" x2="370" y2="250" stroke="var(--line-2, #c8bca3)"
        stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="370" y="266" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same ten runs, same log file</text>

  <text x="392" y="22" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">Scored by desks</text>
  <text x="392" y="38" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">did the run end with a clear desk, judged from outside</text>

  <rect x="398" y="124" width="24" height="24" rx="4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <rect x="431" y="124" width="24" height="24" rx="4"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="464" y="124" width="24" height="24" rx="4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <rect x="497" y="124" width="24" height="24" rx="4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <rect x="530" y="124" width="24" height="24" rx="4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <rect x="563" y="124" width="24" height="24" rx="4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <rect x="596" y="124" width="24" height="24" rx="4"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="629" y="124" width="24" height="24" rx="4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <rect x="662" y="124" width="24" height="24" rx="4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <rect x="695" y="124" width="24" height="24" rx="4"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>

  <text x="410" y="164" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">1</text>
  <text x="443" y="164" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">2</text>
  <text x="476" y="164" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">3</text>
  <text x="509" y="164" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">4</text>
  <text x="542" y="164" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">5</text>
  <text x="575" y="164" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">6</text>
  <text x="608" y="164" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">7</text>
  <text x="641" y="164" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">8</text>
  <text x="674" y="164" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">9</text>
  <text x="707" y="164" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">10</text>

  <text x="558" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">runs 2 and 7 are the only ones that finished every step</text>

  <text x="558" y="232" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--green, #15614e)">2 desks out of 10</text>
  <text x="558" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the number a user would recognise</text>
</svg>
