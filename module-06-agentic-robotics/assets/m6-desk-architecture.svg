<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 276" role="img" aria-label="The milestone loop: an agent that reaches the desk only through a four-skill server and learns only from the results that come back, and an evaluator that reads the desk directly and is forbidden to the agent">

  <rect x="20" y="60" width="150" height="90" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="95" y="90" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--green, #15614e)">Agent</text>
  <text x="95" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">perceive · plan · call</text>
  <text x="95" y="126" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">read result · recover</text>

  <line x1="95" y1="150" x2="95" y2="166" stroke="var(--muted, #6b6053)" stroke-width="1.2"/>
  <text x="95" y="180" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">may not read</text>
  <text x="95" y="194" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the desk directly</text>

  <line x1="170" y1="92" x2="276" y2="92"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6deskArrow)"/>
  <text x="225" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">tools/call</text>
  <line x1="276" y1="122" x2="170" y2="122"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6deskArrow)"/>
  <text x="225" y="137" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">content · isError</text>

  <rect x="280" y="60" width="180" height="90" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="370" y="90" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--blue, #2d5d7c)">Skill server</text>
  <text x="370" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">look · pick · place · home</text>
  <text x="370" y="126" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">blocking · isError on failure</text>

  <line x1="460" y1="92" x2="556" y2="92"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6deskArrow)"/>
  <text x="508" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">commands</text>
  <line x1="556" y1="122" x2="460" y2="122"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6deskArrow)"/>
  <text x="508" y="137" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">outcomes</text>

  <rect x="560" y="60" width="160" height="90" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="640" y="90" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--gold, #b07d22)">Desk</text>
  <text x="640" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the ground truth</text>
  <text x="640" y="126" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">five objects, one gripper</text>

  <line x1="640" y1="150" x2="640" y2="186"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6deskArrow)"/>
  <text x="650" y="172" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">state</text>

  <rect x="530" y="190" width="190" height="70" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="625" y="216" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">Evaluator</text>
  <text x="625" y="236" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">goal_check reads the desk</text>
  <text x="625" y="252" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and never the transcript</text>

  <defs>
    <marker id="m6deskArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
