<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" role="img" aria-label="The planner loop drawn as four stages, perceive, plan, call one skill and monitor, with two return paths from monitor: one back to the next call when the step held, and one back to plan when the world disagrees">
  <text x="380" y="26" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">0.2 to 2 Hz · one pass round this loop costs a planner call, not a control cycle</text>

  <rect x="11" y="44" width="168" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="72" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Perceive</text>
  <text x="95" y="91" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one frame · joint state</text>

  <line x1="181" y1="76" x2="195" y2="76"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6PlannerStageArrow)"/>

  <rect x="201" y="44" width="168" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="285" y="72" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">Plan</text>
  <text x="285" y="91" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">two or three steps, no more</text>

  <line x1="371" y1="76" x2="385" y2="76"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6PlannerStageArrow)"/>

  <rect x="391" y="44" width="168" height="64" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="475" y="72" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">Call one skill</text>
  <text x="475" y="91" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">blocking · seconds of motion</text>

  <line x1="561" y1="76" x2="575" y2="76"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6PlannerStageArrow)"/>

  <rect x="581" y="44" width="168" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="665" y="72" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Monitor</text>
  <text x="665" y="91" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">did the postcondition hold?</text>

  <path d="M635 108 L635 152 L475 152 L475 112" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6PlannerStageArrow)"/>
  <text x="555" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the step held · take the next one</text>

  <path d="M695 108 L695 196 L285 196 L285 112" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6PlannerStageArrow)"/>
  <text x="490" y="190" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the world disagrees · look again, then replan</text>

  <defs>
    <marker id="m6PlannerStageArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
