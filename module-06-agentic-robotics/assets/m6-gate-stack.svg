<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-label="A plan passes down through a decision gate, a skill call and an action gate, all inside the region the model can reach, before reaching the actuator, while a hardware emergency stop sits outside that region and cuts power to the actuator directly">

  <text x="140" y="18" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">everything the model can reach</text>
  <rect x="140" y="26" width="420" height="286" rx="8" stroke-dasharray="5 4"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <rect x="220" y="46" width="260" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="350" y="72" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the plan</text>
  <text x="350" y="89" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">whatever the model decided</text>

  <rect x="220" y="114" width="260" height="52" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="350" y="140" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">decision gate</text>
  <text x="350" y="157" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">is this plan allowed at all?</text>

  <rect x="220" y="182" width="260" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="350" y="208" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">skill call</text>
  <text x="350" y="225" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">typed arguments</text>

  <rect x="220" y="250" width="260" height="52" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="350" y="276" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">action gate</text>
  <text x="350" y="293" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">are the numbers inside the limits?</text>

  <rect x="220" y="330" width="260" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="350" y="356" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the actuator</text>
  <text x="350" y="373" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">mass, speed, contact force</text>

  <rect x="20" y="330" width="120" height="52" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="80" y="356" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">e-stop</text>
  <text x="80" y="373" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">cuts power</text>

  <line x1="350" y1="98" x2="350" y2="110"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6gateArrow)"/>
  <line x1="350" y1="166" x2="350" y2="178"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6gateArrow)"/>
  <line x1="350" y1="234" x2="350" y2="246"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6gateArrow)"/>
  <line x1="350" y1="302" x2="350" y2="326"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6gateArrow)"/>
  <line x1="140" y1="356" x2="216" y2="356"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.4" marker-end="url(#m6stopArrow)"/>

  <defs>
    <marker id="m6gateArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="m6stopArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
