<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-label="Six recovery responses stacked from cheapest and narrowest at the top to most drastic at the bottom, each labelled with the assumption it makes: retry, re-perceive then retry, substitute a skill, observe then replan, ask the human, and stop and hold">

  <rect x="40" y="16" width="460" height="44" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="58" y="43" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Retry</text>
  <text x="484" y="44" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">assumes the failure was random</text>

  <rect x="40" y="68" width="460" height="44" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="58" y="95" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Re-perceive, then retry</text>
  <text x="484" y="96" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">assumes the belief went stale</text>

  <rect x="40" y="120" width="460" height="44" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="58" y="147" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Substitute a skill</text>
  <text x="484" y="148" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">assumes this approach is wrong here</text>

  <rect x="40" y="172" width="460" height="44" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="58" y="199" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Observe, then replan</text>
  <text x="484" y="200" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">assumes the plan was wrong</text>

  <rect x="40" y="224" width="460" height="44" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="58" y="251" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Ask the human</text>
  <text x="484" y="252" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">assumes no sensor can settle it</text>

  <rect x="40" y="276" width="460" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="58" y="303" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Stop and hold</text>
  <text x="484" y="304" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">assumes the next action is unsafe</text>

  <line x1="530" y1="22" x2="530" y2="312"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6ladderArrow)"/>
  <text x="546" y="36" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">cheap and narrow</text>
  <text x="546" y="308" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">costly and general</text>

  <defs>
    <marker id="m6ladderArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
