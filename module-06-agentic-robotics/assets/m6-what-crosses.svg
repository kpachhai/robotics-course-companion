<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="A boundary through a robot skill: the policy checkpoint, controller gains, solver and calibration stay hidden on one side, while only a name, a description, an input schema and an output schema cross to the planner on the other">

  <text x="296" y="22" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the boundary</text>
  <line x1="296" y1="32" x2="296" y2="272"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.3" stroke-dasharray="4 4"/>

  <rect x="20" y="48" width="250" height="200" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="145" y="76" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Inside the skill</text>
  <text x="145" y="102" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the policy checkpoint</text>
  <text x="145" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">controller gains and limits</text>
  <text x="145" y="142" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the IK solver</text>
  <text x="145" y="162" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">hand-eye calibration</text>
  <text x="145" y="182" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">retry, timeout, logging</text>
  <text x="145" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">none of it is visible</text>

  <rect x="330" y="40" width="196" height="46" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="344" y="62" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">name</text>
  <text x="344" y="78" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">how the planner finds it</text>

  <rect x="330" y="96" width="196" height="46" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="344" y="118" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">description</text>
  <text x="344" y="134" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">prompt text, sent every call</text>

  <rect x="330" y="152" width="196" height="46" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="344" y="174" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">inputSchema</text>
  <text x="344" y="190" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no units, no frames in it</text>

  <rect x="330" y="208" width="196" height="46" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="344" y="230" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">outputSchema</text>
  <text x="344" y="246" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">optional, and worth writing</text>

  <line x1="530" y1="63" x2="570" y2="63"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6crossArrow)"/>
  <line x1="530" y1="119" x2="570" y2="119"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6crossArrow)"/>
  <line x1="530" y1="175" x2="570" y2="175"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6crossArrow)"/>
  <line x1="530" y1="231" x2="570" y2="231"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6crossArrow)"/>

  <rect x="576" y="40" width="168" height="214" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="660" y="132" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--green, #15614e)">The planner</text>
  <text x="660" y="156" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">sees these four things</text>
  <text x="660" y="172" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and nothing else</text>

  <defs>
    <marker id="m6crossArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
