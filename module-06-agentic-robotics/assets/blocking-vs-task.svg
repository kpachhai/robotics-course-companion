<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 226" role="img" aria-label="The same long motion behind a blocking call and behind a task: when the client crashes and restarts, the blocking call leaves it with nothing to ask, while the durable task id can still be polled for the outcome">
  <rect x="9" y="26" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="50" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">call pick(cup)</text>
  <text x="95" y="67" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">blocking · one open request</text>

  <line x1="183" y1="53" x2="195" y2="53"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6TaskArrow)"/>

  <rect x="199" y="26" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="285" y="50" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">40 s of silence</text>
  <text x="285" y="67" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the handle is the connection</text>

  <line x1="373" y1="53" x2="385" y2="53"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6TaskArrow)"/>

  <rect x="389" y="26" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="475" y="50" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">the client dies</text>
  <text x="475" y="67" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and restarts a second later</text>

  <line x1="563" y1="53" x2="575" y2="53"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6TaskArrow)"/>

  <rect x="579" y="26" width="172" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="665" y="50" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">nothing to ask with</text>
  <text x="665" y="67" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">arm pose unknown</text>

  <rect x="9" y="132" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="156" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">call pick(cup)</text>
  <text x="95" y="173" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">returns a taskId at once</text>

  <line x1="183" y1="159" x2="195" y2="159"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6TaskArrow)"/>

  <rect x="199" y="132" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="285" y="156" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">status: working</text>
  <text x="285" y="173" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">durable before the reply</text>

  <line x1="373" y1="159" x2="385" y2="159"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6TaskArrow)"/>

  <rect x="389" y="132" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="475" y="156" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">the client dies</text>
  <text x="475" y="173" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the taskId outlives it</text>

  <line x1="563" y1="159" x2="575" y2="159"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6TaskArrow)"/>

  <rect x="579" y="132" width="172" height="54" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="665" y="156" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">poll it and find out</text>
  <text x="665" y="173" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">working · completed · failed</text>

  <text x="380" y="110" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">same motion, same crash · only one of them can ask what happened</text>

  <defs>
    <marker id="m6TaskArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
