<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 214" role="img" aria-label="Three ways a robot skill is declared to a planner, arranged from described in words to declared as symbols: a description plus a JSON schema, a library of primitives the model writes code against, and symbolic operators with explicit preconditions and effects, of which only the first two have shipped">

  <text x="370" y="20" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">three ways to tell a planner what a skill is</text>

  <rect x="70" y="38" width="190" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="165" y="64" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">a description</text>
  <text x="165" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">prose plus a JSON Schema</text>
  <text x="165" y="100" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the model reads and calls it</text>

  <rect x="275" y="38" width="190" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="370" y="64" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">a library</text>
  <text x="370" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">primitives, and the model</text>
  <text x="370" y="100" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">writes code that composes them</text>

  <rect x="480" y="38" width="190" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"
        stroke-dasharray="5 4"/>
  <text x="575" y="64" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">an operator</text>
  <text x="575" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">preconditions and effects,</text>
  <text x="575" y="100" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">checked before composing</text>

  <line x1="165" y1="114" x2="165" y2="146" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="370" y1="114" x2="370" y2="146" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <line x1="575" y1="114" x2="575" y2="146" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <line x1="70" y1="150" x2="670" y2="150" stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>

  <text x="70" y="170" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">said in words</text>
  <text x="670" y="170" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">said in symbols</text>

  <text x="165" y="196" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">shipped</text>
  <text x="370" y="196" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">shipped</text>
  <text x="575" y="196" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">research only</text>
</svg>
