<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 262" role="img" aria-label="Two tracks across four steps: the planner's belief about the tray position stays fixed while the true tray position shifts two centimetres during step two when the arm nudges it, and the gap is never observed, so the final place lands the pen beside the tray">

  <text x="18" y="86" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">what the planner</text>
  <text x="18" y="100" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">believes</text>

  <text x="18" y="206" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">what is actually</text>
  <text x="18" y="220" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">true</text>

  <text x="216" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">step 1 · plan</text>
  <text x="366" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">step 2 · place mug</text>
  <text x="516" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">step 3 · pick pen</text>
  <text x="666" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">step 4 · place pen</text>

  <rect x="152" y="68" width="128" height="48" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="216" y="97" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">tray at 0.42</text>

  <rect x="302" y="68" width="128" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="366" y="97" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">tray at 0.42</text>

  <rect x="452" y="68" width="128" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="516" y="97" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">tray at 0.42</text>

  <rect x="602" y="68" width="128" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="666" y="97" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">tray at 0.42</text>

  <rect x="152" y="182" width="128" height="60" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="216" y="207" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">tray at 0.42</text>
  <text x="216" y="225" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">as first observed</text>

  <rect x="302" y="182" width="128" height="60" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="366" y="207" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">tray at 0.40</text>
  <text x="366" y="225" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nudged by the elbow</text>

  <rect x="452" y="182" width="128" height="60" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="516" y="207" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">tray at 0.40</text>
  <text x="516" y="225" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">still unobserved</text>

  <rect x="602" y="182" width="128" height="60" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="666" y="207" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">tray at 0.40</text>
  <text x="666" y="225" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pen lands beside it</text>

  <line x1="216" y1="116" x2="216" y2="143" stroke="var(--green, #15614e)" stroke-width="1.3"/>
  <line x1="216" y1="162" x2="216" y2="182" stroke="var(--green, #15614e)" stroke-width="1.3"/>
  <text x="216" y="155" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">agree</text>

  <line x1="366" y1="116" x2="366" y2="137" stroke-dasharray="4 4"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <line x1="366" y1="169" x2="366" y2="182" stroke-dasharray="4 4"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <text x="366" y="149" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">2 cm apart,</text>
  <text x="366" y="162" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nobody looked</text>

  <line x1="516" y1="116" x2="516" y2="137" stroke-dasharray="4 4"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <line x1="516" y1="169" x2="516" y2="182" stroke-dasharray="4 4"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <text x="516" y="149" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every check</text>
  <text x="516" y="162" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">still passes</text>

  <line x1="666" y1="116" x2="666" y2="137" stroke-dasharray="4 4"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <line x1="666" y1="169" x2="666" y2="182" stroke-dasharray="4 4"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3"/>
  <text x="666" y="149" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the goal fails</text>
  <text x="666" y="162" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">here, not at 2</text>
</svg>
