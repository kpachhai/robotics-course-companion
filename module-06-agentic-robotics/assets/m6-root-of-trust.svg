<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-label="The untrusted task text reaches the planner but never reaches the safety model, which grounds fixed rules against the world model and emits a specification, and a resolver returns only the part of the plan that satisfies it">

  <rect x="16" y="32" width="150" height="58" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="91" y="58" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">the task</text>
  <text x="91" y="76" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">untrusted text</text>

  <rect x="226" y="32" width="160" height="58" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="306" y="58" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">planner</text>
  <text x="306" y="76" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reads the request</text>

  <rect x="16" y="176" width="150" height="76" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="91" y="202" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">safety model</text>
  <text x="91" y="220" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">fixed rules, grounded</text>
  <text x="91" y="234" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">against the world model</text>

  <line x1="91" y1="90" x2="91" y2="176" stroke-dasharray="5 4"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.4"/>
  <line x1="83" y1="125" x2="99" y2="141" stroke="var(--ox, #9c3b2e)" stroke-width="1.8"/>
  <line x1="99" y1="125" x2="83" y2="141" stroke="var(--ox, #9c3b2e)" stroke-width="1.8"/>
  <text x="108" y="137" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">never</text>

  <rect x="436" y="100" width="170" height="80" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="521" y="128" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">resolve</text>
  <text x="521" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">plan against spec</text>
  <text x="521" y="160" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">keep only what passes</text>

  <rect x="636" y="114" width="110" height="52" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="691" y="145" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">runs</text>

  <line x1="166" y1="61" x2="222" y2="61"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6rootArrow)"/>
  <line x1="386" y1="64" x2="432" y2="112"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6rootArrow)"/>
  <line x1="166" y1="210" x2="432" y2="166"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6rootArrow)"/>
  <line x1="606" y1="140" x2="632" y2="140"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6rootArrow)"/>

  <defs>
    <marker id="m6rootArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
