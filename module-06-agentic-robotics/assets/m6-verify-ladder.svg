<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 302" role="img" aria-label="Four ways to check a postcondition ordered from cheap to costly: gripper width, motor current or force, a detector on one frame, and a vision-language judgement, each paired with what it cannot see">

  <text x="70" y="30" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the check</text>
  <text x="444" y="30" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">blind to</text>

  <text x="44" y="34" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">cheap</text>
  <line x1="44" y1="44" x2="44" y2="272"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6verifyLadderArrow)"/>
  <text x="44" y="292" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">costly</text>

  <rect x="70" y="44" width="356" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="86" y="70" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">gripper width</text>
  <text x="86" y="88" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">about 1 ms, proprioception</text>
  <text x="444" y="70" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">what that something is</text>

  <rect x="70" y="104" width="356" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="86" y="130" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">motor current or force</text>
  <text x="86" y="148" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">about 1 ms, contact and load</text>
  <text x="444" y="130" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">position and identity</text>

  <rect x="70" y="164" width="356" height="52" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="86" y="190" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">a detector on one frame</text>
  <text x="86" y="208" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">tens of milliseconds</text>
  <text x="444" y="190" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">occlusion, a wrong label</text>

  <rect x="70" y="224" width="356" height="52" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="86" y="250" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">a vision-language judgement</text>
  <text x="86" y="268" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one planner round trip</text>
  <text x="444" y="250" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">its own mistakes</text>

  <defs>
    <marker id="m6verifyLadderArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
