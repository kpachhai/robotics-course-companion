<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 212" role="img" aria-label="The chain from a word to a pose: the mug becomes a detection, then a pixel with the vertical axis first, then a three-dimensional point using depth or a plane guess, then a pose in the robot base frame, with the error added at each step and no error raised anywhere along it">

  <rect x="14" y="44" width="136" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="82" y="72" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the mug</text>
  <text x="82" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a word in a request</text>

  <rect x="164" y="44" width="136" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="232" y="72" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">a detection</text>
  <text x="232" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">open-vocabulary</text>

  <rect x="314" y="44" width="136" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="382" y="72" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">a pixel</text>
  <text x="382" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">y first, 0-1000</text>

  <rect x="464" y="44" width="136" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="532" y="72" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">a 3D point</text>
  <text x="532" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">depth or a plane guess</text>

  <rect x="614" y="44" width="136" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="682" y="72" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">a pose in base</text>
  <text x="682" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">hand-eye transform</text>

  <line x1="150" y1="76" x2="162" y2="76"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6chainArrow)"/>
  <line x1="300" y1="76" x2="312" y2="76"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6chainArrow)"/>
  <line x1="450" y1="76" x2="462" y2="76"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6chainArrow)"/>
  <line x1="600" y1="76" x2="612" y2="76"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6chainArrow)"/>

  <line x1="232" y1="108" x2="232" y2="122" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="232" y="136" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">wrong object, or none</text>
  <line x1="382" y1="108" x2="382" y2="122" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="382" y="136" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">axis order transposed</text>
  <line x1="532" y1="108" x2="532" y2="122" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="532" y="136" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">depth noise, plane error</text>
  <line x1="682" y1="108" x2="682" y2="122" stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="682" y="136" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">calibration error</text>

  <rect x="14" y="152" width="736" height="44" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="382" y="180" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">no error is raised anywhere along this chain</text>

  <defs>
    <marker id="m6chainArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
