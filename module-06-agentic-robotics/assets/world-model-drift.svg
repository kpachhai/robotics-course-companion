<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Two tracks over four steps: what the planner believes and what is actually on the desk. They agree at the first step and diverge permanently after a call that nothing checked">
  <text x="9" y="32" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">what the planner believes</text>

  <rect x="9" y="42" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="66" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">cup on the desk</text>
  <text x="95" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">step 1 · look</text>

  <line x1="183" y1="69" x2="195" y2="69"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6DriftArrow)"/>

  <rect x="199" y="42" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="285" y="66" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">cup in the gripper</text>
  <text x="285" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">step 2 · pick returned</text>

  <line x1="373" y1="69" x2="385" y2="69"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6DriftArrow)"/>

  <rect x="389" y="42" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="475" y="66" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">cup in the tray</text>
  <text x="475" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">step 3 · place returned</text>

  <line x1="563" y1="69" x2="575" y2="69"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6DriftArrow)"/>

  <rect x="579" y="42" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="665" y="66" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">the desk is clear</text>
  <text x="665" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">step 4 · reports done</text>

  <text x="9" y="140" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">what is on the desk</text>

  <rect x="9" y="148" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="172" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">cup on the desk</text>
  <text x="95" y="189" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the two still agree</text>

  <line x1="183" y1="175" x2="195" y2="175"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6DriftArrow)"/>

  <rect x="199" y="148" width="172" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="285" y="172" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">cup on the floor</text>
  <text x="285" y="189" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the grasp slipped</text>

  <line x1="373" y1="175" x2="385" y2="175"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6DriftArrow)"/>

  <rect x="389" y="148" width="172" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="475" y="172" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">cup on the floor</text>
  <text x="475" y="189" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the gripper placed nothing</text>

  <line x1="563" y1="175" x2="575" y2="175"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6DriftArrow)"/>

  <rect x="579" y="148" width="172" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="665" y="172" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">cup on the floor</text>
  <text x="665" y="189" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and the run reports done</text>

  <line x1="285" y1="202" x2="285" y2="214"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="285" y="228" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the call nobody checked · every later decision inherits this</text>

  <defs>
    <marker id="m6DriftArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
