<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" role="img" aria-label="Two ways a detector fails without raising an exception: a spurious rejection, where a present object is not returned and the robot visibly stalls, and a confident misassociation, where the label lands on the wrong object and every later check still passes">

  <rect x="20" y="94" width="176" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="108" y="124" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">the detector</text>
  <text x="108" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">always returns something</text>
  <text x="108" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and never an exception</text>

  <line x1="200" y1="120" x2="244" y2="70"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6silentArrow)"/>
  <line x1="200" y1="144" x2="244" y2="194"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6silentArrow)"/>

  <rect x="250" y="26" width="224" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="362" y="56" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">spurious rejection</text>
  <text x="362" y="76" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the mug is there</text>
  <text x="362" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and is not returned</text>

  <rect x="250" y="162" width="224" height="76" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="362" y="192" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">confident misassociation</text>
  <text x="362" y="212" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the label lands on the pen</text>
  <text x="362" y="228" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">with a high score</text>

  <line x1="478" y1="64" x2="500" y2="64"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6silentArrow)"/>
  <line x1="478" y1="200" x2="500" y2="200"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6silentArrow)"/>

  <rect x="506" y="26" width="234" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="623" y="56" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">visible in seconds</text>
  <text x="623" y="76" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the robot stalls, or plans</text>
  <text x="623" y="92" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">around what it is looking at</text>

  <rect x="506" y="162" width="234" height="76" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="623" y="192" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">invisible to everything</text>
  <text x="623" y="212" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">sensible plan, wrong object</text>
  <text x="623" y="228" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every later check passes</text>

  <defs>
    <marker id="m6silentArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
