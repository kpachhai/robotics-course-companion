<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 676 240" role="img" aria-label="The same plan run two ways: grounding once at the start means the grasp uses a position measured four seconds earlier, while a second look immediately before the grasp means it uses a position measured six tenths of a second earlier">

  <text x="16" y="50" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">ground once</text>

  <rect x="16" y="62" width="42" height="36" rx="4"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <rect x="58" y="62" width="70" height="36" rx="4"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="128" y="62" width="140" height="36" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="268" y="62" width="70" height="36" rx="4"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="338" y="62" width="280" height="36" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>

  <text x="37" y="84" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">look</text>
  <text x="93" y="84" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">plan</text>
  <text x="198" y="84" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">home</text>
  <text x="303" y="84" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">plan</text>
  <text x="478" y="84" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">pick</text>

  <line x1="478" y1="98" x2="478" y2="112"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6twiceArrow)"/>
  <text x="478" y="126" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the grasp uses a position 4.0 s old</text>

  <text x="16" y="152" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">ground twice</text>

  <rect x="16" y="164" width="42" height="36" rx="4"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <rect x="58" y="164" width="70" height="36" rx="4"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="128" y="164" width="140" height="36" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <rect x="268" y="164" width="70" height="36" rx="4"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="338" y="164" width="42" height="36" rx="4"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <rect x="380" y="164" width="280" height="36" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>

  <text x="37" y="186" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">look</text>
  <text x="93" y="186" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">plan</text>
  <text x="198" y="186" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">home</text>
  <text x="303" y="186" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">plan</text>
  <text x="359" y="186" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">look</text>
  <text x="520" y="186" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">pick</text>

  <line x1="520" y1="200" x2="520" y2="214"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m6twiceArrow)"/>
  <text x="520" y="228" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the grasp uses a position 0.6 s old</text>

  <defs>
    <marker id="m6twiceArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
