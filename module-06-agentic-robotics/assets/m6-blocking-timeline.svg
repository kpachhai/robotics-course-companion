<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-label="Two timelines for the same single skill: a tool that returns immediately costs six model round trips and lets the next command arrive mid-motion, while a blocking tool costs two round trips and leaves the arm idle only while the next step is chosen">

  <text x="16" y="30" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">A tool that returns immediately</text>

  <text x="100" y="65" text-anchor="end" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">model</text>
  <text x="100" y="101" text-anchor="end" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">arm</text>

  <rect x="110" y="46" width="80" height="26" rx="6"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="150" y="63" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">plan</text>
  <rect x="190" y="46" width="80" height="26" rx="6"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="230" y="63" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">poll</text>
  <rect x="270" y="46" width="80" height="26" rx="6"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="310" y="63" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">poll</text>
  <rect x="350" y="46" width="80" height="26" rx="6"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="390" y="63" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">poll</text>
  <rect x="430" y="46" width="80" height="26" rx="6"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="470" y="63" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">poll</text>
  <rect x="510" y="46" width="80" height="26" rx="6"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="550" y="63" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">plan next</text>

  <rect x="190" y="82" width="400" height="26" rx="6"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="390" y="99" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">skill k is still moving</text>

  <line x1="510" y1="40" x2="510" y2="116" stroke="var(--ox, #9c3b2e)"
        stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="516" y="126" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">issued mid-motion</text>

  <text x="110" y="146" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">six model round trips to run one skill</text>

  <text x="16" y="168" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">A blocking tool</text>

  <text x="100" y="197" text-anchor="end" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">model</text>
  <text x="100" y="233" text-anchor="end" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">arm</text>

  <rect x="110" y="178" width="80" height="26" rx="6"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="150" y="195" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">plan</text>
  <rect x="190" y="178" width="400" height="26" rx="6"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="390" y="195" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the call has not returned yet</text>
  <rect x="590" y="178" width="80" height="26" rx="6"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="630" y="195" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">plan next</text>

  <rect x="190" y="214" width="400" height="26" rx="6"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="390" y="231" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">skill k moving</text>
  <rect x="590" y="214" width="80" height="26" rx="6"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="630" y="231" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">idle</text>
  <rect x="670" y="214" width="60" height="26" rx="6"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="700" y="231" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">skill k+1</text>

  <text x="110" y="262" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">two round trips, and the arm is idle only while the next step is chosen</text>
</svg>
