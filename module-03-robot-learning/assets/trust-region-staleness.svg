<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 254" role="img" aria-label="A batch collected by one policy stays informative only near that policy; the clipped objective stops paying for updates that leave the region, so the batch can be reused several times">
  <defs>
    <marker id="trustRegionArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="trustRegionBad" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>

  <ellipse cx="230" cy="128" rx="150" ry="82"
           fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)"
           stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="230" y="34" text-anchor="middle" class="svg-disp" font-size="14"
        font-weight="700" fill="var(--green, #15614e)">where this batch still says something true</text>

  <circle cx="150" cy="128" r="9" fill="var(--blue, #2d5d7c)"/>
  <text x="150" y="160" text-anchor="middle" class="svg-disp" font-size="13"
        font-weight="600" fill="var(--blue, #2d5d7c)">the policy that</text>
  <text x="150" y="176" text-anchor="middle" class="svg-disp" font-size="13"
        font-weight="600" fill="var(--blue, #2d5d7c)">collected the data</text>

  <line x1="159" y1="128" x2="292" y2="112" stroke="var(--muted, #6b6053)"
        stroke-width="1.6" marker-end="url(#trustRegionArrow)"/>
  <circle cx="300" cy="111" r="7" fill="var(--green, #15614e)"/>
  <text x="306" y="90" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">four cheap passes over the</text>
  <text x="306" y="104" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same batch land here: fine</text>

  <line x1="159" y1="132" x2="500" y2="196" stroke="var(--ox, #9c3b2e)"
        stroke-width="1.6" marker-end="url(#trustRegionBad)"/>
  <circle cx="508" cy="197" r="7" fill="var(--ox, #9c3b2e)"/>
  <text x="398" y="228" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the same four passes with no clip: the batch is now</text>
  <text x="398" y="242" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">describing a policy that no longer exists</text>

  <rect x="418" y="30" width="266" height="76" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="551" y="54" text-anchor="middle" class="svg-disp" font-size="14"
        font-weight="700" fill="var(--ox, #9c3b2e)">on-policy means perishable</text>
  <text x="551" y="74" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the data was generated by the policy,</text>
  <text x="551" y="88" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">so changing the policy expires the data</text>
</svg>
