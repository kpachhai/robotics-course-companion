<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="A policy drawn as a function: the observation on the left, six joint angles plus two camera frames plus the task sentence, feeding a single function in the middle, producing six target joint angles on the right, thirty times a second">

  <text x="16" y="28" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">what arrives</text>
  <rect x="16" y="38" width="252" height="132" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="32" y="62" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Observation</text>
  <text x="32" y="86" class="svg-mono" font-size="9.5" fill="var(--blue, #2d5d7c)">observation.state</text>
  <text x="32" y="100" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">6 joint angles, from the encoders</text>
  <text x="32" y="122" class="svg-mono" font-size="9.5" fill="var(--blue, #2d5d7c)">observation.images.up / .side</text>
  <text x="32" y="136" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">two 480 x 640 frames</text>
  <text x="32" y="158" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">task: "pink lego brick into the box"</text>

  <line x1="268" y1="104" x2="300" y2="104"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m3PolicyArrow)"/>

  <rect x="304" y="56" width="164" height="96" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="386" y="86" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--purple, #5e2d8c)">The policy</text>
  <text x="386" y="108" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one function</text>
  <text x="386" y="122" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no memory between calls</text>
  <text x="386" y="136" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the weights are the whole thing</text>

  <line x1="468" y1="104" x2="500" y2="104"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m3PolicyArrow)"/>

  <text x="504" y="28" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">what leaves</text>
  <rect x="504" y="38" width="240" height="132" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="520" y="62" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Action</text>
  <text x="520" y="86" class="svg-mono" font-size="9.5" fill="var(--gold, #b07d22)">6 target joint angles</text>
  <text x="520" y="100" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the same six the human sent</text>
  <text x="520" y="122" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">each servo then closes its own</text>
  <text x="520" y="136" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">position loop, far faster, inside</text>
  <text x="520" y="158" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the sealed box from Module 0</text>

  <path d="M624 170 L624 198 L516 198" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M244 198 L120 198 L120 172" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="5 4"
        marker-end="url(#m3PolicyArrow)"/>
  <text x="380" y="202" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the world moves, and the next observation arrives</text>

  <text x="380" y="228" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">Called 30 times a second. Every call gets 33 milliseconds and no memory of the last one.</text>

  <defs>
    <marker id="m3PolicyArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
