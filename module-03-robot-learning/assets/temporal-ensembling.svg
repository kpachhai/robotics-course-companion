<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 320" role="img" aria-label="Four action chunks predicted one timestep apart, drawn as overlapping horizontal bars. A vertical line at one timestep crosses all four, so four separate predictions exist for that single action. Temporal ensembling averages them, weighting the freshest prediction most, at the cost of one forward pass per timestep.">

  <text x="252" y="28" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">one timestep</text>
  <line x1="252" y1="36" x2="252" y2="216"
        stroke="var(--gold, #b07d22)" stroke-width="1.4" stroke-dasharray="4 4"/>

  <rect x="96" y="46" width="380" height="26" rx="6"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="20" y="64" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">query at t-3</text>

  <rect x="140" y="86" width="380" height="26" rx="6"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="20" y="104" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">query at t-2</text>

  <rect x="184" y="126" width="380" height="26" rx="6"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="20" y="144" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">query at t-1</text>

  <rect x="228" y="166" width="380" height="26" rx="6"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <text x="20" y="184" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">query at t</text>

  <g fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.5">
    <circle cx="252" cy="59" r="6"/>
    <circle cx="252" cy="99" r="6"/>
    <circle cx="252" cy="139" r="6"/>
    <circle cx="252" cy="179" r="6"/>
  </g>

  <text x="624" y="64" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">oldest, least weight</text>
  <text x="624" y="184" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">freshest, most weight</text>

  <line x1="252" y1="216" x2="252" y2="238"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#tempEnsDown)"/>

  <rect x="140" y="242" width="224" height="44" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="252" y="261" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">weighted average</text>
  <text x="252" y="278" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the action actually sent</text>

  <text x="392" y="268" class="svg-mono" font-size="9.5"
        fill="var(--ox, #9c3b2e)">4 predictions here means 4 forward passes per step</text>

  <defs>
    <marker id="tempEnsDown" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
