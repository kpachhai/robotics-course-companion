<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-label="A matched-budget comparison: one demonstration set feeds three policy heads trained with identical steps and batch size, each rolled out on the same start states, and reported as a success rate with a confidence interval">

  <rect x="20" y="112" width="136" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="88" y="142" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">one dataset</text>
  <text x="88" y="162" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50 demonstrations,</text>
  <text x="88" y="175" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">both routes</text>

  <path d="M 160 150 L 190 150 L 190 66 L 214 66" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#budgetArrow)"/>
  <line x1="160" y1="150" x2="214" y2="150"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#budgetArrow)"/>
  <path d="M 160 150 L 190 150 L 190 234 L 214 234" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#budgetArrow)"/>

  <rect x="222" y="40" width="150" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="297" y="62" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">regression head</text>
  <text x="297" y="80" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">mean squared error</text>

  <rect x="222" y="124" width="150" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="297" y="146" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">latent head</text>
  <text x="297" y="164" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the trick inside ACT</text>

  <rect x="222" y="208" width="150" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="297" y="230" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">diffusion head</text>
  <text x="297" y="248" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">100 denoising steps</text>

  <line x1="297" y1="264" x2="297" y2="278"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="297" y="290" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">identical steps, batch and seed. Only the head differs</text>

  <path d="M 376 66 L 400 66 L 400 150 L 424 150" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#budgetArrow)"/>
  <line x1="376" y1="150" x2="424" y2="150"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#budgetArrow)"/>
  <path d="M 376 234 L 400 234 L 400 150 L 424 150" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <rect x="432" y="112" width="140" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="502" y="142" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">200 rollouts</text>
  <text x="502" y="162" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the same start states</text>
  <text x="502" y="175" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">for every head</text>

  <line x1="576" y1="150" x2="612" y2="150"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#budgetArrow)"/>

  <rect x="620" y="112" width="112" height="76" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="676" y="142" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">a rate</text>
  <text x="676" y="162" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">with its 95%</text>
  <text x="676" y="175" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">interval attached</text>

  <defs>
    <marker id="budgetArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
