<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Splitting demonstration frames at random puts near-identical neighbouring frames on both sides of the train and test line, while splitting whole episodes keeps the held-out data genuinely unseen">

  <text x="20" y="30" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Split the frames</text>
  <text x="20" y="47" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">neighbouring frames land on both sides · the answer is already in the table</text>

  <rect x="20" y="58" width="720" height="42" rx="8"
        fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <circle cx="46"  cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="76"  cy="79" r="5.5" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <circle cx="106" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="136" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="166" cy="79" r="5.5" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <circle cx="196" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="226" cy="79" r="5.5" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <circle cx="256" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="286" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="316" cy="79" r="5.5" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <circle cx="346" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="376" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="406" cy="79" r="5.5" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <circle cx="436" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="466" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="496" cy="79" r="5.5" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <circle cx="526" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="556" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="586" cy="79" r="5.5" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <circle cx="616" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="646" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="676" cy="79" r="5.5" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <circle cx="706" cy="79" r="5.5" fill="var(--ox, #9c3b2e)"/>

  <text x="20" y="146" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Split the episodes</text>
  <text x="20" y="163" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">whole demonstrations held out · the policy has genuinely never seen them</text>

  <rect x="20" y="174" width="576" height="42" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="604" y="174" width="136" height="42" rx="8"
        fill="none" stroke="var(--green, #15614e)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="308" y="200" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">episodes 0-39, fitted</text>
  <text x="672" y="200" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">40-49, held out</text>

  <text x="20" y="240" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">filled = fitted   hollow = held out   ·   at 30 frames a second, two neighbouring frames are almost the same picture</text>
</svg>
