<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-label="Four separate reality gaps between simulator and robot, each with a different fix: appearance, dynamics, latency, and observation">
  <defs>
    <marker id="realityGapArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>

  <text x="24" y="26" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">what differs</text>
  <text x="396" y="26" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">what fixes it</text>

  <rect x="24" y="38" width="330" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="40" y="58" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Appearance</text>
  <text x="40" y="75" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">textures, lighting, shadows, camera pose and lens</text>
  <line x1="354" y1="61" x2="390" y2="61" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#realityGapArrow)"/>
  <rect x="396" y="38" width="340" height="46" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="412" y="58" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">randomise it, or scan the real scene in</text>
  <text x="412" y="75" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the best-understood gap, and the one image augmentation reaches</text>

  <rect x="24" y="92" width="330" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="40" y="112" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Dynamics</text>
  <text x="40" y="129" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">mass, inertia, friction, motor gains, torque limits</text>
  <line x1="354" y1="115" x2="390" y2="115" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#realityGapArrow)"/>
  <rect x="396" y="92" width="340" height="46" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="412" y="112" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">randomise it, and let the policy hedge</text>
  <text x="412" y="129" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">this is where zero-shot legged transfer became routine</text>

  <rect x="24" y="146" width="330" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="40" y="166" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Latency</text>
  <text x="40" y="183" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">sensing delay, bus round trips, actuator rise time</text>
  <line x1="354" y1="169" x2="390" y2="169" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#realityGapArrow)"/>
  <rect x="396" y="146" width="340" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="412" y="166" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">simulate the delay, or it is invisible</text>
  <text x="412" y="183" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a sim with zero delay teaches gains that oscillate on hardware</text>

  <rect x="24" y="200" width="330" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="40" y="220" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Contact</text>
  <text x="40" y="237" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">how a solver resolves a squeeze, a slip, a jam</text>
  <line x1="354" y1="223" x2="390" y2="223" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#realityGapArrow)"/>
  <rect x="396" y="200" width="340" height="46" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="412" y="220" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">still open, and it is why manipulation lags</text>
  <text x="412" y="237" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">randomising a wrong contact model gives a family of wrong models</text>
</svg>
