<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img" aria-label="Two demonstration sets of the same size: on the left every episode starts with the brick in almost the same place, on the right the starting positions are spread across the whole mat. Same number of frames, very different coverage">

  <text x="30" y="30" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Fifty times the same episode</text>
  <rect x="30" y="42" width="330" height="176" rx="8"
        fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>
  <g fill="var(--ox, #9c3b2e)">
    <circle cx="188" cy="128" r="4"/><circle cx="201" cy="131" r="4"/>
    <circle cx="194" cy="140" r="4"/><circle cx="206" cy="136" r="4"/>
    <circle cx="183" cy="137" r="4"/><circle cx="197" cy="122" r="4"/>
    <circle cx="190" cy="146" r="4"/><circle cx="203" cy="145" r="4"/>
    <circle cx="209" cy="127" r="4"/><circle cx="186" cy="120" r="4"/>
    <circle cx="199" cy="150" r="4"/><circle cx="180" cy="131" r="4"/>
    <circle cx="207" cy="150" r="4"/><circle cx="192" cy="116" r="4"/>
    <circle cx="211" cy="140" r="4"/><circle cx="177" cy="142" r="4"/>
    <circle cx="196" cy="134" r="4"/><circle cx="185" cy="148" r="4"/>
    <circle cx="204" cy="120" r="4"/><circle cx="214" cy="133" r="4"/>
    <circle cx="181" cy="125" r="4"/><circle cx="200" cy="141" r="4"/>
    <circle cx="191" cy="157" r="4"/><circle cx="206" cy="112" r="4"/>
  </g>
  <text x="195" y="240" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50 episodes · 12,000 frames · one starting position</text>

  <text x="400" y="30" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Fifty different episodes</text>
  <rect x="400" y="42" width="330" height="176" rx="8"
        fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>
  <g fill="var(--blue, #2d5d7c)">
    <circle cx="432" cy="86" r="4"/><circle cx="498" cy="72" r="4"/>
    <circle cx="566" cy="94" r="4"/><circle cx="640" cy="80" r="4"/>
    <circle cx="694" cy="104" r="4"/><circle cx="452" cy="128" r="4"/>
    <circle cx="520" cy="116" r="4"/><circle cx="588" cy="140" r="4"/>
    <circle cx="662" cy="124" r="4"/><circle cx="700" cy="158" r="4"/>
    <circle cx="426" cy="170" r="4"/><circle cx="486" cy="192" r="4"/>
    <circle cx="556" cy="178" r="4"/><circle cx="622" cy="196" r="4"/>
    <circle cx="690" cy="186" r="4"/><circle cx="470" cy="100" r="4"/>
    <circle cx="540" cy="158" r="4"/><circle cx="610" cy="110" r="4"/>
    <circle cx="676" cy="148" r="4"/><circle cx="444" cy="204" r="4"/>
    <circle cx="512" cy="88" r="4"/><circle cx="584" cy="206" r="4"/>
    <circle cx="652" cy="168" r="4"/><circle cx="708" cy="76" r="4"/>
  </g>
  <text x="565" y="240" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">50 episodes · 12,000 frames · the whole mat</text>

  <text x="380" y="272" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">Each dot is where the brick started. Same frame count; only one of these says where the brick can be.</text>
</svg>
