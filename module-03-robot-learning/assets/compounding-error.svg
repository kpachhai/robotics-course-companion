<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="The demonstrated states form a thin tube; each small imitation error pushes the policy further from it, and once outside the tube the policy has no supervision, so the next error is larger than the last">

  <path d="M40 120 C 200 96, 380 96, 540 116 L720 128 L720 158 L540 146 C 380 126, 200 126, 40 150 Z"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)"
        stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="188" y="112" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">what the demonstrations covered</text>
  <text x="188" y="168" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">inside here the policy has been told what to do</text>

  <path d="M40 135 C 160 128, 250 136, 330 158 C 400 178, 450 206, 500 240 C 540 266, 580 282, 620 288"
        fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="2.2"/>
  <circle cx="40" cy="135" r="4.5" fill="var(--ox, #9c3b2e)"/>
  <circle cx="620" cy="288" r="4.5" fill="var(--ox, #9c3b2e)"/>

  <line x1="150" y1="130" x2="150" y2="144"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <line x1="255" y1="132" x2="255" y2="152"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <line x1="345" y1="136" x2="345" y2="166"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>

  <text x="86" y="122" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">starts where the demos start</text>

  <line x1="372" y1="196" x2="352" y2="172"
        stroke="var(--muted, #6b6053)" stroke-width="1.1" marker-end="url(#compErrArrow)"/>
  <text x="376" y="200" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">leaves the tube</text>
  <text x="376" y="218" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no demonstration ever came here, so the</text>
  <text x="376" y="232" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">next action is a guess, and it is worse</text>

  <line x1="612" y1="272" x2="626" y2="282"
        stroke="var(--muted, #6b6053)" stroke-width="1.1" marker-end="url(#compErrArrow)"/>
  <text x="608" y="266" text-anchor="end" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">gone</text>

  <line x1="40" y1="52" x2="720" y2="52"
        stroke="var(--line-2, #c8bca3)" stroke-width="1" marker-end="url(#compErrArrow)"/>
  <text x="40" y="42" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">time, or equivalently the number of decisions made</text>

  <text x="40" y="284" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the gap does not grow because the network got worse. It grows because</text>
  <text x="40" y="298" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the question being asked of it drifts away from the one it was trained on</text>

  <defs>
    <marker id="compErrArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
