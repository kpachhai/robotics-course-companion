<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-label="A locomotion reward is a weighted sum of small terms: one says go where you were told, the rest are penalties that rule out the degenerate ways of doing it">
  <defs>
    <marker id="locoRewardArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>

  <rect x="20" y="22" width="250" height="46" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="36" y="42" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">track the commanded velocity</text>
  <text x="36" y="59" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the only term that says what the task is</text>
  <text x="286" y="52" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">+1.5</text>

  <rect x="20" y="78" width="250" height="40" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="36" y="96" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">stay upright</text>
  <text x="36" y="111" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">rules out crawling and rolling</text>
  <text x="286" y="102" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">-1.0</text>

  <rect x="20" y="128" width="250" height="40" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="36" y="146" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">torque and joint speed</text>
  <text x="36" y="161" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">rules out thrashing; buys a real gait</text>
  <text x="286" y="152" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">-0.0002</text>

  <rect x="20" y="178" width="250" height="40" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="36" y="196" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">change in action per step</text>
  <text x="36" y="211" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">rules out the buzzing that servos hate</text>
  <text x="286" y="202" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">-0.01</text>

  <rect x="20" y="228" width="250" height="40" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="36" y="246" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">foot slip and air time</text>
  <text x="36" y="261" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">shapes what the feet do, not what they achieve</text>
  <text x="286" y="252" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">-0.5</text>

  <line x1="340" y1="145" x2="398" y2="145" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#locoRewardArrow)"/>

  <rect x="404" y="112" width="150" height="66" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="479" y="140" text-anchor="middle" class="svg-disp" font-size="15"
        font-weight="700" fill="var(--blue, #2d5d7c)">one number</text>
  <text x="479" y="160" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">per step, per robot</text>

  <line x1="554" y1="145" x2="600" y2="145" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#locoRewardArrow)"/>

  <rect x="606" y="94" width="118" height="102" rx="8"
        fill="none" stroke="var(--gold, #b07d22)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="665" y="126" text-anchor="middle" class="svg-disp" font-size="14"
        font-weight="700" fill="var(--gold, #b07d22)">a gait</text>
  <text x="665" y="148" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nobody wrote</text>
  <text x="665" y="162" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a trot; it is what</text>
  <text x="665" y="176" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">scores best</text>

  <text x="370" y="286" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">weights are illustrative, of the shape published locomotion configs use; every one of them is hand-tuned</text>
</svg>
