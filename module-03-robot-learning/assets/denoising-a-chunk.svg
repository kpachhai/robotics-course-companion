<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-label="Sampling an action chunk by denoising: start from random numbers, ask the network which noise was added, subtract a little of its guess, and repeat one hundred times, with the observation fed in at every pass">

  <path d="M 504 96 L 504 48 L 294 48 L 294 84" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="5 4"
        marker-end="url(#denoiseLoopArrow)"/>
  <text x="400" y="40" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the block goes round again, k = 100 down to 1</text>

  <rect x="30" y="96" width="124" height="76" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="92" y="126" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">pure noise</text>
  <text x="92" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">an action-shaped</text>
  <text x="92" y="159" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">block of random numbers</text>

  <line x1="158" y1="134" x2="198" y2="134"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#denoiseArrow)"/>

  <rect x="206" y="88" width="176" height="92" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="294" y="122" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">the network</text>
  <text x="294" y="143" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one job: guess which noise</text>
  <text x="294" y="156" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">is sitting on this block</text>

  <line x1="386" y1="134" x2="426" y2="134"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#denoiseArrow)"/>

  <rect x="434" y="96" width="140" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="504" y="126" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">subtract some</text>
  <text x="504" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a small step downhill,</text>
  <text x="504" y="159" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">plus a dash of fresh noise</text>

  <line x1="578" y1="134" x2="620" y2="134"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#denoiseArrow)"/>

  <rect x="628" y="96" width="104" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="680" y="126" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">an action</text>
  <text x="680" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">after the last pass,</text>
  <text x="680" y="159" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one sample, not the mean</text>

  <rect x="206" y="220" width="176" height="56" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="294" y="243" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">the observation</text>
  <text x="294" y="262" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">images and joint angles, unchanged</text>

  <line x1="294" y1="216" x2="294" y2="184"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#denoiseArrow)"/>

  <defs>
    <marker id="denoiseArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="denoiseLoopArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
