<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 350" role="img" aria-label="The two paths through ACT. During training the demonstrated action chunk is fed to a CVAE encoder that produces a distribution over the latent z, which is sampled and passed to the policy, while the same chunk is also the target the policy is scored against. At inference the demonstrated chunk does not exist, so z is set to a vector of zeros and the same policy runs unchanged.">

  <text x="20" y="24" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">training: z carries what the picture cannot explain</text>

  <text x="400" y="44" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--gold, #b07d22)">the same chunk is also the target the policy is scored against</text>
  <line x1="80" y1="70" x2="80" y2="52"
        stroke="var(--gold, #b07d22)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="80" y1="52" x2="641" y2="52"
        stroke="var(--gold, #b07d22)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="641" y1="52" x2="641" y2="80"
        stroke="var(--gold, #b07d22)" stroke-width="1.2" stroke-dasharray="4 4"
        marker-end="url(#cvaeTarget)"/>

  <rect x="20" y="70" width="120" height="46" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="80" y="89" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">demonstrated</text>
  <text x="80" y="106" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">chunk</text>

  <rect x="20" y="132" width="120" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="80" y="161" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">joint state</text>

  <rect x="182" y="86" width="126" height="76" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="245" y="116" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--purple, #5e2d8c)">CVAE encoder</text>
  <text x="245" y="134" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">4 layers, thrown</text>
  <text x="245" y="148" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">away after training</text>

  <rect x="350" y="100" width="72" height="48" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="386" y="120" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--purple, #5e2d8c)">mean,</text>
  <text x="386" y="137" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--purple, #5e2d8c)">spread</text>

  <rect x="464" y="100" width="72" height="48" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="500" y="129" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">sample z</text>

  <rect x="566" y="86" width="150" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="641" y="118" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">encoder + decoder</text>
  <text x="641" y="138" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the policy you keep</text>

  <g stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#cvaeFlow)">
    <line x1="142" y1="93" x2="176" y2="108"/>
    <line x1="142" y1="155" x2="176" y2="140"/>
    <line x1="310" y1="124" x2="344" y2="124"/>
    <line x1="424" y1="124" x2="458" y2="124"/>
    <line x1="538" y1="124" x2="560" y2="124"/>
  </g>

  <line x1="20" y1="204" x2="716" y2="204"
        stroke="var(--line-2, #c8bca3)" stroke-width="1"/>

  <text x="20" y="238" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">inference: there is no chunk to read, so z is zero</text>

  <rect x="20" y="262" width="120" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="80" y="291" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">joint state</text>

  <rect x="182" y="262" width="126" height="46" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"
        stroke-dasharray="4 4"/>
  <text x="245" y="291" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--purple, #5e2d8c)">z = 0, 0, ... 0</text>

  <rect x="566" y="262" width="150" height="46" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="641" y="291" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">encoder + decoder</text>

  <g stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#cvaeFlow)">
    <line x1="142" y1="285" x2="176" y2="285"/>
    <line x1="310" y1="285" x2="560" y2="285"/>
  </g>

  <line x1="641" y1="308" x2="641" y2="320"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="641" y="336" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--green, #15614e)">same weights, deterministic output</text>

  <defs>
    <marker id="cvaeFlow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="cvaeTarget" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--gold, #b07d22)"/>
    </marker>
  </defs>
</svg>
