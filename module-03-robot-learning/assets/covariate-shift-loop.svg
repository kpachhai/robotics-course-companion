<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="In supervised learning the test data is fixed before training begins, but a policy acts on the world and the world produces its next input, so the policy chooses the distribution it will be tested on">

  <text x="20" y="28" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Supervised learning</text>

  <rect x="20" y="44" width="150" height="66" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="74" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Held-out set</text>
  <text x="95" y="93" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">fixed before you start</text>

  <line x1="170" y1="77" x2="214" y2="77"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#covShiftArrow)"/>

  <rect x="218" y="44" width="150" height="66" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="293" y="82" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Model</text>

  <line x1="368" y1="77" x2="412" y2="77"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#covShiftArrow)"/>

  <rect x="416" y="44" width="150" height="66" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="491" y="82" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Error</text>

  <text x="586" y="72" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no arrow comes back.</text>
  <text x="586" y="87" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">being wrong changes</text>
  <text x="586" y="102" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nothing about the data.</text>

  <line x1="20" y1="140" x2="740" y2="140"
        stroke="var(--line-2, #c8bca3)" stroke-width="1"/>

  <text x="20" y="172" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">A policy in the loop</text>

  <rect x="20" y="188" width="150" height="66" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="95" y="218" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Observation</text>
  <text x="95" y="237" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the next test case</text>

  <line x1="170" y1="221" x2="214" y2="221"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#covShiftArrow)"/>

  <rect x="218" y="188" width="150" height="66" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="293" y="226" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Policy</text>

  <line x1="368" y1="221" x2="412" y2="221"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#covShiftArrow)"/>

  <rect x="416" y="188" width="150" height="66" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="491" y="218" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Action</text>
  <text x="491" y="237" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm actually moves</text>

  <path d="M566 221 L640 221 L640 285 L95 285 L95 258"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.3"
        marker-end="url(#covShiftArrow)"/>
  <text x="368" y="302" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">a small error here writes the input over there · the policy chooses its own test set</text>

  <defs>
    <marker id="covShiftArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
