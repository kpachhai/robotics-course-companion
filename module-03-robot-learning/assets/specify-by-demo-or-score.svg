<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-label="Two ways to specify a task: demonstrate it and fit the demonstrations, or score it and let the machine search for behaviour that scores well">
  <defs>
    <marker id="specDemoScoreArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>

  <text x="16" y="26" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Show it</text>
  <rect x="16" y="38" width="180" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="106" y="64" text-anchor="middle" class="svg-disp" font-size="14"
        font-weight="600" fill="var(--blue, #2d5d7c)">50 demonstrations</text>
  <text x="106" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">ten minutes of teleoperation</text>

  <line x1="196" y1="70" x2="248" y2="70" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#specDemoScoreArrow)"/>

  <rect x="252" y="38" width="180" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="342" y="64" text-anchor="middle" class="svg-disp" font-size="14"
        font-weight="600" fill="var(--blue, #2d5d7c)">supervised fit</text>
  <text x="342" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">copy the label at each state</text>

  <line x1="432" y1="70" x2="484" y2="70" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#specDemoScoreArrow)"/>

  <rect x="488" y="38" width="150" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="563" y="64" text-anchor="middle" class="svg-disp" font-size="14"
        font-weight="600" fill="var(--green, #15614e)">a policy</text>
  <text x="563" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">as good as the demos</text>

  <text x="648" y="60" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">needs a task</text>
  <text x="648" y="74" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a human can</text>
  <text x="648" y="88" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">actually perform</text>

  <line x1="16" y1="128" x2="744" y2="128" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>

  <text x="16" y="158" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Score it</text>
  <rect x="16" y="170" width="180" height="64" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="106" y="196" text-anchor="middle" class="svg-disp" font-size="14"
        font-weight="600" fill="var(--gold, #b07d22)">a reward function</text>
  <text x="106" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">twenty lines you wrote</text>

  <line x1="196" y1="202" x2="248" y2="202" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#specDemoScoreArrow)"/>

  <rect x="252" y="170" width="180" height="64" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="342" y="196" text-anchor="middle" class="svg-disp" font-size="14"
        font-weight="600" fill="var(--gold, #b07d22)">try, score, adjust</text>
  <text x="342" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">10^8 attempts, nearly all bad</text>

  <line x1="432" y1="202" x2="484" y2="202" stroke="var(--muted, #6b6053)"
        stroke-width="1.3" marker-end="url(#specDemoScoreArrow)"/>

  <rect x="488" y="170" width="150" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="563" y="196" text-anchor="middle" class="svg-disp" font-size="14"
        font-weight="600" fill="var(--green, #15614e)">a policy</text>
  <text x="563" y="216" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">as good as the score</text>

  <text x="648" y="192" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">needs a sim fast</text>
  <text x="648" y="206" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">enough to fail in,</text>
  <text x="648" y="220" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">millions of times</text>
</svg>
