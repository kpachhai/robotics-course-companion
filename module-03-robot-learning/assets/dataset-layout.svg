<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-label="A LeRobotDataset version 3 on disk: a metadata directory holding the schema, the task strings, the per-episode row ranges and the normalisation statistics; a data directory holding one Parquet file with every frame of every episode; and a videos directory holding one MP4 per camera rather than per episode">

  <rect x="16" y="34" width="228" height="150" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="32" y="58" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">meta/</text>
  <text x="32" y="82" class="svg-mono" font-size="9.5" fill="var(--purple, #5e2d8c)">info.json</text>
  <text x="32" y="96" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">schema, fps, path templates</text>
  <text x="32" y="118" class="svg-mono" font-size="9.5" fill="var(--purple, #5e2d8c)">tasks.parquet</text>
  <text x="32" y="132" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the task sentence, by id</text>
  <text x="32" y="154" class="svg-mono" font-size="9.5" fill="var(--purple, #5e2d8c)">episodes/chunk-000/file-000.parquet</text>
  <text x="32" y="168" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">length and row range of each episode</text>

  <rect x="268" y="34" width="204" height="150" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="284" y="58" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">data/</text>
  <text x="284" y="82" class="svg-mono" font-size="9.5" fill="var(--blue, #2d5d7c)">chunk-000/file-000.parquet</text>
  <text x="284" y="104" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">11,939 rows</text>
  <text x="284" y="118" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">all 50 episodes, one file</text>
  <text x="284" y="132" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">one row per frame</text>
  <text x="284" y="160" class="svg-mono" font-size="9.5" fill="var(--ox, #9c3b2e)">episode 7 is rows</text>
  <text x="284" y="174" class="svg-mono" font-size="9.5" fill="var(--ox, #9c3b2e)">1652 to 1854 of it</text>

  <rect x="496" y="34" width="248" height="150" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="512" y="58" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">videos/</text>
  <text x="512" y="82" class="svg-mono" font-size="9.5" fill="var(--blue, #2d5d7c)">images.up/chunk-000/file-000.mp4</text>
  <text x="512" y="104" class="svg-mono" font-size="9.5" fill="var(--blue, #2d5d7c)">images.side/chunk-000/file-000.mp4</text>
  <text x="512" y="132" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">one file per camera,</text>
  <text x="512" y="146" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">not per episode</text>
  <text x="512" y="168" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">two AV1 streams, 480 x 640</text>

  <line x1="244" y1="160" x2="264" y2="160"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" marker-end="url(#m3LayoutArrow)"/>

  <rect x="16" y="204" width="728" height="50" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="32" y="226" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">The previous format wrote one Parquet and one MP4 per episode. Version 3 packs many episodes into each file</text>
  <text x="32" y="242" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">and resolves the boundaries through the metadata, because file systems buckle long before robot fleets do.</text>

  <defs>
    <marker id="m3LayoutArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
