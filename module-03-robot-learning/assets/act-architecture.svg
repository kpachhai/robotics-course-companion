<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 336" role="img" aria-label="ACT as a token pipeline. Camera images pass through a ResNet-18 backbone into image tokens, the joint state becomes one token, and the latent z becomes one token. A four-layer transformer encoder mixes them into a memory, and a one-layer decoder reads that memory with one hundred learned queries, emitting one hundred actions.">

  <rect x="16" y="34" width="112" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="72" y="58" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">cameras</text>
  <text x="72" y="74" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">1 frame, each view</text>

  <rect x="158" y="34" width="112" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="214" y="58" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">ResNet-18</text>
  <text x="214" y="74" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one feature grid</text>

  <rect x="16" y="132" width="112" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="72" y="156" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">joint state</text>
  <text x="72" y="172" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">14 angles, now</text>

  <rect x="158" y="132" width="112" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="214" y="163" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">linear</text>

  <rect x="16" y="230" width="112" height="52" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="72" y="254" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--purple, #5e2d8c)">latent z</text>
  <text x="72" y="270" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">32 numbers</text>

  <rect x="158" y="230" width="112" height="52" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="214" y="261" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--purple, #5e2d8c)">linear</text>

  <g stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#actArchFlow)">
    <line x1="130" y1="60" x2="152" y2="60"/>
    <line x1="130" y1="158" x2="152" y2="158"/>
    <line x1="130" y1="256" x2="152" y2="256"/>
    <line x1="272" y1="60" x2="330" y2="60"/>
    <line x1="272" y1="158" x2="330" y2="158"/>
    <line x1="272" y1="256" x2="330" y2="256"/>
  </g>
  <text x="301" y="48" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">many tokens</text>
  <text x="301" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">1 token</text>
  <text x="301" y="244" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">1 token</text>

  <rect x="336" y="34" width="118" height="248" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="395" y="146" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">transformer</text>
  <text x="395" y="166" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">encoder</text>
  <text x="395" y="186" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">4 layers, width 512</text>

  <line x1="456" y1="158" x2="510" y2="158"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#actArchFlow)"/>
  <text x="483" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">memory</text>

  <rect x="516" y="112" width="118" height="92" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="575" y="148" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">decoder</text>
  <text x="575" y="168" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">1 layer</text>

  <rect x="516" y="240" width="118" height="52" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="575" y="263" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">100 queries</text>
  <text x="575" y="279" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">learned, one per step</text>

  <line x1="575" y1="236" x2="575" y2="210"
        stroke="var(--gold, #b07d22)" stroke-width="1.3" marker-end="url(#actArchQuery)"/>

  <line x1="636" y1="158" x2="668" y2="158"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#actArchFlow)"/>

  <rect x="674" y="112" width="76" height="92" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="712" y="148" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">100</text>
  <text x="712" y="166" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">actions</text>
  <text x="712" y="184" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">3.3 s at 30 fps</text>

  <defs>
    <marker id="actArchFlow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="actArchQuery" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--gold, #b07d22)"/>
    </marker>
  </defs>
</svg>
