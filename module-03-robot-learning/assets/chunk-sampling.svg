<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 306" role="img" aria-label="How a training sample is cut from one episode. Each sample takes the observation at a single frame and the window of actions that follows it. A sample taken near the end of the episode runs off the end, so the missing steps are padded with the last action and masked out of the loss.">

  <text x="20" y="30" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one episode: 239 frames at 30 fps, about 8 seconds</text>

  <rect x="60" y="46" width="600" height="28" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="70" y="66" class="svg-mono" font-size="9.5"
        fill="var(--blue, #2d5d7c)">frame 0</text>
  <text x="650" y="66" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--blue, #2d5d7c)">frame 238</text>

  <line x1="660" y1="38" x2="660" y2="228"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="666" y="36" class="svg-mono" font-size="9.5"
        fill="var(--ox, #9c3b2e)">episode ends</text>

  <circle cx="180" cy="60" r="6"
          fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <line x1="180" y1="76" x2="180" y2="112"
        stroke="var(--gold, #b07d22)" stroke-width="1.3" marker-end="url(#sampDrop)"/>
  <text x="192" y="100" class="svg-mono" font-size="9.5"
        fill="var(--gold, #b07d22)">observation at t</text>

  <rect x="180" y="118" width="200" height="26" rx="6"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="280" y="136" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">next 20 actions</text>
  <text x="392" y="136" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">mask = 1 everywhere</text>

  <circle cx="580" cy="60" r="6"
          fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <line x1="580" y1="76" x2="580" y2="176"
        stroke="var(--gold, #b07d22)" stroke-width="1.3" marker-end="url(#sampDrop)"/>

  <rect x="580" y="182" width="80" height="26" rx="6"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <rect x="660" y="182" width="60" height="26" rx="6"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"
        stroke-dasharray="4 4"/>

  <line x1="690" y1="212" x2="690" y2="240"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="716" y="256" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--ox, #9c3b2e)">padded with the last action</text>
  <text x="716" y="270" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--ox, #9c3b2e)">mask = 0, excluded from the loss</text>

  <text x="20" y="290" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">divide the loss by the number of real steps, not by the padded length</text>

  <defs>
    <marker id="sampDrop" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--gold, #b07d22)"/>
    </marker>
  </defs>
</svg>
