<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 226" role="img" aria-label="Two ways of asking an AI assistant for help with the same task, both reaching the same failure on the real robot: asking for the answer ends in code you cannot debug, asking for a hint ends knowing where to look">
  <rect x="9" y="46" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="70" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">ask for the answer</text>
  <text x="95" y="87" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">"write the IK solver"</text>

  <line x1="183" y1="73" x2="195" y2="73"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m0TwoWaysArrow)"/>

  <rect x="199" y="46" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="285" y="70" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">it lands in code/</text>
  <text x="285" y="87" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">it runs, it looks right</text>

  <line x1="373" y1="73" x2="385" y2="73"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m0TwoWaysArrow)"/>

  <rect x="389" y="46" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="475" y="70" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">it fails on the arm</text>
  <text x="475" y="87" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">gripper goes 90° wrong</text>

  <line x1="563" y1="73" x2="575" y2="73"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m0TwoWaysArrow)"/>

  <rect x="579" y="46" width="172" height="54" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="665" y="70" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">you cannot debug it</text>
  <text x="665" y="87" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no model of it in your head</text>

  <rect x="9" y="150" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="95" y="174" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">ask for a hint</text>
  <text x="95" y="191" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">"question me until I see it"</text>

  <line x1="183" y1="177" x2="195" y2="177"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m0TwoWaysArrow)"/>

  <rect x="199" y="150" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="285" y="174" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">you write it</text>
  <text x="285" y="191" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">an hour slower</text>

  <line x1="373" y1="177" x2="385" y2="177"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m0TwoWaysArrow)"/>

  <rect x="389" y="150" width="172" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="475" y="174" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">it fails on the arm</text>
  <text x="475" y="191" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the same failure</text>

  <line x1="563" y1="177" x2="575" y2="177"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#m0TwoWaysArrow)"/>

  <rect x="579" y="150" width="172" height="54" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="665" y="174" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">you know where to look</text>
  <text x="665" y="191" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you check frame order first</text>

  <text x="380" y="126" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">same task, same bug, one hour of difference in the middle</text>

  <defs>
    <marker id="m0TwoWaysArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
