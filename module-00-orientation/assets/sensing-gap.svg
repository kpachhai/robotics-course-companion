<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-label="Four sensors return raw arrays on the left, a state estimation stage in the middle, and the world facts a controller needs on the right">
  <rect x="20" y="26" width="204" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="122" y="47" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Joint encoder</text>
  <text x="122" y="64" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">int ticks · ~4096/rev · 1 kHz</text>

  <rect x="20" y="90" width="204" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="122" y="111" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Camera</text>
  <text x="122" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">uint8 [480,640,3] · 30 Hz</text>

  <rect x="20" y="154" width="204" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="122" y="175" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">IMU</text>
  <text x="122" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">float ×6 · m/s², rad/s · 200 Hz</text>

  <rect x="20" y="218" width="204" height="52" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="122" y="239" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Force / torque</text>
  <text x="122" y="256" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">float ×6 · N, N·m · 500 Hz</text>

  <line x1="224" y1="52" x2="282" y2="82" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#sensingGapArrow)"/>
  <line x1="224" y1="116" x2="282" y2="126" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#sensingGapArrow)"/>
  <line x1="224" y1="180" x2="282" y2="170" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#sensingGapArrow)"/>
  <line x1="224" y1="244" x2="282" y2="214" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#sensingGapArrow)"/>

  <rect x="286" y="60" width="180" height="176" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="376" y="136" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--purple, #5e2d8c)">State estimation</text>
  <text x="376" y="158" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">everything to the right</text>
  <text x="376" y="172" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">of here is inferred</text>

  <line x1="466" y1="126" x2="524" y2="66" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#sensingGapArrow)"/>
  <line x1="466" y1="148" x2="524" y2="150" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#sensingGapArrow)"/>
  <line x1="466" y1="170" x2="524" y2="234" stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#sensingGapArrow)"/>

  <rect x="528" y="34" width="212" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="634" y="60" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Where the gripper is</text>
  <text x="634" y="78" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pose in the world frame</text>

  <rect x="528" y="118" width="212" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="634" y="144" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Where the object is</text>
  <text x="634" y="162" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pose · size · how to grasp</text>

  <rect x="528" y="202" width="212" height="64" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="634" y="228" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">What is happening now</text>
  <text x="634" y="246" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">velocity · contact · slip</text>

  <defs>
    <marker id="sensingGapArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
