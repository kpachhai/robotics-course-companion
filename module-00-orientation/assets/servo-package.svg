<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="A servo package: a controller, a motor and a gearbox in one housing, with an encoder feeding the measured angle back to the controller, so the position loop closes inside the box before any command from your code arrives">

  <text x="128" y="16" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">target angle, from your code</text>
  <line x1="128" y1="24" x2="128" y2="88"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#servoPackArrow)"/>

  <rect x="30" y="48" width="560" height="232" rx="8"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.4"/>

  <rect x="58" y="92" width="140" height="76" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="128" y="122" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">Controller</text>
  <text x="128" y="141" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">compares target</text>
  <text x="128" y="155" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">against measured</text>

  <rect x="226" y="92" width="140" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="296" y="122" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Motor</text>
  <text x="296" y="141" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">current in,</text>
  <text x="296" y="155" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">torque out</text>

  <rect x="394" y="92" width="140" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="464" y="122" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Gearbox</text>
  <text x="464" y="141" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">slower, stronger</text>
  <text x="464" y="155" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a few hundred to one</text>

  <line x1="198" y1="130" x2="222" y2="130"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#servoPackArrow)"/>
  <line x1="366" y1="130" x2="390" y2="130"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#servoPackArrow)"/>
  <line x1="534" y1="130" x2="614" y2="130"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#servoPackArrow)"/>

  <rect x="622" y="98" width="112" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="678" y="124" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">The joint</text>
  <text x="678" y="143" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and whatever it carries</text>

  <line x1="464" y1="168" x2="464" y2="200"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>

  <rect x="394" y="204" width="140" height="58" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="464" y="228" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">Encoder</text>
  <text x="464" y="247" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reads the angle reached</text>

  <path d="M390 233 L128 233 L128 172" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#servoPackArrow)"/>
  <text x="270" y="225" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">measured angle · the inner loop closes here</text>

  <text x="48" y="272" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">Inside one servo</text>

  <defs>
    <marker id="servoPackArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
