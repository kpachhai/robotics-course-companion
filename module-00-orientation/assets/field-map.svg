<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" role="img" aria-label="Four axes that place any robotics system: which problem it solves, whether it runs in simulation or on hardware, where its behaviour came from, and how it splits between a slow deliberate layer and a fast reactive layer">

  <text x="20" y="24" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">1 · What problem is it?</text>
  <text x="740" y="24" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">three fields, three literatures, three winning methods</text>

  <rect x="20" y="38" width="229" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="134" y="64" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Manipulation</text>
  <text x="134" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">act on the world through contact</text>
  <text x="134" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Modules 1-6 · the spine</text>

  <rect x="265" y="38" width="229" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="379" y="64" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Locomotion</text>
  <text x="379" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">move your own body over terrain</text>
  <text x="379" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Module 3 · Module 7 track B</text>

  <rect x="510" y="38" width="230" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="625" y="64" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Navigation</text>
  <text x="625" y="83" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">map, localize, plan a path</text>
  <text x="625" y="98" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">awareness only · Module 7</text>

  <text x="20" y="136" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">2 · Where does it run?</text>
  <text x="740" y="136" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">sim is free and lies; hardware is honest and slow</text>

  <rect x="20" y="150" width="280" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="160" y="176" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Simulation</text>
  <text x="160" y="195" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">free, parallel, resettable, perfectly measured</text>
  <text x="160" y="210" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Module 2</text>

  <rect x="460" y="150" width="280" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="600" y="176" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Real hardware</text>
  <text x="600" y="195" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">honest, slow, breakable, needs a human</text>
  <text x="600" y="210" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Module 4</text>

  <text x="380" y="170" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">sim-to-real gap</text>
  <line x1="306" y1="184" x2="454" y2="184" stroke="var(--ox, #9c3b2e)" stroke-width="1.4"
        stroke-dasharray="4 4" marker-start="url(#fieldmapBack)" marker-end="url(#fieldmapFwdOx)"/>
  <text x="380" y="202" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">randomise sim to close it</text>

  <text x="20" y="248" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">3 · Where does the behaviour come from?</text>
  <text x="740" y="248" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the axis is what you supply</text>

  <rect x="20" y="262" width="168" height="88" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="104" y="286" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Written</text>
  <text x="104" y="304" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">by hand</text>
  <text x="104" y="324" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you supply the algorithm</text>
  <text x="104" y="338" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Modules 1-2</text>

  <rect x="204" y="262" width="168" height="88" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="288" y="286" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Imitation</text>
  <text x="288" y="304" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">learning</text>
  <text x="288" y="324" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you supply the demos</text>
  <text x="288" y="338" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Modules 3-4</text>

  <rect x="388" y="262" width="168" height="88" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="472" y="286" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Reinforcement</text>
  <text x="472" y="304" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">learning</text>
  <text x="472" y="324" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you supply reward + sim</text>
  <text x="472" y="338" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Module 3</text>

  <rect x="572" y="262" width="168" height="88" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="656" y="286" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">Foundation</text>
  <text x="656" y="304" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">models (VLAs)</text>
  <text x="656" y="324" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">someone else supplied it</text>
  <text x="656" y="338" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Module 5 · you fine-tune</text>

  <text x="20" y="380" class="svg-disp" font-size="13.5" font-weight="600"
        fill="var(--blue, #2d5d7c)">4 · How is it split in time?</text>
  <text x="740" y="380" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">a good decision takes longer than the deadline allows</text>

  <rect x="20" y="394" width="280" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="160" y="420" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">The slow layer</text>
  <text x="160" y="439" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">0.1-2 Hz · scene, plan, verify, recover</text>
  <text x="160" y="454" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Module 6</text>

  <rect x="460" y="394" width="280" height="68" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="600" y="420" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">The fast layer</text>
  <text x="600" y="439" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">10-1000 Hz · balance, servo loops, policy</text>
  <text x="600" y="454" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">Modules 1, 3-5</text>

  <text x="380" y="406" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">goals, skill calls</text>
  <line x1="306" y1="414" x2="454" y2="414"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fieldmapFwd)"/>
  <line x1="454" y1="438" x2="306" y2="438"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fieldmapFwd)"/>
  <text x="380" y="454" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">state, result</text>

  <defs>
    <marker id="fieldmapFwd" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="fieldmapFwdOx" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
    <marker id="fieldmapBack" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
