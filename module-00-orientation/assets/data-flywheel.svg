<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 162" role="img" aria-label="The operating loop shared by every learning-based robot system: collect data, train a policy, evaluate over at least twenty trials, deploy, and feed the failures back into the next round of data collection">
  <rect x="25" y="30" width="155" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="102.5" y="58" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Collect data</text>
  <text x="102.5" y="76" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">teleoperate the task</text>

  <line x1="180" y1="58" x2="208" y2="58"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#dataFlywheelArrow)"/>

  <rect x="210" y="30" width="155" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="287.5" y="58" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Train a policy</text>
  <text x="287.5" y="76" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">hours on one GPU</text>

  <line x1="365" y1="58" x2="393" y2="58"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#dataFlywheelArrow)"/>

  <rect x="395" y="30" width="155" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="472.5" y="58" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Evaluate</text>
  <text x="472.5" y="76" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">at least 20 trials</text>

  <line x1="550" y1="58" x2="578" y2="58"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#dataFlywheelArrow)"/>

  <rect x="580" y="30" width="155" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="657.5" y="58" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">Deploy</text>
  <text x="657.5" y="76" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and find the failures</text>

  <path d="M657.5 86 V126 H102.5 V90" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#dataFlywheelArrow)"/>
  <text x="380" y="146" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every failure becomes the next batch of training data</text>

  <defs>
    <marker id="dataFlywheelArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
