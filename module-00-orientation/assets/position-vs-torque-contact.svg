<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Two responses to hitting an obstacle. Under position control the commanded angle sits inside the obstacle, so the error never closes and the contact force keeps rising. Under torque control the arm pushes with exactly the force commanded and stops wherever contact allows.">

  <text x="190" y="34" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">Position control</text>
  <text x="190" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you command an angle</text>

  <rect x="210" y="100" width="18" height="120" rx="6"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>

  <line x1="80" y1="200" x2="222" y2="200"
        stroke="var(--ox, #9c3b2e)" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="80" y1="200" x2="210" y2="148"
        stroke="var(--blue, #2d5d7c)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="200" r="7"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>

  <text x="126" y="148" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">where it stops</text>
  <text x="145" y="218" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">commanded angle</text>

  <line x1="232" y1="148" x2="322" y2="148"
        stroke="var(--ox, #9c3b2e)" stroke-width="3" marker-end="url(#posTorqueArrowOx)"/>
  <text x="292" y="136" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">force climbs, no limit</text>

  <text x="190" y="252" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the error never closes, so the current keeps rising</text>
  <text x="190" y="266" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">until something yields: the object, the arm or the servo</text>

  <text x="560" y="34" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">Torque control</text>
  <text x="560" y="52" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">you command a force</text>

  <rect x="570" y="100" width="18" height="120" rx="6"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>

  <line x1="440" y1="200" x2="570" y2="148"
        stroke="var(--blue, #2d5d7c)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="440" cy="200" r="7"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>

  <text x="470" y="142" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">wherever contact allows</text>

  <line x1="592" y1="148" x2="644" y2="148"
        stroke="var(--green, #15614e)" stroke-width="3" marker-end="url(#posTorqueArrowGreen)"/>
  <text x="648" y="136" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">force = your command</text>

  <text x="560" y="252" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm pushes exactly as hard as you allowed</text>
  <text x="560" y="266" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">and stops there; the angle is an outcome, not a command</text>

  <defs>
    <marker id="posTorqueArrowOx" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14"
            refX="7" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
    <marker id="posTorqueArrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14"
            refX="7" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="var(--green, #15614e)"/>
    </marker>
  </defs>
</svg>
