<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 324" role="img" aria-label="Two different joint-angle pairs put the same two-link arm's fingertip on the same point: one swings the elbow below the line to the target, the other above it, and the hand ends up pointing in two completely different directions">
  <line x1="100" y1="260" x2="100" y2="50"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <line x1="100" y1="260" x2="352" y2="260"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <text x="92" y="54" text-anchor="end" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">y</text>
  <text x="352" y="252" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">x</text>

  <line x1="100" y1="260" x2="280" y2="140"
        stroke="var(--muted, #6b6053)" stroke-width="1.1" stroke-dasharray="3 4"/>

  <line x1="100" y1="260" x2="299.1" y2="278.7"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>
  <line x1="299.1" y1="278.7" x2="280" y2="140"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>

  <line x1="100" y1="260" x2="159.3" y2="69"
        stroke="var(--gold, #b07d22)" stroke-width="5" stroke-linecap="round"/>
  <line x1="159.3" y1="69" x2="280" y2="140"
        stroke="var(--gold, #b07d22)" stroke-width="5" stroke-linecap="round"/>

  <circle cx="100" cy="260" r="6"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="299.1" cy="278.7" r="6"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="159.3" cy="69" r="6"
          fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <circle cx="280" cy="140" r="7.5"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.8"/>

  <text x="312" y="284" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">θ2 &gt; 0</text>
  <text x="170" y="66" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">θ2 &lt; 0</text>
  <text x="292" y="128" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">same point</text>
  <text x="92" y="278" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">base</text>

  <text x="380" y="88" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">θ = (-5.4°, +103.2°)</text>
  <text x="380" y="108" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">elbow swings below the dashed line</text>
  <text x="380" y="124" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">hand ends up pointing at +97.9°</text>

  <text x="380" y="168" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">θ = (+72.7°, -103.2°)</text>
  <text x="380" y="188" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">elbow swings above it</text>
  <text x="380" y="204" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">hand ends up pointing at -30.5°</text>

  <text x="380" y="244" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">fingertip: (0.90, 0.60) both times</text>
  <text x="380" y="264" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">links l1 = 1.00 and l2 = 0.70</text>

  <text x="100" y="308" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the two branches are the sign of θ2 · which one looks like "elbow up" depends on where the target sits</text>
</svg>
