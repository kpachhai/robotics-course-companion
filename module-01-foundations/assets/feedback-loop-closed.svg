<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352"
     role="img" aria-label="Above, an open loop where a plan drives the motor and the arm and nothing returns. Below, the same chain with one extra wire carrying the measured angle back to a comparison against the target, whose difference drives the controller">

  <text x="24" y="46" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">Open loop</text>
  <text x="24" y="64" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">decide once,</text>
  <text x="24" y="76" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">then hope</text>

  <rect x="146" y="34" width="118" height="56" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="205" y="60" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">the plan</text>
  <text x="205" y="78" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">worked out up front</text>

  <line x1="264" y1="62" x2="308" y2="62"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fbcArrowA)"/>

  <rect x="314" y="34" width="100" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="364" y="60" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">motor</text>
  <text x="364" y="78" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">current to twist</text>

  <line x1="414" y1="62" x2="458" y2="62"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fbcArrowB)"/>

  <rect x="464" y="34" width="100" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="514" y="60" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">arm</text>
  <text x="514" y="78" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">mass and gravity</text>

  <line x1="564" y1="62" x2="606" y2="62"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fbcArrowC)"/>
  <text x="612" y="58" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">wherever</text>
  <text x="612" y="75" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">it ends up</text>

  <line x1="146" y1="112" x2="606" y2="112"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="376" y="128" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--ox, #9c3b2e)">nothing on this line: no part of the chain ever learns what happened</text>

  <line x1="24" y1="152" x2="696" y2="152"
        stroke="var(--line-2, #c8bca3)" stroke-width="1"/>

  <text x="24" y="212" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">Closed loop</text>
  <text x="24" y="230" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">measure, then</text>
  <text x="24" y="242" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">correct</text>

  <text x="120" y="196" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">target</text>
  <line x1="120" y1="204" x2="120" y2="212"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fbcArrowD)"/>

  <circle cx="120" cy="230" r="15"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="120" y="236" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">−</text>

  <line x1="135" y1="230" x2="170" y2="230"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fbcArrowE)"/>
  <text x="152" y="222" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">error</text>

  <rect x="176" y="202" width="118" height="56" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="235" y="228" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">controller</text>
  <text x="235" y="246" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">error in, torque out</text>

  <line x1="294" y1="230" x2="338" y2="230"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fbcArrowF)"/>

  <rect x="344" y="202" width="90" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="389" y="234" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">motor</text>

  <line x1="434" y1="230" x2="470" y2="230"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fbcArrowG)"/>

  <rect x="476" y="202" width="90" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="521" y="234" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">arm</text>

  <line x1="566" y1="230" x2="608" y2="230"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fbcArrowH)"/>
  <text x="614" y="234" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">the angle</text>

  <path d="M 620 246 L 620 296 L 120 296 L 120 245" fill="none"
        stroke="var(--green, #15614e)" stroke-width="2" marker-end="url(#fbcArrowI)"/>
  <text x="370" y="314" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">the measured angle, coming back</text>
  <text x="370" y="331" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">this one wire is the entire difference between the two diagrams</text>

  <defs>
    <marker id="fbcArrowA" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="fbcArrowB" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="fbcArrowC" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="fbcArrowD" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="fbcArrowE" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="fbcArrowF" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="fbcArrowG" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="fbcArrowH" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="fbcArrowI" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--green, #15614e)"/>
    </marker>
  </defs>
</svg>
