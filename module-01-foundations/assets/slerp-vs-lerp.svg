<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Two paths between the same start and end orientation: the slerp path is the shorter arc travelled at constant speed, the component-wise Euler interpolation bulges outward, travels 6.6 percent further and speeds up in the middle, where the two orientations differ by 28.8 degrees">

