<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 344" role="img" aria-label="The hand's true path under a shoulder rotation is a circular arc, while the Jacobian predicts a straight tangent line; the two coincide at one degree, are 22.5 millimetres apart at ten degrees, and 201 millimetres apart at thirty degrees">
  <text x="370" y="26" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">turning joint 1 only, from θ1 = 30° · zoomed in on the hand</text>

  <path d="M560,250 A592,592 0 0,0 273.6,141.1" fill="none"
        stroke="var(--blue, #2d5d7c)" stroke-width="2.4"/>
  <line x1="560" y1="250" x2="283.5" y2="50.5"
        stroke="var(--gold, #b07d22)" stroke-width="2" stroke-dasharray="5 4"/>

  <line x1="560" y1="250" x2="560" y2="316"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>
  <text x="574" y="302" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">link 2, down to the elbow</text>

  <circle cx="560" cy="250" r="7"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="574" y="256" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">hand now</text>

  <circle cx="471.5" cy="197.2" r="3.6" fill="var(--blue, #2d5d7c)"/>
  <circle cx="273.6" cy="141.1" r="3.6" fill="var(--blue, #2d5d7c)"/>
  <circle cx="476.2" cy="189.5" r="3.6" fill="var(--gold, #b07d22)"/>
  <circle cx="308.7" cy="68.6" r="3.6" fill="var(--gold, #b07d22)"/>

  <line x1="273.6" y1="141.1" x2="308.7" y2="68.6"
        stroke="var(--ox, #9c3b2e)" stroke-width="2"/>
  <line x1="268" y1="106" x2="287" y2="106"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.1"/>
  <text x="262" y="102" text-anchor="end" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">201 mm apart</text>
  <text x="262" y="118" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">at +30°, that is 26% of the move</text>

  <line x1="478" y1="189" x2="500" y2="172"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="504" y="170" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">+10°: 22.5 mm apart, 8.7% of the move</text>
  <line x1="554" y1="240" x2="568" y2="216"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="572" y="214" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">+1°: 0.23 mm apart, 0.9%</text>

  <text x="330" y="62" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">what J predicts: a straight line</text>
  <text x="344" y="80" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the column, held fixed, times the angle</text>
  <text x="350" y="232" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">the true path: an arc about the base</text>

  <text x="370" y="334" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">J is exact at the instant and only at the instant · the further you step, the more the straight line lies</text>
</svg>
