<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300"
     role="img" aria-label="One error signal fans out into three terms answering three different questions about it, how far off it is now, how long it has been off, and how fast it is changing, and their three outputs add up to a single commanded torque">

  <text x="26" y="146" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">error</text>
  <text x="26" y="164" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">target − measured</text>
  <text x="26" y="176" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one number, every tick</text>

  <path d="M 122 141 L 152 141 L 152 56 L 186 56" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#p3tArrowP)"/>
  <path d="M 122 148 L 168 148 L 186 148" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#p3tArrowI)"/>
  <path d="M 122 155 L 152 155 L 152 240 L 186 240" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#p3tArrowD)"/>

  <rect x="192" y="28" width="270" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="212" y="54" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">P: how far off is it right now?</text>
  <text x="212" y="72" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">kp × error, the term that does the moving</text>

  <rect x="192" y="120" width="270" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="212" y="146" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">I: how long has it been off?</text>
  <text x="212" y="164" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">ki × the running total, finishes the job</text>

  <rect x="192" y="212" width="270" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="212" y="238" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">D: how fast is it changing?</text>
  <text x="212" y="256" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">kd × the rate of change, the brake</text>

  <path d="M 462 56 L 512 56 L 512 132" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#p3tSumA)"/>
  <line x1="462" y1="148" x2="512" y2="148"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#p3tSumB)"/>
  <path d="M 462 240 L 512 240 L 512 164" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#p3tSumC)"/>

  <circle cx="530" cy="148" r="17"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="530" y="154" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--green, #15614e)">+</text>

  <line x1="547" y1="148" x2="590" y2="148"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#p3tOut)"/>

  <text x="598" y="144" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">torque</text>
  <text x="598" y="162" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one number,</text>
  <text x="598" y="174" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">sent to the motor</text>

  <defs>
    <marker id="p3tArrowP" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="p3tArrowI" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="p3tArrowD" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="p3tSumA" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="p3tSumB" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="p3tSumC" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="p3tOut" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
