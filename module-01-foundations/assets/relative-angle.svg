<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="The same pair of joint angles read two ways: on the left the elbow angle is measured from link one and link two points along ninety degrees, on the right it is wrongly measured from the world x-axis and the fingertip lands almost half a link away">
  <line x1="340" y1="30" x2="340" y2="302"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>

  <text x="210" y="44" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">correct: θ2 measured from link 1</text>
  <text x="505" y="44" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">the bug: θ2 read off the x-axis</text>

  <line x1="120" y1="250" x2="300" y2="250"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <line x1="219.6" y1="166.4" x2="265.6" y2="127.8"
        stroke="var(--muted, #6b6053)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="120" y1="250" x2="219.6" y2="166.4"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>
  <line x1="219.6" y1="166.4" x2="219.6" y2="75.4"
        stroke="var(--green, #15614e)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="250" r="6"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="219.6" cy="166.4" r="6"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="219.6" cy="75.4" r="7"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.8"/>
  <path d="M166,250 A46,46 0 0 0 155.2,220.4" fill="none"
        stroke="var(--gold, #b07d22)" stroke-width="1.5" marker-end="url(#relAngTip)"/>
  <path d="M245.6,144.5 A34,34 0 0 0 219.6,132.4" fill="none"
        stroke="var(--gold, #b07d22)" stroke-width="1.5" marker-end="url(#relAngTip)"/>
  <text x="168" y="236" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">θ1 = 40°</text>
  <text x="256" y="126" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">θ2 = 50°</text>
  <text x="219.6" y="62" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">(0.77, 1.34)</text>
  <text x="210" y="292" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">link 2 points along 40° + 50° = 90°</text>

  <line x1="420" y1="250" x2="600" y2="250"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <line x1="519.6" y1="166.4" x2="589.6" y2="166.4"
        stroke="var(--muted, #6b6053)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="420" y1="250" x2="519.6" y2="166.4"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>
  <line x1="519.6" y1="166.4" x2="578.1" y2="96.7"
        stroke="var(--ox, #9c3b2e)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="420" cy="250" r="6"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="519.6" cy="166.4" r="6"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="578.1" cy="96.7" r="7"
          fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.8"/>
  <path d="M466,250 A46,46 0 0 0 455.2,220.4" fill="none"
        stroke="var(--gold, #b07d22)" stroke-width="1.5" marker-end="url(#relAngTip)"/>
  <path d="M553.6,166.4 A34,34 0 0 0 541.5,140.4" fill="none"
        stroke="var(--gold, #b07d22)" stroke-width="1.5" marker-end="url(#relAngTip)"/>
  <text x="468" y="236" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">θ1 = 40°</text>
  <text x="556" y="142" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">θ2 = 50°</text>
  <text x="578.1" y="84" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">(1.22, 1.18)</text>
  <text x="505" y="292" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">link 2 points along 50°, and 40° of arm went missing</text>

  <text x="340" y="320" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same two numbers in · fingertips 0.48 apart on links of 1.00 and 0.70 · nothing crashes, the arm is simply elsewhere</text>

  <defs>
    <marker id="relAngTip" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="var(--gold, #b07d22)" stroke-width="1.3"/>
    </marker>
  </defs>
</svg>
