<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 320"
     role="img" aria-label="A tree of references in one robot scene. The room is the root; the table and then the cup hang off it, as does the overhead camera, and so does the robot base, which leads to the six joints and then to the gripper and the wrist camera. Each arrow gives a child's origin and directions in terms of its parent.">

  <!-- edges: parent to child -->
  <path d="M174,160 H190 V50 H201" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#treeArrow)"/>
  <path d="M174,160 H201" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#treeArrow)"/>
  <path d="M174,160 H190 V270 H201" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#treeArrow)"/>
  <path d="M356,50 H383" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#treeArrow)"/>
  <path d="M356,160 H383" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#treeArrow)"/>
  <path d="M538,160 H554 V116 H565" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#treeArrow)"/>
  <path d="M538,160 H554 V202 H565" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#treeArrow)"/>

  <!-- the room, and the things bolted to it -->
  <rect x="24" y="136" width="150" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="99" y="163" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">the room</text>
  <text x="99" y="177" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">fixed</text>

  <rect x="206" y="26" width="150" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="281" y="53" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">the table</text>
  <text x="281" y="67" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">fixed</text>

  <rect x="388" y="26" width="150" height="48" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="463" y="53" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">the cup</text>
  <text x="463" y="67" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">moves when moved</text>

  <rect x="206" y="136" width="150" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="281" y="163" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">the robot&#8217;s base</text>
  <text x="281" y="177" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">fixed once bolted</text>

  <rect x="388" y="136" width="150" height="48" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="463" y="163" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">the six joints</text>
  <text x="463" y="177" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one each, all moving</text>

  <rect x="570" y="92" width="150" height="48" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="645" y="119" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">the gripper</text>
  <text x="645" y="133" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">moves with the arm</text>

  <rect x="570" y="178" width="150" height="48" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="645" y="205" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">the wrist camera</text>
  <text x="645" y="219" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">moves with the arm</text>

  <rect x="206" y="246" width="150" height="48" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="281" y="273" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">the overhead camera</text>
  <text x="281" y="287" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">fixed</text>

  <defs>
    <marker id="treeArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
