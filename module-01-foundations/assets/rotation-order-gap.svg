<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="The phone's three body axes after the two turns taken in each order, drawn as two triads; a single one-hundred-and-twenty-degree twist about the axis minus one, one, one carries one result onto the other">
  <text x="320" y="24" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">where the phone's own three axes ended up, in each order</text>

  <!-- order one -->
  <line x1="160" y1="190" x2="118.5" y2="172.6"
        stroke="var(--blue, #2d5d7c)" stroke-width="2" marker-end="url(#rotGapArrowX)"/>
  <line x1="160" y1="190" x2="160.0" y2="132.7"
        stroke="var(--purple, #5e2d8c)" stroke-width="2" marker-end="url(#rotGapArrowY)"/>
  <line x1="160" y1="190" x2="206.1" y2="174.3"
        stroke="var(--gold, #b07d22)" stroke-width="2" marker-end="url(#rotGapArrowZ)"/>
  <circle cx="160" cy="190" r="3.4" fill="var(--muted, #6b6053)"/>
  <text x="108" y="168" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">x</text>
  <text x="160" y="122" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--purple, #5e2d8c)">y</text>
  <text x="216" y="170" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">z</text>
  <text x="160" y="248" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">tilt, then turn</text>
  <text x="160" y="266" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">x → +y · y → +z · z → +x</text>

  <!-- the twist between them -->
  <path d="M238,150 C282,112 350,112 390,146" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.4" stroke-dasharray="5 4"
        marker-end="url(#rotGapArrowTwist)"/>
  <text x="314" y="104" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">120° apart</text>
  <text x="314" y="88" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one twist about the axis (−1, 1, 1)</text>

  <!-- order two -->
  <line x1="470" y1="190" x2="470.0" y2="132.7"
        stroke="var(--blue, #2d5d7c)" stroke-width="2" marker-end="url(#rotGapArrowX)"/>
  <line x1="470" y1="190" x2="423.9" y2="205.7"
        stroke="var(--purple, #5e2d8c)" stroke-width="2" marker-end="url(#rotGapArrowY)"/>
  <line x1="470" y1="190" x2="511.5" y2="207.4"
        stroke="var(--gold, #b07d22)" stroke-width="2" marker-end="url(#rotGapArrowZ)"/>
  <circle cx="470" cy="190" r="3.4" fill="var(--muted, #6b6053)"/>
  <text x="470" y="122" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">x</text>
  <text x="414" y="212" text-anchor="end" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--purple, #5e2d8c)">y</text>
  <text x="521" y="216" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">z</text>
  <text x="470" y="248" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">turn, then tilt</text>
  <text x="470" y="266" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">x → +z · y → −x · z → −y</text>

  <text x="320" y="290" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">every one of the three axes ends up 90° away from where the other order put it</text>

  <defs>
    <marker id="rotGapArrowX" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--blue, #2d5d7c)"/>
    </marker>
    <marker id="rotGapArrowY" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--purple, #5e2d8c)"/>
    </marker>
    <marker id="rotGapArrowZ" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--gold, #b07d22)"/>
    </marker>
    <marker id="rotGapArrowTwist" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
