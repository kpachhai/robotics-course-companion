<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Grasp success rate against perception error sigma. The curve is flat at one hundred per cent while sigma is below about two millimetres, falls to eighty-six per cent at five millimetres, thirty-nine per cent at ten millimetres, and twelve per cent at twenty millimetres. Measured episode counts sit on the closed-form curve.">

  <text x="90" y="26" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">grasp success rate</text>

  <line x1="90" y1="44" x2="706" y2="44" stroke="var(--line-2, #c8bca3)" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="90" y1="95.5" x2="706" y2="95.5" stroke="var(--line-2, #c8bca3)" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="90" y1="147" x2="706" y2="147" stroke="var(--line-2, #c8bca3)" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="90" y1="198.5" x2="706" y2="198.5" stroke="var(--line-2, #c8bca3)" stroke-width="1" stroke-dasharray="3 4"/>

  <line x1="90" y1="38" x2="90" y2="250" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>
  <line x1="90" y1="250" x2="706" y2="250" stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>

  <text x="82" y="47" text-anchor="end" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">100%</text>
  <text x="82" y="98.5" text-anchor="end" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">75%</text>
  <text x="82" y="150" text-anchor="end" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">50%</text>
  <text x="82" y="201.5" text-anchor="end" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">25%</text>
  <text x="82" y="253" text-anchor="end" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">0%</text>

  <text x="90" y="268" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">0</text>
  <text x="242.5" y="268" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">5</text>
  <text x="395" y="268" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">10</text>
  <text x="547.5" y="268" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">15</text>
  <text x="700" y="268" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">20</text>
  <text x="398" y="288" text-anchor="middle" class="svg-mono" font-size="10" fill="var(--muted, #6b6053)">perception error σ, in millimetres (one standard deviation, per axis)</text>

  <polyline fill="none" stroke="var(--blue, #2d5d7c)" stroke-width="2"
            points="90.0,44.0 97.6,44.0 105.2,44.0 112.9,44.0 120.5,44.0 128.1,44.0 135.8,44.0 143.4,44.0 151.0,44.0 158.6,44.0 166.2,44.1 173.9,44.3 181.5,44.8 196.8,47.5 212.0,53.1 227.2,61.4 242.5,71.9 257.8,83.4 273.0,95.4 288.2,107.1 303.5,118.3 318.8,128.7 334.0,138.3 349.2,147.1 364.5,155.1 379.8,162.4 395.0,168.9 410.2,174.9 425.5,180.3 440.8,185.1 456.0,189.6 471.2,193.6 486.5,197.2 501.8,200.6 517.0,203.6 532.2,206.4 547.5,209.0 562.8,211.3 578.0,213.5 593.2,215.4 608.5,217.3 623.8,219.0 639.0,220.5 654.2,222.0 669.5,223.4 684.8,224.6 700.0,225.8"/>

  <circle cx="90" cy="44" r="4" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <circle cx="151" cy="44" r="4" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <circle cx="242.5" cy="72.7" r="4" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <circle cx="395" cy="169.2" r="4" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>
  <circle cx="700" cy="226.4" r="4" fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.5"/>

  <text x="168" y="38" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">100% at σ = 0 and σ = 2 mm</text>
  <text x="242.5" y="62" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">86%</text>
  <text x="395" y="196" text-anchor="middle" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">39%</text>
  <text x="690" y="244" text-anchor="end" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">11%</text>

  <circle cx="395" cy="169.2" r="9" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.5"/>
  <line x1="466" y1="92" x2="404" y2="161"
        stroke="var(--muted, #6b6053)" stroke-width="1.2" marker-end="url(#noiseSweepArrow)"/>
  <text x="472" y="73" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">σ = 10 mm: the typical error now equals</text>
  <text x="472" y="86" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">the entire grasp tolerance</text>

  <text x="306" y="107" class="svg-disp" font-size="13" font-weight="600" fill="var(--blue, #2d5d7c)">1 - exp(-r² / 2σ²)</text>
  <line x1="302" y1="103" x2="281" y2="100" stroke="var(--muted, #6b6053)" stroke-width="1.1"/>

  <text x="100" y="240" class="svg-mono" font-size="9.5" fill="var(--muted, #6b6053)">line: the closed form   ·   dots: 10,000 measured episodes at each σ</text>

  <defs>
    <marker id="noiseSweepArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
