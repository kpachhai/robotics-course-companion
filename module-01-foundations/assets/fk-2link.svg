<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img" aria-label="The two-link planar arm: joint angle theta 1 at the base measured from the x-axis, theta 2 at the elbow measured from link 1, link lengths l1 and l2, the end-effector position, and the forward-kinematics equations">
  <text x="360" y="30" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">two revolute joints in a plane · the worked example this course keeps coming back to</text>

  <line x1="45" y1="300" x2="355" y2="300"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>
  <line x1="45" y1="300" x2="45" y2="70"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>

  <line x1="309" y1="84" x2="309" y2="300"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="309" y1="84" x2="45" y2="84"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="37" y="88" text-anchor="end" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">y</text>
  <text x="309" y="316" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">x</text>

  <line x1="235" y1="211" x2="289" y2="186"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"/>

  <line x1="45" y1="300" x2="235" y2="211"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>
  <line x1="235" y1="211" x2="309" y2="84"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>

  <circle cx="45" cy="300" r="6"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="235" cy="211" r="6"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="309" cy="84" r="7"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.8"/>

  <path d="M99,300 A54,54 0 0 0 94,277" fill="none"
        stroke="var(--gold, #b07d22)" stroke-width="1.6" marker-end="url(#fk2linkAngleArrow)"/>
  <path d="M273,193 A42,42 0 0 0 256,175" fill="none"
        stroke="var(--gold, #b07d22)" stroke-width="1.6" marker-end="url(#fk2linkAngleArrow)"/>
  <text x="116" y="285" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">θ1</text>
  <text x="273" y="174" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">θ2</text>

  <text x="131" y="236" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">l1</text>
  <text x="253" y="136" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">l2</text>
  <text x="245" y="232" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">elbow</text>

  <text x="321" y="74" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">end-effector</text>
  <text x="321" y="90" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the pose FK computes</text>

  <text x="45" y="334" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">θ1 is measured from the world x-axis · θ2 from link 1 extended (dashed)</text>

  <rect x="418" y="104" width="286" height="196" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="561" y="132" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">Forward kinematics</text>
  <line x1="436" y1="142" x2="686" y2="142"
        stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <text x="436" y="174" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">x = l1 cos θ1 + l2 cos(θ1 + θ2)</text>
  <text x="436" y="202" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">y = l1 sin θ1 + l2 sin(θ1 + θ2)</text>
  <text x="436" y="230" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">φ = θ1 + θ2</text>
  <text x="436" y="258" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same walk, written as transforms:</text>
  <text x="436" y="273" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">T_0E = Rz(θ1)·Tx(l1)·Rz(θ2)·Tx(l2)</text>
  <text x="436" y="288" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">two angles in · exactly one pose out</text>

  <defs>
    <marker id="fk2linkAngleArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="var(--gold, #b07d22)" stroke-width="1.3"/>
    </marker>
  </defs>
</svg>
