<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268"
     role="img" aria-label="Two torque contributions added together: a feedforward term computed straight from the gravity model, which needs no error to exist, and a PID feedback term that handles only what the model got wrong">

  <text x="26" y="60" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">measured angle</text>
  <text x="26" y="78" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">where the joint is</text>

  <line x1="152" y1="56" x2="196" y2="56"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pffArrowA)"/>

  <rect x="202" y="28" width="252" height="58" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="222" y="54" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">what you can work out</text>
  <text x="222" y="72" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">m·g·l·sin θ, gravity's pull right now</text>

  <line x1="454" y1="56" x2="520" y2="56"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pffArrowB)"/>
  <text x="462" y="46" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">no error needed</text>

  <text x="26" y="180" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">error</text>
  <text x="26" y="198" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">target − measured</text>

  <line x1="152" y1="176" x2="196" y2="176"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pffArrowC)"/>

  <rect x="202" y="148" width="252" height="58" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="222" y="174" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">what you cannot</text>
  <text x="222" y="192" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">PID: friction, payload, the shove</text>

  <line x1="454" y1="176" x2="520" y2="176"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pffArrowD)"/>
  <text x="462" y="166" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the leftovers</text>

  <path d="M 528 56 L 556 56 L 556 100" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pffSumA)"/>
  <path d="M 528 176 L 556 176 L 556 132" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pffSumB)"/>

  <circle cx="556" cy="116" r="17"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="556" y="122" text-anchor="middle" class="svg-disp" font-size="16" font-weight="700"
        fill="var(--green, #15614e)">+</text>

  <line x1="573" y1="116" x2="612" y2="116"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pffOut)"/>
  <text x="620" y="112" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">torque</text>
  <text x="620" y="130" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">to the motor</text>

  <text x="360" y="243" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the model carries the predictable load; the loop is left with a much smaller job</text>

  <defs>
    <marker id="pffArrowA" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="pffArrowB" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="pffArrowC" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="pffArrowD" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="pffSumA" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="pffSumB" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
    <marker id="pffOut" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
