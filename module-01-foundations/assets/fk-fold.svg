<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 196" role="img" aria-label="Forward kinematics as a fold along the chain: start at the base frame, then for each joint multiply by a constant bolt-on transform followed by the joint's own rotation, and the accumulated transform is the hand pose">
  <rect x="20" y="48" width="128" height="76" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="84" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">base frame</text>
  <text x="84" y="96" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">T = identity</text>
  <text x="84" y="112" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the fold starts here</text>

  <rect x="176" y="48" width="150" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="251" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">link 1</text>
  <text x="251" y="96" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">T_fix1 · Rz(θ1)</text>
  <text x="251" y="112" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">bolted on, then turned</text>

  <rect x="354" y="48" width="150" height="76" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="429" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">link 2</text>
  <text x="429" y="96" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">T_fix2 · Rz(θ2)</text>
  <text x="429" y="112" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">bolted on, then turned</text>

  <rect x="532" y="48" width="188" height="76" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="626" y="76" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">hand pose</text>
  <text x="626" y="96" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">whatever T ended up as</text>
  <text x="626" y="112" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">position and orientation</text>

  <line x1="150" y1="86" x2="172" y2="86"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fkFoldArrow)"/>
  <line x1="328" y1="86" x2="350" y2="86"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fkFoldArrow)"/>
  <line x1="506" y1="86" x2="528" y2="86"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#fkFoldArrow)"/>

  <path d="M176,134 L176,144 L504,144 L504,134" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.2"/>
  <text x="340" y="162" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">one pair per joint · a 6-axis arm has six of these, a humanoid has thirty</text>
  <text x="370" y="186" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">T = identity;  then  T ← T · T_fix · Rz(θ)  for each joint, in order</text>

  <defs>
    <marker id="fkFoldArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
