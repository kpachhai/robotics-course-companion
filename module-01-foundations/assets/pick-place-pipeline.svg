<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 332" role="img" aria-label="The milestone pick-and-place pipeline: an eight-state machine from idle to home, the four steps every transition runs underneath, and the evaluation sweep that measures where scripted motion breaks">

  <text x="14" y="24" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--blue, #2d5d7c)">The state machine · eight states, one match dispatch</text>

  <rect x="14" y="36" width="76" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="52" y="59" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Idle</text>
  <text x="52" y="77" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">run starts</text>

  <rect x="110" y="36" width="76" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="148" y="59" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Hover</text>
  <text x="148" y="77" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">above block</text>

  <rect x="206" y="36" width="76" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="244" y="59" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Descend</text>
  <text x="244" y="77" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">onto block</text>

  <rect x="302" y="36" width="76" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="340" y="59" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Grasp</text>
  <text x="340" y="77" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">grip closes</text>

  <rect x="398" y="36" width="76" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="436" y="59" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Lift</text>
  <text x="436" y="77" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">clear table</text>

  <rect x="494" y="36" width="76" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="532" y="59" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Carry</text>
  <text x="532" y="77" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">to the bin</text>

  <rect x="590" y="36" width="76" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="628" y="59" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Release</text>
  <text x="628" y="77" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">grip opens</text>

  <rect x="686" y="36" width="76" height="54" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="724" y="59" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">Home</text>
  <text x="724" y="77" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">rest pose</text>

  <line x1="94" y1="63" x2="106" y2="63"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pickPlaceArrow)"/>
  <line x1="190" y1="63" x2="202" y2="63"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pickPlaceArrow)"/>
  <line x1="286" y1="63" x2="298" y2="63"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pickPlaceArrow)"/>
  <line x1="382" y1="63" x2="394" y2="63"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pickPlaceArrow)"/>
  <line x1="478" y1="63" x2="490" y2="63"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pickPlaceArrow)"/>
  <line x1="574" y1="63" x2="586" y2="63"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pickPlaceArrow)"/>
  <line x1="670" y1="63" x2="682" y2="63"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pickPlaceArrow)"/>

  <line x1="340" y1="90" x2="340" y2="100"
        stroke="var(--muted, #6b6053)" stroke-width="1.3"/>
  <text x="340" y="113" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the grasp only counts within 1 cm and 10°</text>

  <text x="56" y="142" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--green, #15614e)">What every arrow above actually runs</text>

  <rect x="56" y="154" width="142" height="50" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="127" y="175" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">Target pose</text>
  <text x="127" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">x, y, θ of the hand</text>

  <rect x="230" y="154" width="142" height="50" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="301" y="175" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">Inverse kinematics</text>
  <text x="301" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">damped least squares</text>

  <rect x="404" y="154" width="142" height="50" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="475" y="175" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">Interpolate</text>
  <text x="475" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">θ(t) in joint space</text>

  <rect x="578" y="154" width="142" height="50" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="649" y="175" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">Step and draw</text>
  <text x="649" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one animation frame</text>

  <line x1="202" y1="179" x2="226" y2="179"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pickPlaceArrow)"/>
  <line x1="376" y1="179" x2="400" y2="179"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pickPlaceArrow)"/>
  <line x1="550" y1="179" x2="574" y2="179"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#pickPlaceArrow)"/>

  <text x="56" y="232" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--ox, #9c3b2e)">The evaluation · where the writeup's numbers come from</text>

  <rect x="56" y="244" width="664" height="64" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="388" y="268" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--ox, #9c3b2e)">Randomise the block, then corrupt the perception</text>
  <text x="388" y="286" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">100 headless episodes · success = the block ends inside the bin</text>
  <text x="388" y="299" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">then sweep σ = 0, 2, 5, 10, 20 mm on the reported block pose and plot success rate</text>

  <text x="390" y="325" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">It will work; measuring exactly where it stops working is the point.</text>

  <defs>
    <marker id="pickPlaceArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
