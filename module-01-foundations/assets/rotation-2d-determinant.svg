<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Three two-by-two matrices applied to the same dashed unit square. A rotation keeps the area and the sweep direction, determinant plus one. A swap of the axes lands on the same square but sweeps the other way, determinant minus one. A rotation scaled by 0.8 shrinks the square, determinant 0.64.">
  <text x="360" y="26" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">dashed = the unit square before · filled = where each matrix sends it · arrows 1 and 2 are its two columns</text>

  <!-- ============ panel 1: an honest rotation ============ -->
  <polygon points="115,240 195,240 195,160 115,160"
           fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.1" stroke-dasharray="4 4"/>
  <polygon points="115,240 176.3,188.6 124.9,127.3 63.6,178.7"
           fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <path d="M141.0,218.1 A34,34 0 0 0 93.1,214.0"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.2" marker-end="url(#detSweepArrow)"/>
  <line x1="115" y1="240" x2="176.3" y2="188.6"
        stroke="var(--green, #15614e)" stroke-width="1.9" marker-end="url(#detGreenArrow)"/>
  <line x1="115" y1="240" x2="63.6" y2="178.7"
        stroke="var(--green, #15614e)" stroke-width="1.9" marker-end="url(#detGreenArrow)"/>
  <text x="153" y="226" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">1</text>
  <text x="78" y="219" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">2</text>
  <text x="120" y="268" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--green, #15614e)">det = +1</text>
  <text x="120" y="286" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">area kept · sweep kept</text>

  <!-- ============ panel 2: orthonormal, but a mirror ============ -->
  <polygon points="310,240 390,240 390,160 310,160"
           fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.1" stroke-dasharray="4 4"/>
  <polygon points="310,240 310,160 390,160 390,240"
           fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <path d="M310,206 A34,34 0 0 1 344,240"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.2" marker-end="url(#detSweepArrow)"/>
  <line x1="310" y1="240" x2="310" y2="160"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.9" marker-end="url(#detOxArrow)"/>
  <line x1="310" y1="240" x2="390" y2="240"
        stroke="var(--ox, #9c3b2e)" stroke-width="1.9" marker-end="url(#detOxArrow)"/>
  <text x="300" y="204" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">1</text>
  <text x="350" y="232" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">2</text>
  <text x="350" y="268" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">det = −1</text>
  <text x="350" y="286" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same square · sweep reversed</text>

  <!-- ============ panel 3: a rotation that has drifted ============ -->
  <polygon points="576,240 656,240 656,160 576,160"
           fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.1" stroke-dasharray="4 4"/>
  <polygon points="576,240 625,198.9 583.9,149.8 534.9,191"
           fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <path d="M597.4,222.0 A28,28 0 0 0 558.0,218.6"
        fill="none" stroke="var(--muted, #6b6053)" stroke-width="1.2" marker-end="url(#detSweepArrow)"/>
  <line x1="576" y1="240" x2="625" y2="198.9"
        stroke="var(--gold, #b07d22)" stroke-width="1.9" marker-end="url(#detGoldArrow)"/>
  <line x1="576" y1="240" x2="534.9" y2="191"
        stroke="var(--gold, #b07d22)" stroke-width="1.9" marker-end="url(#detGoldArrow)"/>
  <text x="608" y="229" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">1</text>
  <text x="546" y="223" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">2</text>
  <text x="580" y="268" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--gold, #b07d22)">det = 0.64</text>
  <text x="580" y="286" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">every length × 0.8 · area × 0.64</text>

  <defs>
    <marker id="detGreenArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--green, #15614e)"/>
    </marker>
    <marker id="detOxArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
    <marker id="detGoldArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--gold, #b07d22)"/>
    </marker>
    <marker id="detSweepArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,7 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
