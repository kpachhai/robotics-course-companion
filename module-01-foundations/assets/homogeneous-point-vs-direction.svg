<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-label="A point padded with a one comes out of the transform rotated and shifted, while a direction padded with a zero comes out rotated only, because the zero switches off the translation column">
  <text x="300" y="32" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the fourth number decides whether the shift applies</text>

  <path d="M60,54 L52,54 L52,152 L60,152" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <path d="M120,54 L128,54 L128,152 L120,152" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <rect x="64" y="60" width="52" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="90" y="94" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">p</text>
  <rect x="64" y="122" width="52" height="26" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="90" y="141" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">1</text>

  <line x1="142" y1="103" x2="190" y2="103"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#homoWArrow)"/>
  <text x="168" y="92" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">T</text>

  <path d="M208,54 L200,54 L200,152 L208,152" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <path d="M320,54 L328,54 L328,152 L320,152" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <rect x="212" y="60" width="104" height="56" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="264" y="94" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">R p + t</text>
  <rect x="212" y="122" width="104" height="26" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="264" y="141" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">1</text>

  <text x="352" y="98" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">a place</text>
  <text x="352" y="116" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">turned, then shifted</text>

  <path d="M60,164 L52,164 L52,262 L60,262" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <path d="M120,164 L128,164 L128,262 L120,262" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <rect x="64" y="170" width="52" height="56" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="90" y="204" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">v</text>
  <rect x="64" y="232" width="52" height="26" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="90" y="251" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">0</text>

  <line x1="142" y1="213" x2="190" y2="213"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#homoWArrow)"/>
  <text x="168" y="202" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">T</text>

  <path d="M208,164 L200,164 L200,262 L208,262" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <path d="M320,164 L328,164 L328,262 L320,262" fill="none"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.6"/>
  <rect x="212" y="170" width="104" height="56" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="264" y="204" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">R v</text>
  <rect x="212" y="232" width="104" height="26" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="264" y="251" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">0</text>

  <text x="352" y="208" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--muted, #6b6053)">a direction</text>
  <text x="352" y="226" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">turned; the shift cannot reach it</text>

  <text x="290" y="292" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">velocities, joint axes and surface normals are directions: pad them with 0</text>

  <defs>
    <marker id="homoWArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
