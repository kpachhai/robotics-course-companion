<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="A dashed circle of one centimetre radius drawn around the block's true position. A reported position that lands inside the circle leads to a successful grasp; a reported position outside it leads to the gripper closing on air. The five states after the grasp run identically in both cases.">

  <circle cx="200" cy="160" r="86" fill="none"
          stroke="var(--blue, #2d5d7c)" stroke-width="1.6" stroke-dasharray="5 4"/>

  <line x1="200" y1="160" x2="114" y2="160"
        stroke="var(--muted, #6b6053)" stroke-width="1.1"/>
  <text x="155" y="153" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">1 cm</text>

  <line x1="214" y1="152" x2="239" y2="139"
        stroke="var(--muted, #6b6053)" stroke-width="1.2" marker-end="url(#graspBandArrow)"/>
  <line x1="213" y1="169" x2="294" y2="226"
        stroke="var(--muted, #6b6053)" stroke-width="1.2" marker-end="url(#graspBandArrow)"/>

  <rect x="189" y="149" width="22" height="22" rx="4"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="200" y="192" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">actually here</text>

  <circle cx="247" cy="135" r="6.5"
          fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.5"/>
  <text x="247" y="119" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reported</text>

  <circle cx="302" cy="231" r="6.5"
          fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.5"/>
  <text x="302" y="252" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reported</text>

  <line x1="256" y1="133" x2="424" y2="127"
        stroke="var(--muted, #6b6053)" stroke-width="1.2" marker-end="url(#graspBandArrow)"/>
  <line x1="311" y1="230" x2="424" y2="222"
        stroke="var(--muted, #6b6053)" stroke-width="1.2" marker-end="url(#graspBandArrow)"/>

  <rect x="430" y="100" width="300" height="58" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="580" y="123" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">The gripper closes on the block</text>
  <text x="580" y="142" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">it leaves held off-centre by exactly the error</text>

  <rect x="430" y="196" width="300" height="58" rx="8"
        fill="var(--ox-soft, #f1ddd6)" stroke="var(--ox, #9c3b2e)" stroke-width="1.6"/>
  <text x="580" y="219" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--ox, #9c3b2e)">The gripper closes on air</text>
  <text x="580" y="238" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the arm carries nothing to the bin, then homes</text>

  <text x="580" y="279" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">The five states after the grasp run identically either way.</text>

  <defs>
    <marker id="graspBandArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
