<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 268" role="img" aria-label="Three rows track where each unit axis ends up when a 90 degree rotation about x is applied first and a 90 degree rotation about z second. The x axis stays put then becomes the y axis; the y axis becomes the z axis and stays; the z axis becomes minus y and then becomes the x axis. The three final triples are the three columns of the product matrix.">
  <text x="374" y="26" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">the rightmost matrix acts first · follow one axis per row, left to right</text>

  <text x="100" y="78" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">start</text>
  <text x="207" y="78" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">apply R<tspan font-size="9.5" dy="3">x</tspan><tspan dy="-3">(90°) first</tspan></text>
  <text x="421" y="78" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">then R<tspan font-size="9.5" dy="3">z</tspan><tspan dy="-3">(90°)</tspan></text>
  <text x="528" y="78" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--muted, #6b6053)">where it lands</text>

  <!-- ============ row 1: the x axis ============ -->
  <text x="38" y="113" text-anchor="end" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">x</text>
  <rect x="48" y="92" width="104" height="32" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="100" y="113" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--purple, #5e2d8c)">(1, 0, 0)</text>
  <line x1="158" y1="108" x2="256" y2="108"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#composeFlowArrow)"/>
  <rect x="262" y="92" width="104" height="32" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="314" y="113" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">(1, 0, 0)</text>
  <line x1="372" y1="108" x2="470" y2="108"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#composeFlowArrow)"/>
  <rect x="476" y="92" width="104" height="32" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="528" y="113" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--green, #15614e)">(0, 1, 0)</text>
  <text x="596" y="113" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">= column 1 of R_z R_x</text>

  <!-- ============ row 2: the y axis ============ -->
  <text x="38" y="163" text-anchor="end" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">y</text>
  <rect x="48" y="142" width="104" height="32" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="100" y="163" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--purple, #5e2d8c)">(0, 1, 0)</text>
  <line x1="158" y1="158" x2="256" y2="158"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#composeFlowArrow)"/>
  <rect x="262" y="142" width="104" height="32" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="314" y="163" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">(0, 0, 1)</text>
  <line x1="372" y1="158" x2="470" y2="158"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#composeFlowArrow)"/>
  <rect x="476" y="142" width="104" height="32" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="528" y="163" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--green, #15614e)">(0, 0, 1)</text>
  <text x="596" y="163" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">= column 2</text>

  <!-- ============ row 3: the z axis ============ -->
  <text x="38" y="213" text-anchor="end" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--purple, #5e2d8c)">z</text>
  <rect x="48" y="192" width="104" height="32" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="100" y="213" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--purple, #5e2d8c)">(0, 0, 1)</text>
  <line x1="158" y1="208" x2="256" y2="208"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#composeFlowArrow)"/>
  <rect x="262" y="192" width="104" height="32" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="314" y="213" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--blue, #2d5d7c)">(0, −1, 0)</text>
  <line x1="372" y1="208" x2="470" y2="208"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#composeFlowArrow)"/>
  <rect x="476" y="192" width="104" height="32" rx="8"
        fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <text x="528" y="213" text-anchor="middle" class="svg-disp" font-size="14" font-weight="600"
        fill="var(--green, #15614e)">(1, 0, 0)</text>
  <text x="596" y="213" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">= column 3</text>

  <text x="374" y="248" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">stack the three landings side by side and you have written down R_z(90°) R_x(90°)</text>

  <defs>
    <marker id="composeFlowArrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
