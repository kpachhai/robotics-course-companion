<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="Reaching a point and reaching it facing the right way are different questions: a two-joint arm offers exactly two hand headings at any reachable point, while a three-joint arm has a ring between radius 0.70 and 1.30, plus a small disc at the base, where every heading is available">
  <line x1="320" y1="40" x2="320" y2="316"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.2"/>

  <path fill-rule="evenodd" fill="var(--blue-soft, #dfeaf0)" stroke="none"
        d="M49.6,175 a105.4,105.4 0 1,0 210.8,0 a105.4,105.4 0 1,0 -210.8,0
           M136.4,175 a18.6,18.6 0 1,0 37.2,0 a18.6,18.6 0 1,0 -37.2,0"/>
  <circle cx="155" cy="175" r="105.4" fill="none"
          stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="155" cy="175" r="18.6" fill="none"
          stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="155" cy="175" r="5"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>

  <circle cx="210.8" cy="137.8" r="30" fill="none"
          stroke="var(--ox, #9c3b2e)" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="208.3" y1="120" x2="204.8" y2="94.2"
        stroke="var(--green, #15614e)" stroke-width="2" marker-end="url(#rvdHead)"/>
  <line x1="226.3" y1="146.9" x2="248.7" y2="160.1"
        stroke="var(--green, #15614e)" stroke-width="2" marker-end="url(#rvdHead)"/>
  <circle cx="210.8" cy="137.8" r="5.5"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.8"/>
  <line x1="200" y1="48" x2="204" y2="88"
        stroke="var(--green, #15614e)" stroke-width="1"/>
  <text x="200" y="42" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--green, #15614e)">+97.9°</text>
  <line x1="270" y1="204" x2="250" y2="164"
        stroke="var(--green, #15614e)" stroke-width="1"/>
  <text x="272" y="210" class="svg-mono" font-size="9.5"
        fill="var(--green, #15614e)">-30.5°</text>

  <path fill-rule="evenodd" fill="var(--green-soft, #e3ede7)" stroke="none"
        d="M399.4,175 a80.6,80.6 0 1,0 161.2,0 a80.6,80.6 0 1,0 -161.2,0
           M436.6,175 a43.4,43.4 0 1,0 86.8,0 a43.4,43.4 0 1,0 -86.8,0"/>
  <circle cx="480" cy="175" r="130.2" fill="none"
          stroke="var(--muted, #6b6053)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <circle cx="480" cy="175" r="80.6" fill="none"
          stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <circle cx="480" cy="175" r="43.4" fill="none"
          stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <circle cx="480" cy="175" r="6.2"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.6"/>
  <circle cx="480" cy="175" r="1.6" fill="var(--green, #15614e)"/>

  <line x1="543.5" y1="135.1" x2="561.5" y2="135.1"
        stroke="var(--green, #15614e)" stroke-width="1.6" marker-end="url(#rvdHead)"/>
  <line x1="538.8" y1="123.8" x2="551.5" y2="111.1"
        stroke="var(--green, #15614e)" stroke-width="1.6" marker-end="url(#rvdHead)"/>
  <line x1="527.5" y1="119.1" x2="527.5" y2="101.1"
        stroke="var(--green, #15614e)" stroke-width="1.6" marker-end="url(#rvdHead)"/>
  <line x1="516.2" y1="123.8" x2="503.5" y2="111.1"
        stroke="var(--green, #15614e)" stroke-width="1.6" marker-end="url(#rvdHead)"/>
  <line x1="511.5" y1="135.1" x2="493.5" y2="135.1"
        stroke="var(--green, #15614e)" stroke-width="1.6" marker-end="url(#rvdHead)"/>
  <line x1="516.2" y1="146.5" x2="503.5" y2="159.2"
        stroke="var(--green, #15614e)" stroke-width="1.6" marker-end="url(#rvdHead)"/>
  <line x1="527.5" y1="151.1" x2="527.5" y2="169.1"
        stroke="var(--green, #15614e)" stroke-width="1.6" marker-end="url(#rvdHead)"/>
  <line x1="538.8" y1="146.5" x2="551.5" y2="159.2"
        stroke="var(--green, #15614e)" stroke-width="1.6" marker-end="url(#rvdHead)"/>
  <circle cx="527.5" cy="135.1" r="5.5"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.8"/>

  <text x="480" y="32" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">reachable at all: r up to 2.10</text>
  <line x1="480" y1="256" x2="480" y2="268"
        stroke="var(--green, #15614e)" stroke-width="1.1"/>
  <text x="480" y="282" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--green, #15614e)">any heading works in here</text>

  <text x="40" y="338" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">two joints: the heading comes with the point</text>
  <text x="40" y="356" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">exactly two headings available here, out of 360</text>
  <text x="40" y="372" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">links 1.00 and 0.70</text>
  <text x="360" y="338" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">three joints: the heading is yours to pick</text>
  <text x="360" y="356" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">inside the green ring (0.70 to 1.30) every heading works</text>
  <text x="360" y="372" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">so does the pinprick at the base · together about 27% of the reach</text>

  <defs>
    <marker id="rvdHead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="var(--green, #15614e)"/>
    </marker>
  </defs>
</svg>
