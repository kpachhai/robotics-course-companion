<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-label="The damped-least-squares inverse kinematics loop drawn left to right: measure how far the hand is from the target, build the Jacobian at the current pose, solve the damped system for a joint step, take a fraction of that step, then feed the new joint angles back to the start">
  <rect x="16" y="56" width="148" height="64" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="90" y="80" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">e = p* - FK(θ)</text>
  <text x="90" y="97" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">how far the hand is</text>
  <text x="90" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">from where you want it</text>

  <rect x="190" y="56" width="148" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="264" y="80" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">J(θ)</text>
  <text x="264" y="97" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">joints to hand,</text>
  <text x="264" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">true only at this pose</text>

  <rect x="364" y="56" width="148" height="64" rx="8"
        fill="var(--purple-soft, #ede0f5)" stroke="var(--purple, #5e2d8c)" stroke-width="1.6"/>
  <text x="438" y="80" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--purple, #5e2d8c)">Δθ = Jᵀ M⁻¹ e</text>
  <text x="438" y="97" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">M = J Jᵀ + λ² I</text>
  <text x="438" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">damped least squares</text>

  <rect x="538" y="56" width="148" height="64" rx="8"
        fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <text x="612" y="80" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--blue, #2d5d7c)">θ ← θ + α Δθ</text>
  <text x="612" y="97" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">α = 0.5, a half step</text>
  <text x="612" y="110" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">deliberately timid</text>

  <line x1="164" y1="88" x2="184" y2="88"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#ikLoopArrow)"/>
  <line x1="338" y1="88" x2="358" y2="88"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#ikLoopArrow)"/>
  <line x1="512" y1="88" x2="532" y2="88"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#ikLoopArrow)"/>

  <path d="M612,120 L612,170 L90,170 L90,126" fill="none"
        stroke="var(--muted, #6b6053)" stroke-width="1.3" marker-end="url(#ikLoopArrow)"/>
  <text x="351" y="188" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">J was only true at the old pose, so every pass rebuilds it · stop when ‖e‖ &lt; 1e-6, a median of 22 passes</text>

  <text x="16" y="216" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">nothing here knows it is a two-link arm · the same four boxes run any mechanism whose Jacobian you can write</text>

  <defs>
    <marker id="ikLoopArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted, #6b6053)"/>
    </marker>
  </defs>
</svg>
