<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" role="img" aria-label="The closed-form inverse kinematics of a two-link arm drawn as a triangle: the base, the elbow and the target form a triangle whose three side lengths are l1, l2 and the distance r, so the law of cosines fixes the elbow angle, and the second solution is the same triangle mirrored about r">
  <line x1="60" y1="240" x2="300" y2="240"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>
  <line x1="60" y1="240" x2="60" y2="108"
        stroke="var(--line-2, #c8bca3)" stroke-width="1.4"/>
  <text x="52" y="112" text-anchor="end" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">y</text>
  <text x="300" y="256" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">x</text>

  <line x1="60" y1="240" x2="228" y2="198"
        stroke="var(--green, #15614e)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="144" y="212" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--green, #15614e)">r</text>

  <line x1="60" y1="240" x2="152.8" y2="135.2"
        stroke="var(--gold, #b07d22)" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 5"/>
  <line x1="152.8" y1="135.2" x2="228" y2="198"
        stroke="var(--gold, #b07d22)" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 5"/>
  <circle cx="152.8" cy="135.2" r="6"
          fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="152.8" y="112" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">the other elbow</text>
  <text x="152.8" y="126" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">same triangle, mirrored about r</text>

  <line x1="191.2" y1="288.8" x2="230.6" y2="303.4"
        stroke="var(--muted, #6b6053)" stroke-width="1.2" stroke-dasharray="4 4"/>

  <line x1="60" y1="240" x2="191.2" y2="288.8"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>
  <line x1="191.2" y1="288.8" x2="228" y2="198"
        stroke="var(--blue, #2d5d7c)" stroke-width="5" stroke-linecap="round"/>

  <circle cx="60" cy="240" r="6"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="191.2" cy="288.8" r="6"
          fill="var(--blue-soft, #dfeaf0)" stroke="var(--blue, #2d5d7c)" stroke-width="1.6"/>
  <circle cx="228" cy="198" r="7"
          fill="var(--green-soft, #e3ede7)" stroke="var(--green, #15614e)" stroke-width="1.8"/>

  <path d="M106,240 A46,46 0 0 1 103.1,256" fill="none"
        stroke="var(--gold, #b07d22)" stroke-width="1.6" marker-end="url(#ikTriangleAngle)"/>
  <path d="M215.6,297.9 A26,26 0 0 0 201,264.7" fill="none"
        stroke="var(--gold, #b07d22)" stroke-width="1.6" marker-end="url(#ikTriangleAngle)"/>
  <text x="94" y="278" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">θ1</text>
  <text x="227" y="279" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--gold, #b07d22)">θ2</text>

  <text x="128" y="284" text-anchor="middle" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">l1</text>
  <text x="226" y="250" class="svg-disp" font-size="14" font-weight="700"
        fill="var(--blue, #2d5d7c)">l2</text>

  <text x="52" y="256" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">base</text>
  <text x="185" y="308" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">elbow</text>
  <text x="238" y="194" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--green, #15614e)">target</text>
  <text x="238" y="209" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">(1.20, 0.30)</text>

  <text x="60" y="336" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">θ2 is fixed by the three side lengths alone · θ1 aims at the target, then backs off by what link 2 steals</text>

  <rect x="396" y="86" width="308" height="236" rx="8"
        fill="var(--gold-soft, #f3e7c9)" stroke="var(--gold, #b07d22)" stroke-width="1.6"/>
  <text x="550" y="112" text-anchor="middle" class="svg-disp" font-size="13" font-weight="600"
        fill="var(--gold, #b07d22)">The closed form</text>
  <line x1="414" y1="122" x2="686" y2="122"
        stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <text x="414" y="148" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">cos θ2 = (r² - l1² - l2²) / 2 l1 l2</text>
  <text x="414" y="166" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one distance in, one elbow angle out, twice: plus and minus</text>
  <text x="414" y="196" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">β = atan2(y, x)</text>
  <text x="414" y="218" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">ψ = atan2(l2 sin θ2, l1 + l2 cos θ2)</text>
  <text x="414" y="240" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">θ1 = β - ψ</text>
  <text x="414" y="264" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">worked: r = 1.2369 · cos θ2 = 0.0286</text>
  <text x="414" y="279" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">θ2 = ±88.36° · β = 14.04° · ψ = ±34.45°</text>
  <text x="414" y="294" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">θ1 = -20.41°  or  +48.49°</text>
  <text x="414" y="311" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">|cos θ2| &gt; 1 means no triangle, so no solution</text>

  <defs>
    <marker id="ikTriangleAngle" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="var(--gold, #b07d22)" stroke-width="1.3"/>
    </marker>
  </defs>
</svg>
