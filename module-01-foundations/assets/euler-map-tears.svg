<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" role="img" aria-label="The same journey over the top of a sphere drawn twice: on the globe it is one smooth arc across the pole, while on the flat yaw and pitch chart the track hits the top edge and reappears one hundred and eighty degrees away, because the whole top edge of the chart is a single direction">
  <text x="350" y="26" text-anchor="middle" class="svg-mono" font-size="10"
        fill="var(--muted, #6b6053)">one journey over the top, described two ways</text>

  <!-- the globe: the territory -->
  <circle cx="150" cy="186" r="100" fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <ellipse cx="150" cy="186" rx="86.6" ry="100" fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <ellipse cx="150" cy="186" rx="50" ry="100" fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <line x1="150" y1="86" x2="150" y2="286" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <line x1="50" y1="186" x2="250" y2="186" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>

  <path d="M193.3,99.4 A86.6,100 0 0 0 106.7,99.4" fill="none"
        stroke="var(--blue, #2d5d7c)" stroke-width="2.6" marker-end="url(#mapTearArrowB)"/>
  <circle cx="193.3" cy="99.4" r="3.4" fill="var(--blue, #2d5d7c)"/>
  <circle cx="150" cy="86" r="4" fill="var(--gold, #b07d22)"/>
  <text x="150" y="62" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--gold, #b07d22)">straight up</text>
  <text x="150" y="76" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pitch = +90°</text>
  <text x="200" y="112" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">before</text>
  <text x="100" y="112" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">after</text>

  <text x="150" y="318" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--blue, #2d5d7c)">the territory</text>
  <text x="150" y="336" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">one smooth sweep across the top</text>

  <!-- the chart: the map -->
  <rect x="380" y="96" width="300" height="180" rx="4"
        fill="none" stroke="var(--line-2, #c8bca3)" stroke-width="1.3"/>
  <line x1="380" y1="186" x2="680" y2="186" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <line x1="530" y1="96" x2="530" y2="276" stroke="var(--line-2, #c8bca3)" stroke-width="1"/>
  <line x1="380" y1="96" x2="680" y2="96" stroke="var(--ox, #9c3b2e)" stroke-width="2.8"/>

  <line x1="580" y1="126" x2="580" y2="98" stroke="var(--blue, #2d5d7c)" stroke-width="2.6"/>
  <line x1="430" y1="98" x2="430" y2="126" stroke="var(--blue, #2d5d7c)" stroke-width="2.6" marker-end="url(#mapTearArrowB2)"/>
  <circle cx="580" cy="126" r="3.4" fill="var(--blue, #2d5d7c)"/>
  <path d="M574,88 L436,88" fill="none" stroke="var(--ox, #9c3b2e)" stroke-width="1.8"
        stroke-dasharray="5 4" marker-end="url(#mapTearArrowOx)"/>
  <text x="505" y="76" text-anchor="middle" class="svg-disp" font-size="13" font-weight="700"
        fill="var(--ox, #9c3b2e)">180° of yaw, no motion at all</text>

  <text x="374" y="100" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pitch +90</text>
  <text x="374" y="190" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pitch 0</text>
  <text x="374" y="280" text-anchor="end" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">pitch −90</text>
  <text x="380" y="292" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">yaw −180</text>
  <text x="530" y="292" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">0</text>
  <text x="680" y="292" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">+180</text>

  <text x="530" y="318" text-anchor="middle" class="svg-disp" font-size="15" font-weight="700"
        fill="var(--ox, #9c3b2e)">the map</text>
  <text x="530" y="336" text-anchor="middle" class="svg-mono" font-size="9.5"
        fill="var(--muted, #6b6053)">the whole red edge is that one direction</text>

  <defs>
    <marker id="mapTearArrowB" markerWidth="5" markerHeight="5" refX="2.2" refY="2.5" orient="auto">
      <path d="M0,0 L4.5,2.5 L0,5 Z" fill="var(--blue, #2d5d7c)"/>
    </marker>
    <marker id="mapTearArrowB2" markerWidth="5" markerHeight="5" refX="2.2" refY="2.5" orient="auto">
      <path d="M0,0 L4.5,2.5 L0,5 Z" fill="var(--blue, #2d5d7c)"/>
    </marker>
    <marker id="mapTearArrowOx" markerWidth="5" markerHeight="5" refX="2.2" refY="2.5" orient="auto">
      <path d="M0,0 L4.5,2.5 L0,5 Z" fill="var(--ox, #9c3b2e)"/>
    </marker>
  </defs>
</svg>
